                display: "flex", alignItems: "center", gap: 10, padding: "9px 11px", borderRadius: 9, cursor: "pointer",
                fontSize: 13.5, marginBottom: 2, background: active ? "#26313F" : "transparent",
                color: active ? "#fff" : "#B7BFC9", position: "relative",
              }}>
                {active && <span style={{ position: "absolute", left: -12, top: "22%", height: "56%", width: 3, borderRadius: 3, background: item.color || NAVY }} />}
                {item.icon ? <Icon name={item.icon} size={15} color={active ? "#fff" : "#8892A0"} /> : <span style={{ width: 8, height: 8, borderRadius: 99, background: item.color, marginLeft: 2, flexShrink: 0 }} />}
                <span style={{ fontWeight: active ? 600 : 500, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{item.label}</span>
              </div>
            );
          })}
        </div>

        <div style={{ padding: "10px 12px 0" }}>
          {IS_UNC_PATH && (
            <div title="Outil ouvert depuis un dossier réseau : si les connecteurs ci-dessous ne répondent pas, mappez ce dossier sur un lecteur (ex : Z:\) dans l'Explorateur Windows." style={{ fontSize: 10, color: "#FFD98A", background: "#3A2A00", borderRadius: 9, padding: "7px 10px", marginBottom: 8, display: "flex", alignItems: "center", gap: 6, cursor: "help" }}>
              <Icon name="alert" size={12} color="#FFD98A" /> Dossier réseau détecté
            </div>
          )}

          {!FSA_SUPPORTED && (
            <div style={{ fontSize: 10.5, color: "#5C6675", padding: "6px 4px 10px" }}>Chrome ou Edge requis pour l'archive locale.</div>
          )}

          <div style={{ background: "#171E27", borderRadius: 12, padding: 12, marginBottom: 8 }}>
            <div style={{ fontSize: 10.5, color: "#8892A0", fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 9 }}>Sauvegarde</div>
            <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
              <button onClick={saveEverywhere} disabled={githubBusy || fsaBusy} title="Enregistre en ligne, et crée une archive locale datée si le dossier réseau est lié" style={{ ...compactBtn, flex: 1, justifyContent: "center", background: NAVY, color: "#fff", border: "none", opacity: (githubBusy || fsaBusy) ? 0.6 : 1 }}>
                <Icon name="download" size={13} color="#fff" /> {githubBusy ? "..." : "Enregistrer"}
              </button>
              <button onClick={loadOnline} disabled={githubBusy || fsaBusy} title="Charger la dernière sauvegarde en ligne" style={{ ...compactBtn, flex: 1, justifyContent: "center", opacity: (githubBusy || fsaBusy) ? 0.6 : 1 }}>
                <Icon name="upload" size={13} /> Charger
              </button>
            </div>

            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 10, color: "#8892A0", marginBottom: 6 }}>
              <span style={{ width: 6, height: 6, borderRadius: 99, flexShrink: 0, background: githubConfig && githubConfig.appKey ? "#4F7942" : "#5C6675" }} />
              <span style={{ flex: 1 }}>En ligne : {githubConfig && githubConfig.appKey ? "configuré" : "non configuré"}</span>
              {isMaitre && <button onClick={() => setTab("github")} style={{ background: "none", border: "none", color: "#5C6675", fontSize: 10, cursor: "pointer", textDecoration: "underline", padding: 0 }}>régler</button>}
            </div>

            {FSA_SUPPORTED && (
              <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 10, color: "#8892A0" }}>
                <span style={{ width: 6, height: 6, borderRadius: 99, flexShrink: 0, background: !archiveDirHandle ? "#5C6675" : archiveDirPermGranted ? "#4F7942" : "#D98C2B" }} />
                <span style={{ flex: 1, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>Archive réseau : {!archiveDirHandle ? "non liée" : archiveDirName}</span>
                {!archiveDirHandle ? (
                  <button onClick={chooseArchiveFolder} disabled={fsaBusy} style={{ background: "none", border: "none", color: "#5C6675", fontSize: 10, cursor: "pointer", textDecoration: "underline", padding: 0, flexShrink: 0 }}>lier</button>
                ) : !archiveDirPermGranted ? (
                  <button onClick={authorizeArchiveDir} disabled={fsaBusy} style={{ background: "none", border: "none", color: "#D98C2B", fontSize: 10, cursor: "pointer", textDecoration: "underline", padding: 0, flexShrink: 0 }}>autoriser</button>
                ) : (
                  <button onClick={forgetArchiveFolder} style={{ background: "none", border: "none", color: "#5C6675", fontSize: 10, cursor: "pointer", textDecoration: "underline", padding: 0, flexShrink: 0 }}>changer</button>
                )}
              </div>
            )}
          </div>

          {FSA_SUPPORTED && (
            <div style={{ background: "#171E27", borderRadius: 12, padding: 4, marginBottom: 10 }}>
              <div onClick={() => setExpandedConnector((c) => (c === "dir" ? null : "dir"))} className="connector-row" style={{ display: "flex", alignItems: "center", gap: 9, padding: "8px 8px", borderRadius: 9, cursor: "pointer" }}>
                <div style={{ width: 28, height: 28, borderRadius: 8, background: "#232C38", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                  <Icon name="clip" size={13} color="#B7BFC9" />
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 11.5, color: "#D7DCE2", fontWeight: 600 }}>Pièces jointes</div>
                  <div style={{ fontSize: 10, color: "#5C6675", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{dirHandle ? dirName : "Non lié"}</div>
                </div>
                <span style={{ width: 7, height: 7, borderRadius: 99, flexShrink: 0, background: !dirHandle ? "#5C6675" : dirPermGranted ? "#4F7942" : "#D98C2B" }} />
                <Icon name={expandedConnector === "dir" ? "chevronDown" : "chevronRight"} size={13} color="#5C6675" />
              </div>
              {expandedConnector === "dir" && (
                <div style={{ padding: "2px 8px 8px" }}>
                  {dirHandle ? (
                    !dirPermGranted ? (
                      <button onClick={authorizeDir} disabled={fsaBusy} style={{ ...compactBtn, background: "#4A3200", color: "#FFD98A", width: "100%", justifyContent: "center" }}>
                        <Icon name="check" size={12} /> {fsaBusy ? "En attente..." : "Autoriser l'accès"}
                      </button>
                    ) : (
                      <button onClick={forgetAttachmentsFolder} title="Changer de dossier" style={{ ...compactBtn, width: "100%", justifyContent: "center" }}>
                        <Icon name="x" size={12} /> Changer
                      </button>
                    )
                  ) : (
                    <button onClick={chooseAttachmentsFolder} disabled={fsaBusy} style={{ ...compactBtn, width: "100%", justifyContent: "center" }}>
                      <Icon name="folder" size={12} /> {fsaBusy ? "En attente..." : "Lier un dossier"}
                    </button>
                  )}
                </div>
              )}
            </div>
          )}

          {FSA_SUPPORTED && (
            <div style={{ padding: "0 2px 4px" }}>
              <button onClick={chooseExistingFile} disabled={fsaBusy} title="Ouvrir un fichier de sauvegarde local (.json) en cas de problème avec la sauvegarde en ligne" style={{ background: "none", border: "none", color: "#4A5462", fontSize: 9.5, cursor: "pointer", textDecoration: "underline", padding: 0 }}>
                Charger une archive locale (dépannage)
              </button>
            </div>
          )}

          <div style={{ fontSize: 10, color: "#5C6675", display: "flex", alignItems: "center", gap: 5, padding: "8px 4px 12px" }}>
            <Icon name="users" size={10} color="#5C6675" /> {pilotes.length} pilote(s) enregistré(s)
          </div>
        </div>
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: "26px 32px" }}>
        <div style={{ background: "#E4E7EC", borderRadius: 16, padding: "24px 28px", marginBottom: 24, textAlign: "center" }}>
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 800, fontSize: 25, color: "#12181F", letterSpacing: 0.2 }}>
            {navItems.find((n) => n.id === tab)?.label || activeDomaine || activeAxe?.label}
          </div>
          <div style={{ fontSize: 13, color: TEXT_MUTE, marginTop: 6 }}>
            {appMode === "plan" && tab === "dashboard" && "Vue d'ensemble de l'activité de l'agence"}
            {appMode === "plan" && tab === "nouvelle" && "Créer une nouvelle action et l'assigner à un pilote"}
            {appMode === "plan" && activeDomaine && `Actions sur le domaine ${activeDomaine}`}
            {appMode === "plan" && tab === "cloturees" && "Historique des actions terminées ou annulées"}
            {appMode === "plan" && tab === "toutes" && "Ensemble des actions du plan, tous domaines confondus"}
            {appMode === "plan" && tab === "gestion" && "Gérer la liste des pilotes et des origines"}
            {appMode === "plan" && tab === "parametres" && "Configurer l'envoi automatique des notifications par email"}
            {appMode === "plan" && tab === "github" && "Sauvegarder et recharger vos données depuis n'importe où, via un dépôt GitHub privé"}
            {appMode === "indicateurs" && tab === "dashboard" && "Vue d'ensemble des indicateurs QSE de l'agence"}
            {appMode === "indicateurs" && activeAxe && activeAxe.label}
            {appMode === "indicateurs" && tab === "toutes-indicateurs" && "Ensemble des indicateurs, tous axes confondus"}
            {appMode === "indicateurs" && tab === "gestion-axes" && "Créer, modifier ou supprimer les axes de suivi"}
          </div>
        </div>

        {appMode === "plan" && tab === "dashboard" && <Dashboard actions={visibleActions} pilotes={pilotes} agency={agency} setTab={setTab} emailConfig={emailConfig} showToast={showToast} onOpenAction={openActionInContext} />}
        {appMode === "plan" && tab === "nouvelle" && <NouvelleAction pilotes={pilotes} agency={agency} onCreate={createAction} onAddPilote={addPilote} origines={origines} onAddOrigine={addOrigine} emailConfig={emailConfig} showToast={showToast} setTab={setTab} />}
        {appMode === "plan" && activeDomaine && (
          <DomaineActions
            actions={visibleActions}
            domaine={activeDomaine}
            agency={agency}
            actionCardProps={{ onUpdate: updateAction, onComment: addComment, onClose: closeAction, onReopen: reopenAction, onDelete: deleteAction, emailConfig, showToast, setTab, origines, pilotes, dirLinked: !!dirHandle, onAddLocalFile: addLocalFile, onOpenLocalFile: openLocalFile, focusRequest }}
          />
        )}
        {appMode === "plan" && tab === "cloturees" && (
          <CloturesActions
            actions={visibleActions}
            agency={agency}
            actionCardProps={{ onUpdate: updateAction, onComment: addComment, onClose: closeAction, onReopen: reopenAction, onDelete: deleteAction, emailConfig, showToast, setTab, origines, pilotes, dirLinked: !!dirHandle, onAddLocalFile: addLocalFile, onOpenLocalFile: openLocalFile, focusRequest }}
          />
        )}
        {appMode === "plan" && tab === "toutes" && <ToutesActions actions={visibleActions} agency={agency} setTab={setTab} onOpenAction={openActionInContext} onExportMatrice={exportToMatricePAA} importBusy={importBusy} importPreview={importPreview} onImportFile={handleImportFile} onConfirmImport={confirmImport} onCancelImport={cancelImport} />}
        {appMode === "plan" && tab === "gestion" && isMaitre && <GestionListes pilotes={pilotes} onUpdatePilotes={persistPilotes} origines={origines} onUpdateOrigines={persistOrigines} showToast={showToast} />}
        {appMode === "plan" && tab === "parametres" && isMaitre && <ParametresEmail emailConfig={emailConfig} onSave={saveEmailConfig} showToast={showToast} unlocked={settingsUnlocked} onUnlock={() => setSettingsUnlocked(true)} />}
        {appMode === "plan" && tab === "github" && isMaitre && <ParametresGitHub githubConfig={githubConfig} onSave={saveGithubConfig} showToast={showToast} unlocked={settingsUnlocked} onUnlock={() => setSettingsUnlocked(true)} />}
        {appMode === "plan" && tab === "comptes" && isMaitre && <GestionComptes roles={roles} pilotes={pilotes} onUpdateRoles={persistRoles} showToast={showToast} />}

        {appMode === "indicateurs" && tab === "dashboard" && <IndicateursDashboard indicateurs={indicateurs} axes={axes} setAxeTab={openAxeTab} agency={agency} actions={actions} />}
        {appMode === "indicateurs" && activeAxe && (
          <AxeIndicateurs indicateurs={indicateurs} axe={activeAxe} axes={axes} onCreate={createIndicateur} onUpdate={updateIndicateur} onDelete={deleteIndicateur} onAddComment={addIndicateurComment} focusRequest={focusRequest} cardView={!LOCKED_AGENCY} />
        )}
        {appMode === "indicateurs" && tab === "toutes-indicateurs" && <ToutesIndicateurs indicateurs={indicateurs} axes={axes} setAxeTab={openAxeTab} agency={agency} />}
        {appMode === "indicateurs" && tab === "gestion-axes" && <GestionAxes axes={axes} indicateurs={indicateurs} onUpdateAxes={persistAxes} showToast={showToast} />}
      </div>

      {dirtyMap[agency] && (
        <div style={{
          position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 900,
          background: "#3A2A00", borderTop: "1px solid #6B4A00", padding: "10px 20px",
          display: "flex", alignItems: "center", justifyContent: "center", gap: 14, flexWrap: "wrap",
          boxShadow: "0 -4px 16px rgba(0,0,0,0.15)",
        }}>
          <span style={{ display: "flex", alignItems: "center", gap: 7, fontSize: 13, color: "#FFD98A", fontFamily: "'Inter', sans-serif" }}>
            <Icon name="alert" size={14} color="#FFD98A" /> Modifications non enregistrées
          </span>
          <button onClick={saveEverywhere} disabled={githubBusy} style={{ ...btnPrimary, padding: "7px 16px", opacity: githubBusy ? 0.6 : 1 }}>
            <Icon name="check" size={13} color="#fff" /> {githubBusy ? "Enregistrement..." : "Enregistrer maintenant"}
          </button>
        </div>
      )}

      {toast && (
        <div style={{ position: "fixed", bottom: dirtyMap[agency] ? 66 : 24, left: "50%", transform: "translateX(-50%)", background: INK, color: "#fff", padding: "10px 18px", borderRadius: 8, fontSize: 13, fontFamily: "'Inter', sans-serif", boxShadow: "0 8px 24px rgba(0,0,0,0.25)", zIndex: 950 }}>
          {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PlanActionApp />);
</script>
<script>
  // Transpile the app source explicitly with the classic JSX runtime (React.createElement),
  // so it does not depend on Babel Standalone's default preset configuration.
  (function () {
    var source = document.getElementById("app-source").textContent;
    var compiled = Babel.transform(source, {
      presets: [["react", { runtime: "classic" }]]
    }).code;
    var script = document.createElement("script");
    script.textContent = compiled;
    document.body.appendChild(script);
  })();
</script>
</body>
</html>
