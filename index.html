function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSetHandle(key, handle) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(handle, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGetHandle(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readonly");
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function idbClearHandle(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");

    tx.oncomplete = () => resolve();

  });
}
async function verifyPermission(handle, write) {
  const opts = { mode: write ? "readwrite" : "read" };
  if ((await handle.queryPermission(opts)) === "granted") return true;
  if ((await handle.requestPermission(opts)) === "granted") return true;

}

}

  : "Aucune réponse du navigateur après quelques secondes : cette fonctionnalité est probablement bloquée par une politique de sécurité de votre poste (contactez votre service informatique).";

function normText(str) {
  return (str || "").toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
}
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
    }
  }
  return dp[m][n];
}
function matchDomaine(str) {
  const clean = normText(str);
  if (!clean) return "Autre";
  let best = null, bestDist = Infinity;
  DOMAINES.forEach((d) => {
    const dist = levenshtein(clean, normText(d.key));
    if (dist < bestDist) { bestDist = dist; best = d.key; }
  });
  return bestDist <= 3 ? best : "Autre";
}
function matchPriorite(str) {
  const clean = normText(str);
  if (!clean) return "Moyenne";
  if (/urgent|critique|bloquant/.test(clean)) return "Critique";
  if (/haute|elevee|important|forte/.test(clean)) return "Haute";
  if (/basse|faible|mineure/.test(clean)) return "Basse";
  if (/moyenne|normale/.test(clean)) return "Moyenne";
  let best = null, bestDist = Infinity;
  PRIORITES.forEach((p) => {
    const dist = levenshtein(clean, normText(p));
    if (dist < bestDist) { bestDist = dist; best = p; }
  });
  return bestDist <= 2 ? best : "Moyenne";
}
function excelSerialToISO(serial) {
  // Numéro de série Excel = nombre de jours depuis le 30/12/1899. On arrondit d'abord pour
  // éliminer le bruit flottant (ex. 46265.000000002) puis on convertit en UTC pur, sans
  // jamais transiter par le fuseau horaire du navigateur.
  const ms = Math.round((serial - 25569) * 86400 * 1000);
  const d = new Date(ms);
  if (isNaN(d)) return null;
  return d.getUTCFullYear() + "-" + pad2(d.getUTCMonth() + 1) + "-" + pad2(d.getUTCDate());
}
function parseExcelDate(value) {
  if (value === null || value === undefined || value === "") return null;
  // Cellule Excel de type Date : lue comme numéro de série brut (le plus fiable, aucune
  // dépendance au fuseau horaire du navigateur qui ouvre le fichier).
  if (typeof value === "number") return excelSerialToISO(value);
  if (value instanceof Date && !isNaN(value)) {
    return value.getUTCFullYear() + "-" + pad2(value.getUTCMonth() + 1) + "-" + pad2(value.getUTCDate());
  }
  const str = value.toString().trim();
  // Dates saisies en texte JJ/MM/AAAA : on construit directement la chaîne, sans passer par un
  // objet Date (qui introduirait un décalage lors d'une conversion vers l'UTC).
  let m = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (m) return m[3] + "-" + pad2(m[2]) + "-" + pad2(m[1]);
  m = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[0].slice(0, 10);
  const d2 = new Date(str);
  if (!isNaN(d2)) return d2.getUTCFullYear() + "-" + pad2(d2.getUTCMonth() + 1) + "-" + pad2(d2.getUTCDate());
  return null;
}
function parseAvancement(value) {
  if (value === null || value === undefined || value === "") return 0;
  let n = Number(value.toString().replace(",", ".").replace("%", ""));
  if (isNaN(n)) return 0;
  if (n <= 1) n = n * 100;
  return Math.max(0, Math.min(100, Math.round(n)));
}

  const year = new Date().getFullYear().toString();

  const normHeaders = headers.map(normText);
  for (const alias of aliases) {

    if (idx !== -1) return idx;
  }
  for (const alias of aliases) {

async function parseExcelFile(file, existingPilotes, existingOrigines) {
  const buffer = await file.arrayBuffer();
  const wb = XLSX.read(buffer, { type: "array" });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null, raw: true });
  if (!rows.length) throw new Error("Fichier vide");
  const headers = rows[0];
  const col = {};
  Object.keys(COLUMN_ALIASES).forEach((k) => { col[k] = matchColumn(headers, COLUMN_ALIASES[k]); });
  if (col.titre === -1) throw new Error("Colonne « Action » introuvable dans le fichier");

  const existingPiloteNames = new Set(existingPilotes.map((p) => p.nom));
  const existingOrigineSet = new Set(existingOrigines);
  const newPilotes = [], newOrigines = [];
  const toImport = [];

  rows.slice(1).forEach((r) => {
    if (!r || r.every((c) => c === null || c === "")) return;
    const titre = col.titre !== -1 ? (r[col.titre] || "").toString().trim() : "";
    if (!titre) return;
    const numeroFichier = col.numero !== -1 && r[col.numero] ? r[col.numero].toString().trim() : null;
    const domaineRaw = col.domaine !== -1 ? r[col.domaine] : "";
    const domaine = matchDomaine(domaineRaw);
    const origine = col.origine !== -1 && r[col.origine] ? r[col.origine].toString().trim() : "";
    const pilote = col.pilote !== -1 && r[col.pilote] ? r[col.pilote].toString().trim() : "";
    const avancement = col.avancement !== -1 ? parseAvancement(r[col.avancement]) : 0;
    const dateEcheance = col.echeance !== -1 ? parseExcelDate(r[col.echeance]) : null;
    const dateCreationFichier = col.dateCreation !== -1 ? parseExcelDate(r[col.dateCreation]) : null;
    const priorite = col.priorite !== -1 && r[col.priorite] ? matchPriorite(r[col.priorite]) : "Moyenne";
    const descriptionAnomalie = col.descriptionAnomalie !== -1 && r[col.descriptionAnomalie] ? r[col.descriptionAnomalie].toString().trim() : "";
    const mesureEfficacite = col.mesureEfficacite !== -1 && r[col.mesureEfficacite] ? r[col.mesureEfficacite].toString().trim() : "";
    const commentaire = col.commentaire !== -1 && r[col.commentaire] ? r[col.commentaire].toString().trim() : "";

    if (pilote && !existingPiloteNames.has(pilote) && !newPilotes.find((p) => p.nom === pilote)) {
      newPilotes.push({ nom: pilote, email: "" });
    }
    if (origine && !existingOrigineSet.has(origine) && !newOrigines.includes(origine)) {
      newOrigines.push(origine);
    }

    const statut = avancement >= 100 ? "Terminé" : avancement > 0 ? "En cours" : "À faire";
    toImport.push({
      id: uid("A"), numero: numeroFichier, domaine, titre, origine, descriptionAnomalie, mesureEfficacite,
      pilote, emailPilote: "", statut, avancement, priorite,
      dateCreation: dateCreationFichier || todayISO(), dateEcheance, dateCloture: statut === "Terminé" ? (dateEcheance || todayISO()) : null,
      commentaires: commentaire ? [{ date: todayISO(), texte: commentaire }] : [],
      pieces: [], dernModif: todayISO(), domaineOriginal: domaineRaw,
    });
  });

  return { toImport, newPilotes, newOrigines };
}

  const p = { fill: "none", stroke: color, strokeWidth: 1.8, strokeLinecap: "round", strokeLinejoin: "round" };
  const svgProps = { width: size, height: size, viewBox: "0 0 24 24", style };
  switch (name) {
    case "dashboard": return <svg {...svgProps}><rect x="3" y="3" width="7" height="9" rx="1.5" {...p}/><rect x="14" y="3" width="7" height="5" rx="1.5" {...p}/><rect x="14" y="12" width="7" height="9" rx="1.5" {...p}/><rect x="3" y="16" width="7" height="5" rx="1.5" {...p}/></svg>;
    case "plusCircle": return <svg {...svgProps}><circle cx="12" cy="12" r="9" {...p}/><path d="M12 8v8M8 12h8" {...p}/></svg>;
    case "plus": return <svg {...svgProps}><path d="M12 5v14M5 12h14" {...p}/></svg>;
    case "check": return <svg {...svgProps}><circle cx="12" cy="12" r="9" {...p}/><path d="M8 12.5l2.5 2.5L16 9.5" {...p}/></svg>;
    case "list": return <svg {...svgProps}><rect x="3.5" y="5" width="3" height="3" rx="0.5" {...p}/><path d="M9.5 6.5h11" {...p}/><rect x="3.5" y="11" width="3" height="3" rx="0.5" {...p}/><path d="M9.5 12.5h11" {...p}/><rect x="3.5" y="17" width="3" height="3" rx="0.5" {...p}/><path d="M9.5 18.5h11" {...p}/></svg>;
    case "alert": return <svg {...svgProps}><path d="M12 3.5L22 20H2L12 3.5z" {...p}/><path d="M12 10v4" {...p}/><circle cx="12" cy="17" r="0.9" fill={color} stroke="none"/></svg>;
    case "calendar": return <svg {...svgProps}><rect x="3.5" y="5" width="17" height="16" rx="2" {...p}/><path d="M3.5 10h17M8 3v4M16 3v4" {...p}/></svg>;
    case "mail": return <svg {...svgProps}><rect x="2.5" y="5" width="19" height="14" rx="2" {...p}/><path d="M3.5 6.5l8.5 7 8.5-7" {...p}/></svg>;
    case "clip": return <svg {...svgProps}><path d="M8 12.5l6.5-6.5a3 3 0 014.24 4.24L11.5 17.5a5 5 0 01-7.07-7.07L13 2" {...p}/></svg>;
    case "chevronDown": return <svg {...svgProps}><path d="M6 9l6 6 6-6" {...p}/></svg>;
    case "chevronRight": return <svg {...svgProps}><path d="M9 6l6 6-6 6" {...p}/></svg>;
    case "x": return <svg {...svgProps}><path d="M6 6l12 12M18 6L6 18" {...p}/></svg>;
    case "search": return <svg {...svgProps}><circle cx="11" cy="11" r="7" {...p}/><path d="M20 20l-4.5-4.5" {...p}/></svg>;
    case "users": return <svg {...svgProps}><circle cx="9" cy="8.5" r="3.2" {...p}/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" {...p}/><path d="M16 4.5a3.2 3.2 0 010 8" {...p}/><path d="M15 14.2c2.9.5 5 3 5 5.8" {...p}/></svg>;
    case "trend": return <svg {...svgProps}><path d="M3 17l6-6 4 4 8-8" {...p}/><path d="M15 7h6v6" {...p}/></svg>;
    case "rotate": return <svg {...svgProps}><path d="M4 12a8 8 0 1 1 3 6.2" {...p}/><path d="M4 18v-5h5" {...p}/></svg>;
    case "send": return <svg {...svgProps}><path d="M3 12l18-8-8 18-2.5-7.5L3 12z" {...p}/></svg>;
    case "folder": return <svg {...svgProps}><path d="M3.5 6.5a1.5 1.5 0 011.5-1.5h4.6l2 2.2H19a1.5 1.5 0 011.5 1.5V18a1.5 1.5 0 01-1.5 1.5H5A1.5 1.5 0 013.5 18v-11.5z" {...p}/></svg>;
    case "loader": return <svg {...svgProps} style={{ animation: "spin 0.9s linear infinite", ...style }}><circle cx="12" cy="12" r="9" strokeOpacity="0.25" {...p}/><path d="M21 12a9 9 0 00-9-9" {...p}/></svg>;
    case "download": return <svg {...svgProps}><path d="M12 4v11M7.5 11l4.5 4.5L16.5 11" {...p}/><path d="M4 19.5h16" {...p}/></svg>;
    case "upload": return <svg {...svgProps}><path d="M12 19V8M7.5 12.5L12 8l4.5 4.5" {...p}/><path d="M4 19.5h16" {...p}/></svg>;
    case "settings": return <svg {...svgProps}><circle cx="12" cy="12" r="3.2" {...p}/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.1 5.9l-1.55 1.55M7.45 16.55L5.9 18.1M18.1 18.1l-1.55-1.55M7.45 7.45L5.9 5.9" {...p}/></svg>;
    case "trash": return <svg {...svgProps}><path d="M4 7h16M9 7V4.5h6V7M6 7l1 13h10l1-13" {...p}/><path d="M10 11v6M14 11v6" {...p}/></svg>;
    case "link": return <svg {...svgProps}><path d="M9.5 14.5l5-5" {...p}/><path d="M8 10.5L6.5 12a3.5 3.5 0 004.95 4.95L13 15.5" {...p}/><path d="M16 13.5l1.5-1.5a3.5 3.5 0 00-4.95-4.95L11 8.5" {...p}/></svg>;
    default: return null;
  }
}

/* ------------------------------------------------------------------ */
/*  Mini charts (SVG fait main, sans dépendance externe)                */
/* ------------------------------------------------------------------ */
function MiniBarChart({ data }) {
  const max = Math.max(1, ...data.map((d) => d.value));
  const longest = Math.max(0, ...data.map((d) => (d.name || "").length));
  const BOTTOM_PAD = Math.min(110, Math.max(55, longest * 5.2));
  const TOP_PAD = 26, H = 150, barW = 28, gap = 24;
  const usableH = H - TOP_PAD;
  const W = data.length * (barW + gap) + gap;
  return (
    <svg width="100%" height={H + BOTTOM_PAD} viewBox={`0 0 ${W} ${H + BOTTOM_PAD}`} preserveAspectRatio="xMidYMid meet">
      {data.map((d, i) => {
        const h = (d.value / max) * usableH;
        const x = gap + i * (barW + gap);
        return (
          <g key={d.name}>
            <rect x={x} y={H - h} width={barW} height={h} rx="4" fill={d.color} />
            <text x={x + barW / 2} y={Math.max(H - h - 8, 14)} textAnchor="middle" fontSize="11" fontFamily="IBM Plex Mono, monospace" fill={TEXT_MUTE}>{d.value}</text>
            <text x={x + barW / 2} y={H + 12} textAnchor="end" fontSize="10.5" fontFamily="Inter, sans-serif" fill={TEXT_MUTE} transform={`rotate(-40 ${x + barW / 2} ${H + 12})`}>{d.name}</text>
          </g>
        );
      })}
      <line x1="0" y1={H} x2={W} y2={H} stroke={LINE} strokeWidth="1" />
    </svg>
  );
}

function MiniDonut({ data }) {
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  const r = 52, cx = 70, cy = 70, circ = 2 * Math.PI * r;
  let offset = 0;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 20, flexWrap: "wrap", justifyContent: "center" }}>
      <svg width="140" height="140" viewBox="0 0 140 140">
        <circle cx={cx} cy={cy} r={r} fill="none" stroke={LINE} strokeWidth="16" />
        {data.map((d, i) => {
          const frac = d.value / total;
          const dash = frac * circ;
          const el = (
            <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={d.color} strokeWidth="16"
              strokeDasharray={`${dash} ${circ - dash}`} strokeDashoffset={-offset}
              transform={`rotate(-90 ${cx} ${cy})`} strokeLinecap="butt" />
          );
          offset += dash;
          return el;
        })}
        <text x={cx} y={cy + 5} textAnchor="middle" fontSize="20" fontFamily="Space Grotesk, sans-serif" fontWeight="700" fill={TEXT}>{total}</text>
      </svg>
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {data.map((d) => (
          <div key={d.name} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: TEXT_MUTE }}>
            <span style={{ width: 9, height: 9, borderRadius: 3, background: d.color, display: "inline-block" }} />
            {d.name} <span style={{ fontFamily: "IBM Plex Mono, monospace", color: TEXT }}>({d.value})</span>
          </div>
        ))}
      </div>
    </div>
  );
}

      fontSize: 12, fontWeight: 600, fontFamily: "'IBM Plex Mono', monospace",

}

}

const inputStyle = { border: `1px solid ${LINE}`, borderRadius: 7, padding: "8px 10px", fontSize: 13.5, fontFamily: "'Inter', sans-serif", color: TEXT, outline: "none", background: "#fff" };
const selectStyle = { ...inputStyle, padding: "6px 8px", fontSize: 13 };

/* ------------------------------------------------------------------ */
/*  Filtres persistants multi-sélection                                 */
/*  Utilisés par toutes les vues à filtres (actions, indicateurs...) :  */
/*  on peut cocher plusieurs valeurs, et la sélection reste en place    */
/*  (sauvegardée dans le navigateur) tant qu'on n'a pas cliqué sur       */
/*  « Réinitialiser les filtres ».                                      */
/* ------------------------------------------------------------------ */
function usePersistentFilter(storageKey, initial) {
  const [value, setValue] = useState(() => loadLocal(storageKey, initial));
  const update = useCallback((next) => { setValue(next); saveLocal(storageKey, next); }, [storageKey]);
  return [value, update];
}

function MultiSelect({ label, options, value, onChange }) {
  const [open, setOpen] = useState(false);
  const ref = React.useRef(null);
  useEffect(() => {
    const onClick = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onClick);
    return () => document.removeEventListener("mousedown", onClick);
  }, []);
  const toggle = (v) => onChange(value.includes(v) ? value.filter((x) => x !== v) : [...value, v]);
  const summary = value.length === 0 ? label : value.length === 1
    ? (options.find((o) => o.value === value[0]) || {}).label || value[0]
    : `${label} (${value.length})`;
  return (
    <div ref={ref} style={{ position: "relative" }}>
      <button
        type="button"
        onClick={() => setOpen((s) => !s)}
        style={{ ...selectStyle, display: "flex", alignItems: "center", gap: 6, cursor: "pointer", color: value.length ? TEXT : TEXT_MUTE, borderColor: value.length ? NAVY : LINE }}
      >
        {summary}
        <Icon name="chevronDown" size={11} color={TEXT_MUTE} />
      </button>
      {open && (
        <div style={{ position: "absolute", top: "calc(100% + 4px)", left: 0, zIndex: 40, background: "#fff", border: `1px solid ${LINE}`, borderRadius: 8, boxShadow: "0 8px 24px rgba(20,30,60,0.14)", minWidth: 200, maxHeight: 260, overflowY: "auto", padding: 6 }}>
          {options.map((o) => (
            <label key={o.value} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 8px", borderRadius: 6, fontSize: 13, color: TEXT, cursor: "pointer" }}
              onMouseDown={(e) => e.preventDefault()}
            >
              <input type="checkbox" checked={value.includes(o.value)} onChange={() => toggle(o.value)} style={{ cursor: "pointer" }} />
              {o.label}
            </label>
          ))}
          {options.length === 0 && <div style={{ padding: "6px 8px", fontSize: 12.5, color: TEXT_MUTE }}>Aucune valeur disponible</div>}
        </div>
      )}
    </div>
  );
}

function EditableField({ value, onCommit, placeholder, multiline }) {
  const [val, setVal] = useState(value || "");
  useEffect(() => { setVal(value || ""); }, [value]);
  const commit = () => { if (val !== (value || "")) onCommit(val); };
  const style = { ...inputStyle, width: "100%", fontFamily: "'Inter', sans-serif" };
  return multiline ? (
    <textarea value={val} onChange={(e) => setVal(e.target.value)} onBlur={commit} placeholder={placeholder} rows={2} style={{ ...style, resize: "vertical" }} />
  ) : (
    <input value={val} onChange={(e) => setVal(e.target.value)} onBlur={commit} placeholder={placeholder} style={style} />
  );
}

function ActionCard({ action, onUpdate, onComment, onClose, onReopen, onDelete, emailConfig, showToast, setTab, origines, pilotes, dirLinked, onAddLocalFile, onOpenLocalFile, focusRequest }) {
  const [open, setOpen] = useState(false);
  const [comment, setComment] = useState("");
  const [pieceNom, setPieceNom] = useState("");
  const [pieceUrl, setPieceUrl] = useState("");
  const [sending, setSending] = useState(false);
  const [importing, setImporting] = useState(false);
  const fileImportRef = React.useRef(null);
  const cardRef = React.useRef(null);
  const status = effectiveStatus(action);
  const color = domColor(action.domaine);
  const configured = !!(emailConfig && emailConfig.serviceId && emailConfig.templateId && emailConfig.publicKey);

  useEffect(() => {
    if (focusRequest && focusRequest.id === action.id) {
      setOpen(true);
      requestAnimationFrame(() => { if (cardRef.current) cardRef.current.scrollIntoView({ behavior: "smooth", block: "center" }); });
    }
  }, [focusRequest]);

  const addComment = () => { if (!comment.trim()) return; onComment(action.id, comment.trim()); setComment(""); };
  const handleFileImport = async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setImporting(true);
    await onAddLocalFile(action, file);
    setImporting(false);
  };
  const addPiece = () => {
    if (!pieceUrl.trim()) return;
    onUpdate(action.id, { pieces: [...(action.pieces || []), { type: "lien", nom: pieceNom.trim() || "Document", url: pieceUrl.trim() }] });
    setPieceNom(""); setPieceUrl("");
  };
  const relance = async () => {
    const subject = "Mise à jour action : " + action.titre;
    const message = "Bonjour " + action.pilote + ", voici un point sur l'action \"" + action.titre + "\" (" + action.domaine + ")   —   Statut : " + status + "   |   Avancement : " + action.avancement + "%   |   Échéance : " + fmtDate(action.dateEcheance) + ".\n\nMerci de mettre à jour le plan d'action." + toolLinkSuffix();
    setSending(true);
    try {
      await sendAutoEmail(emailConfig, { to_email: action.emailPilote, to_name: action.pilote, subject, message });
      showToast("Email envoyé à " + action.pilote);
    } catch (e) {
      showToast("Échec de l'envoi automatique");
      window.open(outlookWebLink({ to: action.emailPilote, subject, body: message }), "_blank");
    } finally { setSending(false); }
  };
  const changeAvancement = (val) => {
    const patch = { avancement: val };
    if (val > 0 && action.statut === "À faire") patch.statut = "En cours";
    onUpdate(action.id, patch);
  };
  const toggleOpen = () => {
    setOpen((wasOpen) => {
      if (wasOpen && action.avancement >= 100 && action.statut !== "Terminé" && action.statut !== "Annulé") {
        onClose(action.id);
      }
      return !wasOpen;
    });
  };

  return (
    <div ref={cardRef} style={{ background: CARD, borderRadius: 12, border: `1px solid ${LINE}`, borderLeft: `4px solid ${color}`, marginBottom: 12, overflow: "hidden", boxShadow: CARD_SHADOW }}>
      <div onClick={toggleOpen} style={{ padding: "14px 16px", cursor: "pointer", display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", background: STATUS_COLOR[status] + "0D" }}>
        <Icon name={open ? "chevronDown" : "chevronRight"} size={16} color={TEXT_MUTE} />
        <span style={{ width: 8, height: 8, borderRadius: 99, background: STATUS_COLOR[status], flexShrink: 0 }} />
        <span style={{
          fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: NAVY, fontWeight: 600,
          border: `1px solid ${NAVY}55`, borderRadius: 5, padding: "2px 6px", flexShrink: 0, whiteSpace: "nowrap",
        }}>{action.numero || "—"}</span>
        <div style={{ flex: 1, minWidth: 160 }}>
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 14.5, color: TEXT, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{action.titre}</div>
          <div style={{ fontSize: 12.5, color: TEXT_MUTE, marginTop: 2 }}>Ouverte le {fmtDate(action.dateCreation)} · {action.pilote || "pilote non défini"} · échéance {fmtDate(action.dateEcheance)}</div>
        </div>
        <Badge color={STATUS_COLOR[status]}>{status}</Badge>
        {(action.priorite === "Haute" || action.priorite === "Critique") && (
          <Badge color={PRIORITE_COLOR[action.priorite]}>{action.priorite}</Badge>
        )}
        {action.statut === "Terminé" && !action.evaluationEfficacite && (
          <Badge color="#B8860B"><Icon name="alert" size={11} color="#fff" /> Évaluation manquante</Badge>
        )}
        <div style={{ width: 90 }}><ProgressBar value={action.avancement} color={color} /></div>
        <span style={{ fontSize: 12, fontFamily: "'IBM Plex Mono', monospace", color: TEXT_MUTE, width: 32, textAlign: "right" }}>{action.avancement}%</span>
      </div>

      {open && (
        <div style={{ padding: "0 16px 18px 46px", borderTop: `1px solid ${LINE}` }}>
          <div style={{ display: "flex", gap: 24, flexWrap: "wrap", margin: "14px 0" }}>
            <div style={{ flex: "1 1 200px", minWidth: 200 }}>
              <div style={labelStyle}>Pilote</div>
              <select
                value={action.pilote || ""}
                onChange={(e) => {
                  const nom = e.target.value;
                  const email = (pilotes.find((p) => p.nom === nom) || {}).email || "";
                  onUpdate(action.id, { pilote: nom, emailPilote: email });
                }}
                style={{ ...inputStyle, width: "100%" }}
              >
                <option value="">Non assigné</option>
                {pilotes.map((p) => <option key={p.nom} value={p.nom}>{p.nom}</option>)}
              </select>
            </div>
            <div style={{ flex: "1 1 200px", minWidth: 200 }}>
              <div style={labelStyle}>Origine</div>
              <select value={action.origine || ""} onChange={(e) => onUpdate(action.id, { origine: e.target.value })} style={{ ...inputStyle, width: "100%" }}>
                <option value="">Non renseigné</option>
                {origines.map((o) => <option key={o} value={o}>{o}</option>)}
              </select>
            </div>
          </div>

          <div style={labelStyle}>Description de l'anomalie</div>
          <div style={{ marginBottom: 14 }}>
            <EditableField value={action.descriptionAnomalie} onCommit={(v) => onUpdate(action.id, { descriptionAnomalie: v })} placeholder="Décrire l'anomalie constatée..." multiline />
          </div>

          <div style={labelStyle}>Mesure d'efficacité prévue</div>
          <div style={{ marginBottom: 6 }}>
            <EditableField value={action.mesureEfficacite} onCommit={(v) => onUpdate(action.id, { mesureEfficacite: v })} placeholder="Comment vérifiera-t-on que l'action a été efficace ?" multiline />
          </div>

          {action.statut === "Terminé" && (
            <div style={{ background: "#F6F8FA", border: `1px solid ${LINE}`, borderRadius: 8, padding: 14, margin: "12px 0" }}>
              <div style={{ ...labelStyle, marginBottom: 8 }}>Évaluation de l'efficacité</div>
              <select
                value={action.evaluationEfficacite || ""}
                onChange={(e) => onUpdate(action.id, { evaluationEfficacite: e.target.value })}
                style={{ ...inputStyle, width: "100%", marginBottom: 10 }}
              >
                <option value="">Non évaluée</option>
                <option value="Efficace">Efficace</option>
                <option value="Partiellement efficace">Partiellement efficace</option>

              <EditableField
                value={action.evaluationCommentaire}
                onCommit={(v) => onUpdate(action.id, { evaluationCommentaire: v })}

            <div>
              <div style={labelStyle}>Statut</div>
              <select value={action.statut} onChange={(e) => onUpdate(action.id, { statut: e.target.value, dateCloture: e.target.value === "Terminé" ? todayISO() : action.dateCloture })} style={selectStyle}>
                {STATUTS.map((s) => <option key={s} value={s}>{s}</option>)}

              <div style={labelStyle}>Priorité</div>
              <select value={action.priorite || "Moyenne"} onChange={(e) => onUpdate(action.id, { priorite: e.target.value })} style={selectStyle}>
                {PRIORITES.map((p) => <option key={p} value={p}>{p}</option>)}
              </select>
            </div>
            <div>
              <div style={labelStyle}>Avancement</div>
              <input type="range" min={0} max={100} value={action.avancement} onChange={(e) => changeAvancement(Number(e.target.value))} style={{ width: 140 }} />
            </div>
            <div>
              <div style={labelStyle}>Échéance</div>
              <input type="date" value={action.dateEcheance || ""} onChange={(e) => onUpdate(action.id, { dateEcheance: e.target.value })} style={selectStyle} />
            </div>
            {action.emailPilote && (
              configured ? (
                <button onClick={relance} disabled={sending} style={{ ...btnSecondary, alignSelf: "flex-end", opacity: sending ? 0.6 : 1 }}>
                  <Icon name="send" size={13} /> {sending ? "Envoi..." : "Relancer par email"}
                </button>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 4, alignSelf: "flex-end" }}>
                  <button onClick={() => setTab("parametres")} style={{ ...btnSecondary, fontSize: 12 }}>
                    <Icon name="settings" size={12} /> Configurer l'envoi auto
                  </button>
                  <a href={outlookWebLink({ to: action.emailPilote, subject: "Mise à jour action : " + action.titre, body: "Bonjour " + action.pilote + ",\n\nPoint sur l'action \"" + action.titre + "\" (" + action.domaine + ") :\nStatut : " + status + "\nAvancement : " + action.avancement + "%\nÉchéance : " + fmtDate(action.dateEcheance) + "\n\nMerci de mettre à jour le plan d'action." + toolLinkSuffix() })}
                     target="_blank" rel="noreferrer" style={{ fontSize: 11, color: TEXT_MUTE, textAlign: "center", textDecoration: "none" }}>
                    ou ouvrir dans Outlook web
                  </a>
                </div>
              )
            )}
          </div>

          <div style={labelStyle}>Historique / commentaires</div>
          <div style={{ marginBottom: 8 }}>
            {(action.commentaires || []).slice().reverse().map((c, i) => (
              <div key={i} style={{ fontSize: 13, color: TEXT, padding: "6px 0", borderBottom: `1px dashed ${LINE}` }}>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: TEXT_MUTE }}>{fmtDate(c.date)}</span> — {c.texte}
              </div>
            ))}
            {(!action.commentaires || action.commentaires.length === 0) && <div style={{ fontSize: 13, color: TEXT_MUTE, fontStyle: "italic" }}>Aucun commentaire pour le moment.</div>}
          </div>
          <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
            <input value={comment} onChange={(e) => setComment(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addComment()} placeholder="Ajouter un commentaire ou un point d'avancement..." style={{ ...inputStyle, flex: 1 }} />
            <button onClick={addComment} style={btnSecondary}>Ajouter</button>
          </div>

          <div style={labelStyle}>Pièces jointes</div>
          <div style={{ marginBottom: 8 }}>
            {(action.pieces || []).map((p, i) => (
              p.type === "fichier" ? (
                <button key={i} onClick={() => onOpenLocalFile(p)} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13, color: NAVY, padding: "4px 0", background: "none", border: "none", cursor: "pointer", textAlign: "left" }}>
                  <Icon name="clip" size={13} /> {p.nom} <span style={{ fontSize: 11, color: TEXT_MUTE }}>(fichier local)</span>
                </button>
              ) : (
                <a key={i} href={p.url} target="_blank" rel="noreferrer" style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13, color: NAVY, padding: "4px 0", textDecoration: "none" }}>
                  <Icon name="clip" size={13} /> {p.nom}
                </a>
              )
            ))}
            {(!action.pieces || action.pieces.length === 0) && <div style={{ fontSize: 13, color: TEXT_MUTE, fontStyle: "italic" }}>Aucun fichier lié.</div>}
          </div>

          {dirLinked ? (
            <div style={{ marginBottom: 10 }}>
              <button onClick={() => fileImportRef.current.click()} disabled={importing} style={{ ...btnSecondary, opacity: importing ? 0.6 : 1 }}>
                <Icon name="upload" size={13} /> {importing ? "Enregistrement..." : "Importer un fichier (PDF, Word, photo...)"}
              </button>
              <input ref={fileImportRef} type="file" onChange={handleFileImport} style={{ display: "none" }} />
            </div>
          ) : (
            <div style={{ fontSize: 11.5, color: TEXT_MUTE, marginBottom: 10 }}>
              Liez un dossier de pièces jointes dans la barre latérale pour importer des fichiers directement.
            </div>
          )}

          <div style={{ fontSize: 11, color: TEXT_MUTE, marginBottom: 4 }}>Ou lier un document déjà stocké ailleurs (Drive, SharePoint, Teams...) :</div>
          <div style={{ display: "flex", gap: 8, marginBottom: 6, flexWrap: "wrap" }}>
            <input value={pieceNom} onChange={(e) => setPieceNom(e.target.value)} placeholder="Nom du document" style={{ ...inputStyle, width: 160 }} />
            <input value={pieceUrl} onChange={(e) => setPieceUrl(e.target.value)} placeholder="Lien (Drive, SharePoint, Teams...)" style={{ ...inputStyle, flex: 1, minWidth: 200 }} />
            <button onClick={addPiece} style={btnSecondary}>Lier</button>
          </div>

          <div style={{ display: "flex", gap: 8, marginTop: 16, justifyContent: "space-between" }}>
            <div style={{ display: "flex", gap: 8 }}>
              {status !== "Terminé" && status !== "Annulé" ? (
                <button onClick={() => onClose(action.id)} style={btnPrimary}><Icon name="check" size={14} /> Clôturer l'action</button>
              ) : (
                <button onClick={() => onReopen(action.id)} style={btnSecondary}><Icon name="rotate" size={14} /> Rouvrir</button>
              )}
            </div>
            <button
              onClick={() => { if (window.confirm("Supprimer définitivement cette action ? Cette opération est irréversible.")) onDelete(action.id); }}
              style={{ ...btnSecondary, color: "#B23A2E", borderColor: "#E8C6C2" }}
            >
              <Icon name="trash" size={14} /> Supprimer
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  Dashboard                                                           */
/* ------------------------------------------------------------------ */
const PALETTE = ["#2E5AAC", "#B23A2E", "#4F7942", "#6B5B95", "#B8860B", "#3B6E8F", "#946B4E", "#5C7A89"];

function Dashboard({ actions, pilotes, agency, setTab, emailConfig, showToast, onOpenAction }) {
  const [relanceEnCours, setRelanceEnCours] = useState(false);
  const configured = !!(emailConfig && emailConfig.serviceId && emailConfig.templateId && emailConfig.publicKey);

  const total = actions.length;
  const enCours = actions.filter((a) => effectiveStatus(a) === "En cours").length;
  const enRetardActions = actions.filter((a) => effectiveStatus(a) === "En retard").sort((a, b) => (a.dateEcheance || "").localeCompare(b.dateEcheance || ""));
  const enRetard = enRetardActions.length;
  const cloturees = actions.filter((a) => a.statut === "Terminé").length;
  const annulees = actions.filter((a) => a.statut === "Annulé").length;
  const tauxCloture = total ? Math.round((cloturees / total) * 100) : 0;

  const actives = actions.filter((a) => a.statut !== "Terminé" && a.statut !== "Annulé");
  const nonAnnulees = actions.filter((a) => a.statut !== "Annulé");
  const tauxAvancement = nonAnnulees.length ? Math.round(nonAnnulees.reduce((s, a) => s + (a.avancement || 0), 0) / nonAnnulees.length) : 0;

  const dureesCloture = actions.filter((a) => a.statut === "Terminé" && a.dateCreation && a.dateCloture)
    .map((a) => (new Date(a.dateCloture) - new Date(a.dateCreation)) / 86400000);
  const dureeMoyenne = dureesCloture.length ? Math.round(dureesCloture.reduce((s, v) => s + v, 0) / dureesCloture.length) : null;

  const parDomaine = DOMAINES.map((d) => ({ name: d.key, value: actions.filter((a) => a.domaine === d.key && a.statut !== "Terminé" && a.statut !== "Annulé").length, color: d.color }));

  const pilotesMap = {};
  actives.forEach((a) => { const k = a.pilote || "Non assigné"; pilotesMap[k] = (pilotesMap[k] || 0) + 1; });
  const parPilote = Object.keys(pilotesMap).sort((a, b) => pilotesMap[b] - pilotesMap[a]).slice(0, 8)
    .map((name, i) => ({ name, value: pilotesMap[name], color: PALETTE[i % PALETTE.length] }));

  const originesMap = {};
  actives.forEach((a) => { const k = a.origine && a.origine.trim() ? a.origine.trim() : "Non renseigné"; originesMap[k] = (originesMap[k] || 0) + 1; });
  const parOrigine = Object.keys(originesMap).sort((a, b) => originesMap[b] - originesMap[a]).slice(0, 8)
    .map((name, i) => ({ name, value: originesMap[name], color: PALETTE[(i + 3) % PALETTE.length] }));

  const parStatut = ["À faire", "En cours", "En retard", "Terminé", "Annulé"].map((s) => ({ name: s, value: actions.filter((a) => effectiveStatus(a) === s).length, color: STATUS_COLOR[s] })).filter((x) => x.value > 0);
  const prochaines = actions.filter((a) => a.statut !== "Terminé" && a.statut !== "Annulé" && a.dateEcheance).sort((a, b) => a.dateEcheance.localeCompare(b.dateEcheance)).slice(0, 5);

  const kpis = [
    { label: "Actions actives", value: total - cloturees - annulees, icon: "list", color: NAVY },
    { label: "En cours", value: enCours, icon: "trend", color: "#2E5AAC" },
    { label: "En retard", value: enRetard, icon: "alert", color: "#B23A2E" },
    { label: "Taux de clôture", value: tauxCloture + "%", icon: "check", color: "#4F7942" },
    { label: "Avancement global", value: tauxAvancement + "%", icon: "trend", color: "#6B5B95" },
    { label: "Délai moyen de clôture", value: dureeMoyenne === null ? "—" : dureeMoyenne + " j", icon: "calendar", color: "#B8860B" },
    { label: "Évaluations manquantes", value: actions.filter((a) => a.statut === "Terminé" && !a.evaluationEfficacite).length, icon: "alert", color: "#B8860B" },
  ];

  const [showPicker, setShowPicker] = useState(false);
  const [selectedPilotes, setSelectedPilotes] = useState([]);

  const parPiloteOuvertes = {};
  actives.forEach((a) => {
    if (!a.pilote) return;
    if (!parPiloteOuvertes[a.pilote]) parPiloteOuvertes[a.pilote] = { list: [] };
    parPiloteOuvertes[a.pilote].list.push(a);
  });
  const pilotesConcernes = Object.keys(parPiloteOuvertes).sort((a, b) => a.localeCompare(b));
  const emailDe = (nom) => (pilotes.find((p) => p.nom === nom) || {}).email || "";

  const openPicker = () => {
    if (pilotesConcernes.length === 0) { showToast("Aucune action ouverte avec pilote assigné"); return; }
    if (!configured) { showToast("Configurez d'abord l'envoi automatique"); setTab("parametres"); return; }
    setSelectedPilotes(pilotesConcernes.filter((nom) => emailDe(nom)));
    setShowPicker(true);
  };
  const togglePilote = (nom) => setSelectedPilotes((s) => (s.includes(nom) ? s.filter((x) => x !== nom) : [...s, nom]));
  const toggleAllPilotes = () => {
    const selectable = pilotesConcernes.filter((nom) => emailDe(nom));
    setSelectedPilotes((s) => (s.length === selectable.length ? [] : selectable));
  };

  const envoyerRelance = async () => {
    if (selectedPilotes.length === 0) { showToast("Sélectionnez au moins un pilote"); return; }
    if (!window.confirm(`Envoyer une demande de point d'avancement à ${selectedPilotes.length} pilote(s) ?`)) return;

    setRelanceEnCours(true);
    let ok = 0, fail = 0;
    for (const nom of selectedPilotes) {
      const email = emailDe(nom);
      const list = parPiloteOuvertes[nom].list;
      if (!email) { fail++; continue; }
      const lignes = list.map((a) => "• " + a.titre + " (" + a.domaine + ") — statut : " + effectiveStatus(a) + ", échéance : " + fmtDate(a.dateEcheance)).join("\n\n");
      const subject = "Point d'avancement demandé sur vos actions en cours";
      const message = "Bonjour " + nom + ",\n\nPourriez-vous faire un point d'avancement sur vos actions actuellement ouvertes dans le plan d'action de l'agence :\n\n" + lignes + "\n\n" + (closingMessageFor(agency) || "Merci de mettre à jour l'outil ou de répondre à cet email avec l'état d'avancement.") + toolLinkSuffix();
      try {
        await sendAutoEmail(emailConfig, { to_email: email, to_name: nom, subject, message });
        ok++;
      } catch (e) { fail++; }
    }
    setRelanceEnCours(false);
    setShowPicker(false);
    showToast(fail === 0 ? `${ok} email(s) envoyé(s)` : `${ok} envoyé(s), ${fail} échec(s)`);
  };

  return (
    <div>
      <div style={{ marginBottom: 14 }}>
        <div style={{ display: "flex", justifyContent: "flex-end" }}>
          <button onClick={() => (showPicker ? setShowPicker(false) : openPicker())} style={btnSecondary}>
            <Icon name="send" size={14} /> Demander un point d'avancement...
          </button>
        </div>
        {showPicker && (
          <div style={{ background: CARD, border: "none", boxShadow: CARD_SHADOW, borderRadius: 10, padding: 16, marginTop: 10 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 13.5, color: TEXT }}>Choisir les pilotes à relancer</div>
              <button onClick={toggleAllPilotes} style={{ ...btnSecondary, fontSize: 12, padding: "5px 10px" }}>
                {selectedPilotes.length === pilotesConcernes.filter((nom) => emailDe(nom)).length ? "Tout désélectionner" : "Tout sélectionner"}
              </button>
            </div>
            <div style={{ fontSize: 11.5, color: TEXT_MUTE, marginBottom: 10 }}>
              Le nombre entre parenthèses indique les actions À faire / En cours / En retard de ce pilote. Un pilote en rouge n'a pas d'adresse email renseignée (à corriger dans « Pilotes & origines »).
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 16 }}>
              {pilotesConcernes.map((nom) => {
                const hasEmail = !!emailDe(nom);
                return (
                  <label key={nom} style={{
                    display: "flex", alignItems: "center", gap: 6, cursor: hasEmail ? "pointer" : "not-allowed",
                    background: !hasEmail ? "#FBEFEF" : selectedPilotes.includes(nom) ? "#EAF0FB" : "#fff",
                    border: `1px solid ${!hasEmail ? "#E8C6C2" : selectedPilotes.includes(nom) ? NAVY + "55" : LINE}`,
                    borderRadius: 7, padding: "6px 10px", fontSize: 12.5, color: hasEmail ? TEXT : "#B23A2E",
                    opacity: hasEmail ? 1 : 0.85,
                  }}>
                    <input type="checkbox" checked={selectedPilotes.includes(nom)} disabled={!hasEmail} onChange={() => togglePilote(nom)} />
                    {nom} <span style={{ color: hasEmail ? TEXT_MUTE : "#B23A2E" }}>
                      ({parPiloteOuvertes[nom].list.length}{!hasEmail ? " · email manquant" : ""})
                    </span>
                  </label>
                );
              })}
            </div>
            <button onClick={envoyerRelance} disabled={relanceEnCours || selectedPilotes.length === 0} style={{ ...btnPrimary, opacity: (relanceEnCours || selectedPilotes.length === 0) ? 0.6 : 1 }}>
              <Icon name="send" size={14} color="#fff" /> {relanceEnCours ? "Envoi en cours..." : `Envoyer à ${selectedPilotes.length} pilote(s)`}
            </button>
          </div>
        )}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 16, marginBottom: 24 }}>
        {kpis.map((k) => (
          <div key={k.label} style={{ ...softCard, padding: "22px 18px", textAlign: "center", borderTop: `3px solid ${k.color}` }}>
            <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 32, fontWeight: 800, color: TEXT, lineHeight: 1.1 }}>{k.value}</div>
            <div style={{ fontSize: 12.5, color: TEXT_MUTE, marginTop: 8, fontWeight: 600 }}>{k.label}</div>
          </div>
        ))}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr", gap: 16, marginBottom: 16 }}>
        <div style={{ ...softCard, padding: "20px 22px", overflowX: "auto" }}>
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 15, color: TEXT, marginBottom: 16 }}>Actions actives par domaine</div>
          <MiniBarChart data={parDomaine} />
        </div>
        <div style={{ background: CARD, border: "none", boxShadow: CARD_SHADOW, borderRadius: 12, padding: "18px 20px" }}>
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 15, color: TEXT, marginBottom: 16 }}>Répartition par statut</div>
          {parStatut.length ? <MiniDonut data={parStatut} /> : <EmptyState icon="list" title="Aucune donnée" />}
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 16 }}>
        <div style={{ background: CARD, border: "none", boxShadow: CARD_SHADOW, borderRadius: 12, padding: "18px 20px", overflowX: "auto" }}>
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 15, color: TEXT, marginBottom: 16 }}>Actions actives par pilote</div>
          {parPilote.length ? <MiniBarChart data={parPilote} /> : <EmptyState icon="users" title="Aucune donnée" />}
        </div>
        <div style={{ background: CARD, border: "none", boxShadow: CARD_SHADOW, borderRadius: 12, padding: "18px 20px", overflowX: "auto" }}>
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 15, color: TEXT, marginBottom: 16 }}>Actions actives par origine</div>
          {parOrigine.length ? <MiniBarChart data={parOrigine} /> : <EmptyState icon="folder" title="Aucune donnée" />}
        </div>
      </div>

      <div style={{ background: CARD, border: "none", boxShadow: CARD_SHADOW, borderRadius: 12, padding: "18px 20px", marginBottom: 16 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
          <Icon name="alert" size={15} color="#B23A2E" />
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 14.5, color: TEXT }}>Actions en retard ({enRetard})</div>
        </div>
        {enRetardActions.length === 0 && <EmptyState icon="check" title="Aucune action en retard" subtitle="Toutes les échéances sont respectées." />}
        {enRetardActions.map((a) => {
          const joursRetard = Math.round((new Date(todayISO()) - new Date(a.dateEcheance)) / 86400000);
          return (
            <div key={a.id} onClick={() => onOpenAction(a)} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 0", borderBottom: `1px solid ${LINE}`, cursor: "pointer", flexWrap: "wrap" }}>
              <span style={{ width: 8, height: 8, borderRadius: 99, background: domColor(a.domaine) }} />
              <div style={{ flex: 1, fontSize: 13.5, color: TEXT, minWidth: 140 }}>{a.titre}</div>
              <div style={{ fontSize: 12, color: TEXT_MUTE }}>{a.pilote}</div>
              <Badge color={domColor(a.domaine)} soft>{a.domaine}</Badge>
              <Badge color="#B23A2E">{joursRetard} j de retard</Badge>
            </div>
          );
        })}
      </div>

      <div style={{ background: CARD, border: "none", boxShadow: CARD_SHADOW, borderRadius: 12, padding: "18px 20px" }}>
        <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 15, color: TEXT, marginBottom: 16 }}>Prochaines échéances</div>
        {prochaines.length === 0 && <EmptyState icon="calendar" title="Aucune échéance à venir" />}
        {prochaines.map((a) => (
          <div key={a.id} onClick={() => onOpenAction(a)} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 0", borderBottom: `1px solid ${LINE}`, cursor: "pointer", flexWrap: "wrap" }}>
            <span style={{ width: 8, height: 8, borderRadius: 99, background: domColor(a.domaine) }} />
            <div style={{ flex: 1, fontSize: 13.5, color: TEXT, minWidth: 140 }}>{a.titre}</div>
            <div style={{ fontSize: 12, color: TEXT_MUTE }}>{a.pilote}</div>
            <Badge color={STATUS_COLOR[effectiveStatus(a)]}>{fmtDate(a.dateEcheance)}</Badge>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  New action form                                                     */
/* ------------------------------------------------------------------ */
function NouvelleAction({ pilotes, agency, onCreate, onAddPilote, origines, onAddOrigine, emailConfig, showToast, setTab }) {
  const [form, setForm] = useState({
    domaine: DOMAINES[0].key, dateEcheance: "", origine: "", descriptionAnomalie: "",
    titre: "", pilote: "", avancement: 0, priorite: "Moyenne", mesureEfficacite: "", commentaire: "",
  });
  const [showPilote, setShowPilote] = useState(false);
  const [newPiloteNom, setNewPiloteNom] = useState("");
  const [newPiloteEmail, setNewPiloteEmail] = useState("");
  const [showOrigine, setShowOrigine] = useState(false);
  const [newOrigine, setNewOrigine] = useState("");
  const [confirmation, setConfirmation] = useState(null);
  const [sending, setSending] = useState(false);
  const configured = !!(emailConfig && emailConfig.serviceId && emailConfig.templateId && emailConfig.publicKey);

  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  const emailPilote = (pilotes.find((p) => p.nom === form.pilote) || {}).email || "";

  const submit = () => {
    if (!form.titre.trim() || !form.pilote) return;
    const action = onCreate({
      domaine: form.domaine, dateEcheance: form.dateEcheance || null, origine: form.origine.trim(),
      descriptionAnomalie: form.descriptionAnomalie.trim(), titre: form.titre.trim(),
      pilote: form.pilote, emailPilote, avancement: form.avancement, priorite: form.priorite,
      mesureEfficacite: form.mesureEfficacite.trim(), commentaireInitial: form.commentaire.trim(),
    });
    setConfirmation(action);
    setForm({ domaine: DOMAINES[0].key, dateEcheance: "", origine: "", descriptionAnomalie: "", titre: "", pilote: "", avancement: 0, priorite: "Moyenne", mesureEfficacite: "", commentaire: "" });
  };
  const addPiloteInline = () => {
    if (!newPiloteNom.trim() || !newPiloteEmail.trim()) return;
    onAddPilote({ nom: newPiloteNom.trim(), email: newPiloteEmail.trim() });
    set("pilote", newPiloteNom.trim());
    setNewPiloteNom(""); setNewPiloteEmail(""); setShowPilote(false);
  };
  const addOrigineInline = () => {
    if (!newOrigine.trim()) return;
    onAddOrigine(newOrigine.trim());
    set("origine", newOrigine.trim());
    setNewOrigine(""); setShowOrigine(false);
  };

  return (
    <div style={{ maxWidth: 640 }}>
      <div style={{ background: CARD, border: "none", boxShadow: CARD_SHADOW, borderRadius: 12, padding: 24 }}>
        <div style={{ display: "flex", gap: 14, marginBottom: 16, flexWrap: "wrap" }}>
          <div style={{ flex: 1, minWidth: 160 }}>
            <label style={labelStyle}>Domaine</label>
            <select value={form.domaine} onChange={(e) => set("domaine", e.target.value)} style={{ ...inputStyle, width: "100%" }}>
              {DOMAINES.map((d) => <option key={d.key} value={d.key}>{d.key}</option>)}
            </select>
          </div>
          <div style={{ flex: 1, minWidth: 160 }}>
            <label style={labelStyle}>Priorité</label>

        <label style={labelStyle}>Description de l'anomalie</label>

        <label style={labelStyle}>Action</label>
        <textarea value={form.titre} onChange={(e) => set("titre", e.target.value)} rows={2} placeholder="Ex : Vérifier les extincteurs de l'agence" style={{ ...inputStyle, width: "100%", marginBottom: 14, resize: "vertical", fontFamily: "'Inter', sans-serif" }} />

          <select value={form.pilote} onChange={(e) => set("pilote", e.target.value)} style={{ ...inputStyle, flex: 1, minWidth: 160 }}>

            <button onClick={addPiloteInline} style={btnPrimary}>Ajouter</button>
          </div>
        )}

        <label style={labelStyle}>Avancement initial</label>
        <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 14 }}>
          <input type="range" min={0} max={100} value={form.avancement} onChange={(e) => set("avancement", Number(e.target.value))} style={{ flex: 1 }} />
          <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: TEXT_MUTE, width: 38 }}>{form.avancement}%</span>
        </div>

        <label style={labelStyle}>Mesure d'efficacité prévue</label>
        <textarea value={form.mesureEfficacite} onChange={(e) => set("mesureEfficacite", e.target.value)} rows={2} placeholder="Comment vérifiera-t-on que l'action a été efficace ?" style={{ ...inputStyle, width: "100%", marginBottom: 14, resize: "vertical", fontFamily: "'Inter', sans-serif" }} />

        <label style={labelStyle}>Commentaires</label>
        <input value={form.commentaire} onChange={(e) => set("commentaire", e.target.value)} placeholder="Ex : point de départ, contexte..." style={{ ...inputStyle, width: "100%", marginBottom: 20 }} />

        <button onClick={submit} disabled={!form.titre.trim() || !form.pilote} style={{ ...btnPrimary, opacity: (!form.titre.trim() || !form.pilote) ? 0.5 : 1 }}>
          <Icon name="plusCircle" size={15} /> Créer l'action
        </button>
      </div>

      {confirmation && (
        <div style={{ marginTop: 16, background: "#F1F7EE", border: "1px solid #C7DEC0", borderRadius: 10, padding: 16 }}>
          <div style={{ fontSize: 13.5, color: TEXT, marginBottom: 10 }}>Action <b>{confirmation.numero}</b> — <b>{confirmation.titre}</b> créée et assignée à <b>{confirmation.pilote}</b> dans « {confirmation.domaine} ».</div>
          {configured ? (
            <button
              disabled={sending}
              onClick={async () => {
                setSending(true);
                const subject = "Nouvelle action qui vous est assignée : " + confirmation.titre;
                const message = "Bonjour " + confirmation.pilote + ", une nouvelle action vous a été assignée dans le plan d'action de l'agence   —   Domaine : " + confirmation.domaine + "   |   Action : " + confirmation.titre + "   |   Échéance : " + fmtDate(confirmation.dateEcheance) + ".\n\n" + (closingMessageFor(agency) || "Merci de vous connecter à l'outil pour plus de détails.") + toolLinkSuffix();
                try {
                  await sendAutoEmail(emailConfig, { to_email: confirmation.emailPilote, to_name: confirmation.pilote, subject, message });
                  showToast("Email envoyé à " + confirmation.pilote);
                } catch (e) {
                  showToast("Échec de l'envoi automatique");
                  window.open(outlookWebLink({ to: confirmation.emailPilote, subject, body: message }), "_blank");
                } finally { setSending(false); }
              }}
              style={{ ...btnPrimary, opacity: sending ? 0.6 : 1 }}
            >
              <Icon name="send" size={14} color="#fff" /> {sending ? "Envoi en cours..." : "Notifier " + confirmation.pilote + " par email"}
            </button>
          ) : (
            <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
              <button onClick={() => setTab("parametres")} style={btnPrimary}>
                <Icon name="settings" size={14} color="#fff" /> Configurer l'envoi automatique
              </button>
              <a href={outlookWebLink({ to: confirmation.emailPilote, subject: "Nouvelle action qui vous est assignée : " + confirmation.titre, body: "Bonjour " + confirmation.pilote + ",\n\nUne nouvelle action vous a été assignée dans le plan d'action de l'agence :\n\nDomaine : " + confirmation.domaine + "\nAction : " + confirmation.titre + "\nÉchéance : " + fmtDate(confirmation.dateEcheance) + "\n\n" + (closingMessageFor(agency) || "Merci de vous connecter à l'outil pour plus de détails.") + toolLinkSuffix() })}
                 target="_blank" rel="noreferrer" style={{ fontSize: 12.5, color: TEXT_MUTE, textDecoration: "underline" }}>
                ou ouvrir dans Outlook web
              </a>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function DomaineActions({ actions, domaine, agency, actionCardProps }) {
  const [q, setQ] = useState("");
  const [fPilote, setFPilote] = usePersistentFilter("pa_filter_domaine_pilote__" + agency + "__" + domaine, []);
  const [fStatut, setFStatut] = usePersistentFilter("pa_filter_domaine_statut__" + agency + "__" + domaine, []);
  const [fPriorite, setFPriorite] = usePersistentFilter("pa_filter_domaine_priorite__" + agency + "__" + domaine, []);
  const list = actions.filter((a) => a.domaine === domaine && a.statut !== "Terminé" && a.statut !== "Annulé");
  const pilotesPresents = [...new Set(list.map((a) => a.pilote).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  const filtered = list.filter((a) => {
    if (fPilote.length && !fPilote.includes(a.pilote)) return false;
    if (fStatut.length && !fStatut.includes(effectiveStatus(a))) return false;
    if (fPriorite.length && !fPriorite.includes(a.priorite || "Moyenne")) return false;
    if (q && !(a.titre + a.pilote + (a.numero || "")).toLowerCase().includes(q.toLowerCase())) return false;
    return true;
  });
  const filtersActive = fPilote.length > 0 || fStatut.length > 0 || fPriorite.length > 0;
  const resetFilters = () => { setFPilote([]); setFStatut([]); setFPriorite([]); };

  return (
    <div>
      <div style={{ display: "flex", gap: 10, marginBottom: 16, flexWrap: "wrap" }}>
        <div style={{ position: "relative", flex: 1, minWidth: 200 }}>
          <div style={{ position: "absolute", left: 10, top: 10 }}><Icon name="search" size={14} color={TEXT_MUTE} /></div>
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Rechercher une action ou un pilote..." style={{ ...inputStyle, width: "100%", paddingLeft: 30 }} />
        </div>
        <MultiSelect label="Tous les pilotes" value={fPilote} onChange={setFPilote} options={pilotesPresents.map((p) => ({ value: p, label: p }))} />
        <MultiSelect label="Tous les statuts" value={fStatut} onChange={setFStatut} options={["À faire", "En cours", "En retard"].map((s) => ({ value: s, label: s }))} />
        <MultiSelect label="Toutes les priorités" value={fPriorite} onChange={setFPriorite} options={PRIORITES.map((p) => ({ value: p, label: p }))} />
        <ResetFiltersButton active={filtersActive} onReset={resetFilters} />
      </div>
      <div style={{ fontSize: 12.5, color: TEXT_MUTE, marginBottom: 10 }}>{filtered.length} action(s)</div>
      {filtered.length === 0 && <EmptyState icon="folder" title={list.length === 0 ? `Aucune action en cours pour ${domaine}` : "Aucune action ne correspond"} subtitle={list.length === 0 ? "Créez-en une depuis l'onglet « Nouvelle action »." : "Essayez d'élargir les filtres."} />}
      {filtered.map((a) => <ActionCard key={a.id} action={a} {...actionCardProps} />)}
    </div>
  );
}

}

function ToutesActions({ actions, agency, setTab, onOpenAction, onExportMatrice, importBusy, importPreview, onImportFile, onConfirmImport, onCancelImport }) {
  const [q, setQ] = useState("");
  const [fDomaine, setFDomaine] = usePersistentFilter("pa_filter_toutes_domaine__" + agency, []);
  const [fStatut, setFStatut] = usePersistentFilter("pa_filter_toutes_statut__" + agency, []);
  const [fPilote, setFPilote] = usePersistentFilter("pa_filter_toutes_pilote__" + agency, []);
  const [fPriorite, setFPriorite] = usePersistentFilter("pa_filter_toutes_priorite__" + agency, []);
  const [sortDir, setSortDir] = useState("desc");
  const importInputRef = React.useRef(null);
  const pilotesPresents = [...new Set(actions.map((a) => a.pilote).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  const filtered = actions.filter((a) => {
    if (fDomaine.length && !fDomaine.includes(a.domaine)) return false;
    if (fStatut.length && !fStatut.includes(effectiveStatus(a))) return false;
    if (fPilote.length && !fPilote.includes(a.pilote)) return false;
    if (fPriorite.length && !fPriorite.includes(a.priorite || "Moyenne")) return false;
    if (q && !(a.titre + a.pilote + (a.numero || "")).toLowerCase().includes(q.toLowerCase())) return false;
    return true;
  }).sort((a, b) => sortDir === "asc" ? (a.numero || "").localeCompare(b.numero || "") : (b.numero || "").localeCompare(a.numero || ""));
  const filtersActive = fDomaine.length > 0 || fStatut.length > 0 || fPilote.length > 0 || fPriorite.length > 0;
  const resetFilters = () => { setFDomaine([]); setFStatut([]); setFPilote([]); setFPriorite([]); };

  const domainesInconnus = importPreview
    ? [...new Set(importPreview.toImport.filter((a) => a.domaineOriginal && normText(a.domaineOriginal) !== normText(a.domaine)).map((a) => `${a.domaineOriginal} → ${a.domaine}`))]
    : [];

  return (
    <div>
      <div style={{ display: "flex", gap: 10, marginBottom: 16, flexWrap: "wrap", alignItems: "center" }}>
        <div style={{ position: "relative", flex: 1, minWidth: 200 }}>
          <div style={{ position: "absolute", left: 10, top: 10 }}><Icon name="search" size={14} color={TEXT_MUTE} /></div>
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Rechercher une action ou un pilote..." style={{ ...inputStyle, width: "100%", paddingLeft: 30 }} />
        </div>
        <MultiSelect label="Tous les domaines" value={fDomaine} onChange={setFDomaine} options={DOMAINES.map((d) => ({ value: d.key, label: d.key }))} />
        <MultiSelect label="Tous les pilotes" value={fPilote} onChange={setFPilote} options={pilotesPresents.map((p) => ({ value: p, label: p }))} />
        <MultiSelect label="Tous les statuts" value={fStatut} onChange={setFStatut} options={["À faire", "En cours", "En retard", "Terminé", "Annulé"].map((s) => ({ value: s, label: s }))} />
        <MultiSelect label="Toutes les priorités" value={fPriorite} onChange={setFPriorite} options={PRIORITES.map((p) => ({ value: p, label: p }))} />
        <ResetFiltersButton active={filtersActive} onReset={resetFilters} />
        <select value={sortDir} onChange={(e) => setSortDir(e.target.value)} style={selectStyle}>
          <option value="desc">N° décroissant (récent → ancien)</option>
          <option value="asc">N° croissant (ancien → récent)</option>
        </select>
        <button onClick={() => importInputRef.current.click()} disabled={importBusy} style={{ ...btnSecondary, opacity: importBusy ? 0.6 : 1 }}>
          <Icon name="upload" size={14} /> {importBusy ? "Analyse..." : "Importer depuis Excel"}
        </button>
        <button onClick={onExportMatrice} style={btnSecondary}>
          <Icon name="download" size={14} /> Exporter (Matrice PAA)
        </button>
        <input ref={importInputRef} type="file" accept=".xlsx,.xls" onChange={(e) => { const f = e.target.files[0]; e.target.value = ""; if (f) onImportFile(f); }} style={{ display: "none" }} />
      </div>

      {importPreview && (
        <div style={{ background: "#F1F7EE", border: "1px solid #C7DEC0", borderRadius: 10, padding: 18, marginBottom: 18 }}>
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 14.5, color: TEXT, marginBottom: 8 }}>
            Aperçu de l'import — {importPreview.fileName}
          </div>
          <div style={{ fontSize: 13, color: TEXT, marginBottom: 6 }}>{importPreview.toImport.length} action(s) détectée(s).</div>
          {importPreview.newPilotes.length > 0 && (
            <div style={{ fontSize: 13, color: TEXT, marginBottom: 6 }}>
              {importPreview.newPilotes.length} nouveau(x) pilote(s) seront créés (sans email — à compléter dans « Pilotes & origines ») : {importPreview.newPilotes.map((p) => p.nom).join(", ")}
            </div>
          )}
          {importPreview.newOrigines.length > 0 && (
            <div style={{ fontSize: 13, color: TEXT, marginBottom: 6 }}>
              {importPreview.newOrigines.length} nouvelle(s) origine(s) seront ajoutées : {importPreview.newOrigines.join(", ")}
            </div>
          )}
          {domainesInconnus.length > 0 && (
            <div style={{ fontSize: 12.5, color: "#8A6D00", marginBottom: 6 }}>
              Domaines non reconnus, rattachés au plus proche : {domainesInconnus.join(" · ")}
            </div>
          )}
          <div style={{ fontSize: 12, color: TEXT_MUTE, marginBottom: 14 }}>
            La date de création sera fixée à aujourd'hui (non fournie par le fichier) et le statut déduit de l'avancement.
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            <button onClick={onConfirmImport} style={btnPrimary}><Icon name="check" size={14} color="#fff" /> Confirmer l'import</button>
            <button onClick={onCancelImport} style={btnSecondary}>Annuler</button>
          </div>
        </div>
      )}

      <div style={{ fontSize: 12.5, color: TEXT_MUTE, marginBottom: 10 }}>{filtered.length} action(s)</div>
      {filtered.length === 0 && <EmptyState icon="list" title="Aucune action ne correspond" subtitle="Essayez d'élargir les filtres." />}
      {filtered.map((a) => {
        const st = effectiveStatus(a);
        return (
          <div key={a.id} onClick={() => onOpenAction(a)} style={{ display: "flex", alignItems: "center", gap: 12, background: STATUS_COLOR[st] + "0D", border: `1px solid ${LINE}`, borderLeft: `4px solid ${domColor(a.domaine)}`, borderRadius: 8, padding: "12px 16px", marginBottom: 8, cursor: "pointer", flexWrap: "wrap" }}>
            <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: NAVY, fontWeight: 600, border: `1px solid ${NAVY}55`, borderRadius: 5, padding: "2px 6px", flexShrink: 0 }}>{a.numero || "—"}</span>
            <Badge color={domColor(a.domaine)} soft>{a.domaine}</Badge>
            <div style={{ flex: 1, fontSize: 13.5, color: TEXT, fontWeight: 500, minWidth: 160 }}>{a.titre}</div>
            <div style={{ fontSize: 12.5, color: TEXT_MUTE, width: 130 }}>{a.pilote}</div>
            <div style={{ fontSize: 12, fontFamily: "'IBM Plex Mono', monospace", color: TEXT_MUTE, width: 90 }}>{fmtDate(a.dateEcheance)}</div>
            {(a.priorite === "Haute" || a.priorite === "Critique") && <Badge color={PRIORITE_COLOR[a.priorite]}>{a.priorite}</Badge>}
            {a.statut === "Terminé" && !a.evaluationEfficacite && (
              <Badge color="#B8860B"><Icon name="alert" size={11} color="#fff" /> Évaluation manquante</Badge>
            )}
            <Badge color={STATUS_COLOR[st]}>{st}</Badge>
          </div>
        );
      })}
    </div>
  );
}

function ParametresEmail({ emailConfig, onSave, showToast, unlocked, onUnlock }) {
  const [serviceId, setServiceId] = useState(emailConfig.serviceId || "");
  const [templateId, setTemplateId] = useState(emailConfig.templateId || "");
  const [publicKey, setPublicKey] = useState(emailConfig.publicKey || "");
  const [testEmail, setTestEmail] = useState("");
  const [testing, setTesting] = useState(false);
  const [pwd, setPwd] = useState("");

  const configured = serviceId.trim() && templateId.trim() && publicKey.trim();

  const save = () => {
    onSave({ serviceId: serviceId.trim(), templateId: templateId.trim(), publicKey: publicKey.trim() });
    showToast("Configuration enregistrée");
  };

  if (!unlocked) {
    return (
      <div style={{ maxWidth: 420 }}>
        <div style={{ background: CARD, border: "none", boxShadow: CARD_SHADOW, borderRadius: 12, padding: 24 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
            <Icon name="settings" size={16} color={NAVY} />
            <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 15, color: TEXT }}>Accès protégé</div>
          </div>
          <div style={{ fontSize: 13, color: TEXT_MUTE, marginBottom: 16, lineHeight: 1.5 }}>
            Cette section est protégée par mot de passe pour éviter toute modification accidentelle de l'envoi automatique des emails.
          </div>
          <input
            type="password" value={pwd} onChange={(e) => setPwd(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") { if (pwd === SETTINGS_PASSWORD) { onUnlock(); setPwd(""); } else { showToast("Mot de passe incorrect"); setPwd(""); } } }}
            placeholder="Mot de passe" style={{ ...inputStyle, width: "100%", marginBottom: 12 }}
          />
          <button
            onClick={() => { if (pwd === SETTINGS_PASSWORD) { onUnlock(); setPwd(""); } else { showToast("Mot de passe incorrect"); setPwd(""); } }}
            style={btnPrimary}
          >
            <Icon name="check" size={14} color="#fff" /> Déverrouiller
          </button>
        </div>
      </div>

function ParametresGitHub({ githubConfig, onSave, showToast, unlocked, onUnlock }) {
  const [workerUrl, setWorkerUrl] = useState((githubConfig && githubConfig.workerUrl) || "");
  const [appKey, setAppKey] = useState((githubConfig && githubConfig.appKey) || "");
  const [pwd, setPwd] = useState("");
  const [testing, setTesting] = useState(false);

  const configured = workerUrl.trim() && appKey.trim();

  if (!unlocked) {
    return (
      <div style={{ maxWidth: 420 }}>
        <div style={{ background: CARD, border: "none", boxShadow: CARD_SHADOW, borderRadius: 12, padding: 24 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
            <Icon name="settings" size={16} color={NAVY} />
            <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 15, color: TEXT }}>Accès protégé</div>
          </div>
          <div style={{ fontSize: 13, color: TEXT_MUTE, marginBottom: 16, lineHeight: 1.5 }}>
            Cette section est protégée par mot de passe.
          </div>
          <input
            type="password" value={pwd} onChange={(e) => setPwd(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") { if (pwd === SETTINGS_PASSWORD) { onUnlock(); setPwd(""); } else { showToast("Mot de passe incorrect"); setPwd(""); } } }}
            placeholder="Mot de passe" style={{ ...inputStyle, width: "100%", marginBottom: 12 }}
          />
          <button
            onClick={() => { if (pwd === SETTINGS_PASSWORD) { onUnlock(); setPwd(""); } else { showToast("Mot de passe incorrect"); setPwd(""); } }}
            style={btnPrimary}
          >
            <Icon name="check" size={14} color="#fff" /> Déverrouiller
          </button>
        </div>
      </div>
    );
  }

  const save = () => {
    onSave({ workerUrl: workerUrl.trim(), appKey: appKey.trim() });
    showToast("Configuration enregistrée");
  };
  const runTest = async () => {
    if (!configured) return;
    setTesting(true);
    try {
      await githubTestConnection({ workerUrl: workerUrl.trim(), appKey: appKey.trim() });
      showToast("Connexion au relais réussie");
    } catch (e) {
      showToast(e && e.message ? e.message : "Échec de la connexion");
    } finally { setTesting(false); }
  };

  return (
    <div style={{ maxWidth: 640 }}>
      <div style={{ background: CARD, border: "none", boxShadow: CARD_SHADOW, borderRadius: 12, padding: 24, marginBottom: 16 }}>
        <div style={{ fontSize: 13.5, color: TEXT, lineHeight: 1.6, marginBottom: 16 }}>
          Pour sauvegarder et recharger vos données depuis n'importe où (sans dépendre du réseau d'entreprise),
          l'outil passe par un petit relais (<b>Cloudflare Worker</b>) qui détient le vrai accès GitHub côté serveur.
          Aucun jeton GitHub n'est jamais présent dans ce fichier — uniquement une clé d'application propre à ce relais.
          Ce mode s'ajoute au fichier réseau habituel, il ne le remplace pas.
        </div>
        <ol style={{ fontSize: 13, color: TEXT, lineHeight: 1.9, paddingLeft: 20, marginBottom: 20 }}>
          <li>Déployez le relais (fichier <code>worker_relais_github.js</code>) sur un compte Cloudflare Workers gratuit.</li>
          <li>Renseignez-y votre token GitHub et vos informations de dépôt (variables d'environnement du Worker, jamais dans ce fichier).</li>
          <li>Choisissez une clé d'application (une phrase longue et unique) et collez-la ci-dessous avec l'URL du Worker.</li>
        </ol>

        <label style={labelStyle}>URL du relais (Cloudflare Worker)</label>
        <input value={workerUrl} onChange={(e) => setWorkerUrl(e.target.value)} placeholder="https://paa-valence-relais.votre-compte.workers.dev" style={{ ...inputStyle, width: "100%", marginBottom: 14 }} />
        <label style={labelStyle}>Clé d'application</label>
        <input type="password" value={appKey} onChange={(e) => setAppKey(e.target.value)} placeholder="votre clé d'application" style={{ ...inputStyle, width: "100%", marginBottom: 20 }} />

        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button onClick={save} style={btnPrimary}><Icon name="check" size={14} color="#fff" /> Enregistrer la configuration</button>
          <button onClick={runTest} disabled={!configured || testing} style={{ ...btnSecondary, opacity: (!configured || testing) ? 0.5 : 1 }}>
            <Icon name="send" size={14} /> {testing ? "Test en cours..." : "Tester la connexion"}
          </button>
          {configured && <Badge color="#4F7942" soft>Configuré</Badge>}
        </div>
        <div style={{ fontSize: 11.5, color: TEXT_MUTE, marginTop: 14, lineHeight: 1.6 }}>
          Cette configuration peut être intégrée directement au fichier par un administrateur (comme c'est le cas ici pour Valence),
          car la clé d'application n'ouvre accès qu'à ce relais — jamais à votre compte GitHub. Le vrai jeton GitHub, lui, ne quitte jamais le Worker.
        </div>
      </div>
    </div>
  );
}
