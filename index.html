/*  Indicateurs QSE — constantes et calculs                             */
/* ------------------------------------------------------------------ */
const SEED_AXES = [
  { id: "client", label: "Qualité & Satisfaction Client", color: "#2C6E9E", icon: "client", title: "Améliorer nos services et nos prestations par l’innovation et l’exigence, toujours dans un souci de proximité vis à vis de nos clients et de réactivité à leur sollicitation" },
  { id: "conformite", label: "Conformité Réglementaire", color: "#5B6470", icon: "conformite", title: "Veiller à la conformité de nos pratiques par rapport aux exigences légales, réglementaires et normatives applicables" },
  { id: "securite", label: "Sécurité & Prévention", color: "#C1272D", icon: "securite", title: "Assurer la sécurité de nos salariés et développer une réelle culture de la prévention des risques partagée par tous" },
  { id: "performance", label: "Performance & Organisation", color: "#1F7A6C", icon: "performance", title: "Améliorer nos méthodes de travail et nos organisations par le professionnalisme de tous dans la finalité d'optimiser nos couts et de faire progresser nos performances" },
  { id: "environnement", label: "Environnement", color: "#2E7D46", icon: "environnement", title: "Préserver l’environnement, réduire notre empreinte écologique et améliorer notre performance environnementale" },
];
const AXE_PALETTE = ["#2C6E9E", "#5B6470", "#C1272D", "#1F7A6C", "#2E7D46", "#8B5CF6", "#B8860B", "#946B4E"];
const axeColor = (id, axes) => { const list = axes && axes.length ? axes : SEED_AXES; return (list.find((a) => a.id === id) || list[0] || { color: "#6B7280" }).color; };
const axeLabel = (id, axes) => { const list = axes && axes.length ? axes : SEED_AXES; return (list.find((a) => a.id === id) || {}).label || id; };
const MOIS = ["Jan", "Fév", "Mar", "Avr", "Mai", "Jun", "Jul", "Aoû", "Sep", "Oct", "Nov", "Déc"];
const AGG_OPTIONS = [
  { value: "mensuel", label: "Dernier mois renseigné" },
  { value: "moyenne", label: "Moyenne mensuelle" },
  { value: "cumul", label: "Cumul annuel" },
  { value: "trimestriel", label: "Dernier trimestre renseigné" },
  { value: "annuel", label: "Valeur annuelle" },
];
const INDIC_STATUT_COLOR = { "Atteint": "#4F7942", "Proche": "#B8860B", "En écart": "#B23A2E", "Non renseigné": "#8A93A3" };

function computeResultat(ind) {
  const vals = (ind.monthly || []).filter((v) => v !== null && v !== undefined && v !== "");
  if (vals.length === 0) return null;
  if (ind.agg === "cumul") return vals.reduce((s, v) => s + v, 0);
  if (ind.agg === "moyenne") return vals.reduce((s, v) => s + v, 0) / vals.length;
  return vals[vals.length - 1];
}
function computeEcart(ind, resultat) {
  if (resultat === null || !ind.cible) return null;
  const dir = ind.direction || 1;
  return dir === 1 ? (resultat - ind.cible) / Math.abs(ind.cible) : (ind.cible - resultat) / Math.abs(ind.cible);
}
function statutIndicateur(ind) {
  const resultat = computeResultat(ind);
  const ecart = computeEcart(ind, resultat);
  if (resultat === null || ecart === null) return "Non renseigné";
  if (ecart >= 0) return "Atteint";
  if (ecart >= -0.1) return "Proche";
  return "En écart";
}
function fmtValeur(v, unite) {
  if (v === null || v === undefined || isNaN(v)) return "—";
  if (unite === "%") return (Math.round(v * 1000) / 10).toLocaleString("fr-FR") + " %";
  const rounded = Math.round(v * 100) / 100;
  return rounded.toLocaleString("fr-FR") + (unite && unite !== "Nombre" ? " " + unite : "");
}
function toEditVal(v, unite) {
  if (v === null || v === undefined) return "";
  return unite === "%" ? Math.round(v * 1000) / 10 : v;
}
function fromEditVal(str, unite) {
  if (str === "" || str === null || str === undefined) return null;
  const n = Number(str);
  if (isNaN(n)) return null;
  return unite === "%" ? n / 100 : n;
}

function fmtAxisValue(v, unite) {
  if (v === null || v === undefined || isNaN(v)) return "—";
  if (unite === "%") return Math.round(v * 1000) / 10 + " %";
  if (Math.abs(v) >= 10000) return Math.round(v / 1000) + " k";
  return (Math.round(v * 100) / 100).toLocaleString("fr-FR");
}

function ChartSvg({ monthly, color, cible, unite, width, height, big, type }) {
  const padX = big ? 44 : 10;
  const padTop = big ? 26 : 15;
  const padBottom = big ? 34 : 18;
  const pts = monthly.map((v, i) => ({ v, i })).filter((p) => p.v !== null && p.v !== undefined);
  if (pts.length === 0) {
    return <div style={{ fontSize: 12.5, color: TEXT_MUTE, fontStyle: "italic", padding: "20px 0" }}>Aucune valeur mensuelle renseignée.</div>;
  }
  const allVals = pts.map((p) => p.v);
  let axisMin = Math.min(0, ...allVals);
  let axisMax = Math.max(...allVals);
  if (cible !== null && cible !== undefined && !isNaN(cible)) {
    axisMax = Math.max(axisMax, cible);
    axisMin = Math.min(axisMin, cible);
  }
  if (axisMax === axisMin) axisMax = axisMin + 1;
  axisMax += (axisMax - axisMin) * 0.12;

  const plotH = height - padTop - padBottom;
  const plotW = width - padX * 2;
  const stepX = plotW / 11;
  const yFor = (v) => padTop + plotH - ((v - axisMin) / (axisMax - axisMin)) * plotH;
  const coords = pts.map((p) => ({ x: padX + p.i * stepX, y: yFor(p.v), v: p.v, i: p.i }));
  const path = coords.map((c, idx) => (idx === 0 ? "M" : "L") + c.x.toFixed(1) + " " + c.y.toFixed(1)).join(" ");
  const gridLines = Array.from({ length: 5 }, (_, i) => axisMin + (axisMax - axisMin) * (i / 4));
  const hasCible = cible !== null && cible !== undefined && !isNaN(cible);
  const isBar = type === "bar";
  const barW = Math.min(stepX * 0.55, big ? 34 : 12);

  return (
    <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="xMidYMid meet">
      {gridLines.map((gv, i) => (
        <g key={i}>
          <line x1={padX} y1={yFor(gv)} x2={width - padX} y2={yFor(gv)} stroke={LINE} strokeWidth="1" strokeDasharray={Math.abs(gv) < 1e-9 ? "0" : "2,3"} />
          {big && <text x={padX - 8} y={yFor(gv) + 3} textAnchor="end" fontSize="9.5" fontFamily="'IBM Plex Mono', monospace" fill={TEXT_MUTE}>{fmtAxisValue(gv, unite)}</text>}
        </g>
      ))}
      {hasCible && (
        <g>
          <line x1={padX} y1={yFor(cible)} x2={width - padX} y2={yFor(cible)} stroke="#D98C2B" strokeWidth="1.5" strokeDasharray="5,3" />
          <text x={width - padX} y={yFor(cible) - 5} textAnchor="end" fontSize={big ? 10.5 : 8.5} fontFamily="'Inter', sans-serif" fill="#D98C2B" fontWeight="600">
            Cible {fmtAxisValue(cible, unite)}
          </text>
        </g>
      )}
      {isBar ? (
        coords.map((c, idx) => (
          <g key={idx}>
            <rect x={c.x - barW / 2} y={Math.min(c.y, yFor(0))} width={barW} height={Math.abs(yFor(0) - c.y)} rx="3" fill={color} />
            {big && <title>{MOIS[c.i]} : {fmtAxisValue(c.v, unite)}</title>}
          </g>
        ))
      ) : (
        <React.Fragment>
          <path d={path} fill="none" stroke={color} strokeWidth={big ? 2.5 : 2} />
          {coords.map((c, idx) => (
            <g key={idx}>
              <circle cx={c.x} cy={c.y} r={big ? 4 : 2.8} fill={color} />
              {big && <title>{MOIS[c.i]} : {fmtAxisValue(c.v, unite)}</title>}
            </g>
          ))}
        </React.Fragment>
      )}
      {MOIS.map((m, i) => (
        <text key={i} x={padX + i * stepX} y={height - (big ? 10 : 3)} textAnchor="middle" fontSize={big ? 10.5 : 8.5} fontFamily="'Inter', sans-serif" fill={TEXT_MUTE}>
          {big ? m : m[0]}
        </text>
      ))}
    </svg>
  );
}

function IndicateurCard({ ind, onUpdate, onDelete, axes, allIndicateurs, focusRequest }) {
  const [open, setOpen] = useState(false);
  const cardRef = React.useRef(null);
  const resultat = computeResultat(ind);
  const statut = statutIndicateur(ind);
  const color = axeColor(ind.axe, axes);
  const master = ind.parentId ? allIndicateurs.find((i) => i.id === ind.parentId) : null;
  const enfants = allIndicateurs.filter((i) => i.parentId === ind.id);

  useEffect(() => {
    if (focusRequest && focusRequest.id === ind.id) {
      setOpen(true);
      requestAnimationFrame(() => { if (cardRef.current) cardRef.current.scrollIntoView({ behavior: "smooth", block: "center" }); });
    }
  }, [focusRequest]);

  return (
    <div ref={cardRef} style={{ background: CARD, borderRadius: 12, border: `1px solid ${LINE}`, borderLeft: `4px solid ${color}`, marginBottom: 12, overflow: "hidden", boxShadow: CARD_SHADOW }}>
      <div onClick={() => setOpen((o) => !o)} style={{ padding: "14px 16px", cursor: "pointer", display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", background: INDIC_STATUT_COLOR[statut] + "0D" }}>
        <Icon name={open ? "chevronDown" : "chevronRight"} size={16} color={TEXT_MUTE} />
        <div style={{ flex: 1, minWidth: 200 }}>
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 14, color: TEXT }}>{ind.indicateur}</div>
          <div style={{ fontSize: 12, color: TEXT_MUTE, marginTop: 2 }}>
            {ind.processus}
            {master && <span style={{ marginLeft: 8, color: NAVY }}><Icon name="link" size={10} /> lié à : {master.indicateur}</span>}
            {enfants.length > 0 && <span style={{ marginLeft: 8, color: NAVY }}><Icon name="link" size={10} /> {enfants.length} indicateur(s) lié(s)</span>}
          </div>
        </div>
        <div style={{ fontSize: 12.5, color: TEXT, fontFamily: "'IBM Plex Mono', monospace", whiteSpace: "nowrap" }}>
          {fmtValeur(resultat, ind.unite)} <span style={{ color: TEXT_MUTE }}>/ cible {fmtValeur(ind.cible, ind.unite)}</span>
        </div>
        <Badge color={INDIC_STATUT_COLOR[statut]}>{statut}</Badge>
      </div>

      {open && (
        <div style={{ padding: "0 16px 18px 44px", borderTop: `1px solid ${LINE}` }}>
          <div style={{ display: "flex", gap: 24, flexWrap: "wrap", margin: "14px 0" }}>
            <div style={{ flex: "1 1 240px", minWidth: 220 }}>
              <div style={labelStyle}>Objectif</div>
              <EditableField value={ind.objectif} onCommit={(v) => onUpdate(ind.id, { objectif: v })} placeholder="Objectif visé..." multiline />
            </div>
            <div style={{ flex: "1 1 200px", minWidth: 200 }}>
              <div style={labelStyle}>Processus</div>
              <EditableField value={ind.processus} onCommit={(v) => onUpdate(ind.id, { processus: v })} placeholder="Processus concerné..." />
            </div>
          </div>

          <div style={{ display: "flex", gap: 20, flexWrap: "wrap", margin: "10px 0 16px" }}>
            <div>
              <div style={labelStyle}>Unité</div>
              <input value={ind.unite || ""} onChange={(e) => onUpdate(ind.id, { unite: e.target.value })} style={{ ...selectStyle, width: 90 }} />
            </div>
            <div>
              <div style={labelStyle}>Cible</div>
              <input type="number" step="any" value={toEditVal(ind.cible, ind.unite)} onChange={(e) => onUpdate(ind.id, { cible: fromEditVal(e.target.value, ind.unite) })} style={{ ...selectStyle, width: 90 }} />
            </div>
            <div>
              <div style={labelStyle}>Sens souhaité</div>
              <select value={ind.direction} onChange={(e) => onUpdate(ind.id, { direction: Number(e.target.value) })} style={selectStyle}>
                <option value={1}>Plus haut = mieux</option>
                <option value={-1}>Plus bas = mieux</option>
              </select>
            </div>
            <div>
              <div style={labelStyle}>Mode de calcul</div>
              <select value={ind.agg} onChange={(e) => onUpdate(ind.id, { agg: e.target.value })} style={selectStyle}>
                {AGG_OPTIONS.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
              </select>
            </div>
          </div>

          <div style={labelStyle}>Indicateur maître (optionnel)</div>
          <div style={{ marginBottom: 16 }}>
            <select
              value={ind.parentId || ""}
              onChange={(e) => onUpdate(ind.id, { parentId: e.target.value || null })}
              style={{ ...inputStyle, width: "100%" }}
            >
              <option value="">Aucun — indicateur indépendant</option>
              {allIndicateurs.filter((i) => i.id !== ind.id && i.parentId !== ind.id).map((i) => (
                <option key={i.id} value={i.id}>{axeLabel(i.axe, axes)} — {i.indicateur}</option>
              ))}
            </select>
            <div style={{ fontSize: 11.5, color: TEXT_MUTE, marginTop: 4 }}>
              Ex : « Réclamations clients Bron » peut être rattaché à l'indicateur maître « Réclamations clients ».
            </div>
          </div>

          <div style={labelStyle}>Valeurs mensuelles {ind.unite === "%" ? "(en %)" : ind.unite ? "(" + ind.unite + ")" : ""}</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(6, 1fr)", gap: 6, marginBottom: 16 }}>
            {MOIS.map((m, i) => (
              <div key={i}>
                <div style={{ fontSize: 10, color: TEXT_MUTE, textAlign: "center", marginBottom: 3 }}>{m}</div>
                <input
                  type="number" step="any"
                  value={toEditVal(ind.monthly[i], ind.unite)}
                  onChange={(e) => {
                    const next = ind.monthly.slice();
                    next[i] = fromEditVal(e.target.value, ind.unite);
                    onUpdate(ind.id, { monthly: next });
                  }}
                  style={{ ...inputStyle, width: "100%", padding: "6px 4px", fontSize: 12, textAlign: "center" }}
                />
              </div>
            ))}
          </div>

          <div style={labelStyle}>Évolution mensuelle</div>
          <div style={{ marginBottom: 16 }}>
            <MiniLineChart monthly={ind.monthly} color={color} cible={ind.cible} unite={ind.unite} />
          </div>

          <div style={labelStyle}>Commentaire de pilotage</div>
          <div style={{ marginBottom: 16 }}>
            <EditableField value={ind.commentaire} onCommit={(v) => onUpdate(ind.id, { commentaire: v })} placeholder="Analyse, contexte, plan d'amélioration..." multiline />
          </div>

          {enfants.length > 0 && (
            <div style={{ marginBottom: 16 }}>
              <div style={{ ...labelStyle, display: "flex", alignItems: "center", gap: 6 }}>
                <Icon name="link" size={12} color={TEXT_MUTE} /> Indicateurs liés ({enfants.length})
              </div>
              <div style={{ marginTop: 8, paddingLeft: 14, borderLeft: `2px solid ${LINE}` }}>
                {enfants.map((child) => (
                  <IndicateurCard key={child.id} ind={child} onUpdate={onUpdate} onDelete={onDelete} axes={axes} allIndicateurs={allIndicateurs} focusRequest={focusRequest} />
                ))}
              </div>
            </div>
          )}

          <button
            onClick={() => { if (window.confirm("Supprimer définitivement cet indicateur ?")) onDelete(ind.id); }}
            style={{ ...btnSecondary, color: "#B23A2E", borderColor: "#E8C6C2" }}
          >
            <Icon name="trash" size={14} /> Supprimer
          </button>
        </div>
      )}
    </div>
  );
}

function NouvelIndicateurForm({ axeId, onCreate, onCancel }) {
  const [form, setForm] = useState({ indicateur: "", processus: "", objectif: "", unite: "Nombre", cible: "", direction: 1, agg: "moyenne" });
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  const submit = () => {
    if (!form.indicateur.trim()) return;
    onCreate({
      axe: axeId, indicateur: form.indicateur.trim(), processus: form.processus.trim(), objectif: form.objectif.trim(),
      unite: form.unite.trim() || "Nombre", cible: fromEditVal(form.cible, form.unite.trim()), direction: Number(form.direction), agg: form.agg,
      monthly: Array(12).fill(null), commentaire: "",
    });
  };
  return (
    <div style={{ background: CARD, border: "none", boxShadow: CARD_SHADOW, borderRadius: 10, padding: 18, marginBottom: 16 }}>
      <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 14, color: TEXT, marginBottom: 12 }}>Nouvel indicateur</div>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 10 }}>
        <input value={form.indicateur} onChange={(e) => set("indicateur", e.target.value)} placeholder="Nom de l'indicateur" style={{ ...inputStyle, flex: "1 1 260px" }} />
        <input value={form.processus} onChange={(e) => set("processus", e.target.value)} placeholder="Processus" style={{ ...inputStyle, flex: "1 1 200px" }} />
      </div>
      <textarea value={form.objectif} onChange={(e) => set("objectif", e.target.value)} placeholder="Objectif visé..." rows={2} style={{ ...inputStyle, width: "100%", marginBottom: 10, fontFamily: "'Inter', sans-serif", resize: "vertical" }} />
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
        <input value={form.unite} onChange={(e) => set("unite", e.target.value)} placeholder="Unité (%, Nombre, Euros...)" style={{ ...inputStyle, width: 150 }} />
        <input type="number" step="any" value={form.cible} onChange={(e) => set("cible", e.target.value)} placeholder="Cible" style={{ ...inputStyle, width: 110 }} />
        <select value={form.direction} onChange={(e) => set("direction", e.target.value)} style={selectStyle}>
          <option value={1}>Plus haut = mieux</option>
          <option value={-1}>Plus bas = mieux</option>
        </select>
        <select value={form.agg} onChange={(e) => set("agg", e.target.value)} style={selectStyle}>
          {AGG_OPTIONS.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
        </select>
      </div>
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={submit} disabled={!form.indicateur.trim()} style={{ ...btnPrimary, opacity: !form.indicateur.trim() ? 0.5 : 1 }}><Icon name="plusCircle" size={14} color="#fff" /> Créer</button>
        <button onClick={onCancel} style={btnSecondary}>Annuler</button>
      </div>
    </div>
  );
}

function b64DecodeUtf8(b64str) {
  const bin = atob(b64str);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
function getRevueQSETemplate() { return b64DecodeUtf8(REVUE_QSE_TEMPLATE_B64_PARTS.join("")); }

/* ------------------------------------------------------------------ */
/*  Sauvegarde en ligne (dépôt GitHub privé) — pour un accès depuis     */
/*  n'importe où, sans dépendre du réseau d'entreprise.                 */
/* ------------------------------------------------------------------ */
function utf8ToB64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin);
}
// La sauvegarde en ligne passe par un petit relais (Cloudflare Worker) qui détient le vrai
// jeton GitHub côté serveur. Le navigateur ne connaît qu'une "clé d'application" (APP_KEY) qui
// n'ouvre accès qu'à ce relais — jamais un vrai jeton GitHub, qui serait automatiquement révoqué
// s'il était exposé dans ce fichier public (voir worker_relais_github.js pour le déploiement).
async function githubGetFile(cfg) {
  const res = await fetch(cfg.workerUrl + (cfg.workerUrl.includes("?") ? "&" : "?") + "t=" + Date.now(), {
    headers: { "X-App-Key": cfg.appKey },
  });
  if (res.status === 404) return { content: null, sha: null };
  if (res.status === 401) throw new Error("Clé d'application invalide : vérifiez qu'elle correspond exactement à celle du Worker (APP_KEY).");
  if (res.status === 502) { const d = await res.json().catch(() => null); throw new Error((d && d.message) || "GitHub a refusé la requête : vérifiez le token GitHub dans les réglages du Worker (pas dans l'outil)."); }
  if (!res.ok) throw new Error("Erreur du relais (" + res.status + ")");
  const data = await res.json();
  if (!data || !data.content) return { content: null, sha: (data && data.sha) || null };
  const content = b64DecodeUtf8((data.content || "").replace(/\n/g, ""));
  return { content, sha: data.sha };
}
async function githubPutFile(cfg, contentStr, sha, message) {
  const body = { message: message || "Mise à jour depuis l'outil Plan d'action", content: utf8ToB64(contentStr) };
  if (sha) body.sha = sha;
  const res = await fetch(cfg.workerUrl, {
    method: "PUT",
    headers: { "X-App-Key": cfg.appKey, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (res.status === 401) throw new Error("Clé d'application invalide : vérifiez qu'elle correspond exactement à celle du Worker (APP_KEY).");
  if (res.status === 502) { const d = await res.json().catch(() => null); throw new Error((d && d.message) || "GitHub a refusé la requête : vérifiez le token GitHub dans les réglages du Worker (pas dans l'outil)."); }
  if (res.status === 409) throw new Error("Le fichier a été modifié entre-temps par quelqu'un d'autre : rechargez avant d'enregistrer.");
  if (!res.ok) { const t = await res.text(); throw new Error("Erreur du relais (" + res.status + ") : " + t.slice(0, 200)); }
  return await res.json();
}
async function githubTestConnection(cfg) {
  const { sha } = await githubGetFile(cfg);
  return { ok: true, existe: sha !== null };
}

const QUARTER_LABELS = { 1: "Janvier à Mars", 2: "Janvier à Juin", 3: "Janvier à Septembre", 4: "Janvier à Décembre" };
const QUARTER_SEM = { 1: "T1", 2: "S1", 3: "T3 (9 mois)", 4: "Année complète" };
function monthsThroughQuarter(q) { return Array.from({ length: q * 3 }, (_, i) => i); }
function quarterOfISO(iso) { if (!iso) return null; const m = Number(iso.slice(5, 7)); return Math.ceil(m / 3) || 1; }
const REVUE_ICONS_CONNUES = ["client", "conformite", "securite", "performance", "environnement"];

function toRevueAxeJson(axe) {
  return {
    id: axe.id, label: axe.label, color: axe.color,
    icon: REVUE_ICONS_CONNUES.includes(axe.icon) ? axe.icon : (REVUE_ICONS_CONNUES.includes(axe.id) ? axe.id : "client"),
    title: axe.title || axe.label,
  };
}
function toRevueIndicateurJson(ind, quarter) {
  const keepMonths = monthsThroughQuarter(quarter);
  const monthly = ind.monthly.map((v, i) => (keepMonths.includes(i) ? v : null));
  const truncated = { ...ind, monthly };
  const resultat = computeResultat(truncated);
  const ecart = computeEcart(truncated, resultat);
  const commentaire = (ind.commentaires || [])
    .map((c) => `[T${quarterOfISO(c.date)} ${(c.date || "").slice(0, 4)}] ${c.texte}`)
    .join(String.fromCharCode(10) + String.fromCharCode(10)) || null;
  return {
    id: ind.id, axe: ind.axe, processus: ind.processus || "", objectif: ind.objectif || "",
    indicateur: ind.indicateur, res2025: (ind.resPrecedent === undefined ? null : ind.resPrecedent),
    cible2026: (ind.cible === undefined ? null : ind.cible), unite: ind.unite || "",
    monthly: monthly, resultat: resultat, uniteResultat: ind.unite || "",
    agg: ind.agg, direction: ind.direction, ecart: ecart, rawResultatNote: commentaire,
  };
}

function buildRevueQSEFull(agencyName, year, quarter, axes, indicateurs) {
  let html = getRevueQSETemplate();

  const dataJson = JSON.stringify({
    axes: axes.map(toRevueAxeJson),
    indicateurs: indicateurs.map((ind) => toRevueIndicateurJson(ind, quarter)),
  });
  const oldTitle = '<title>Revue QSE Trimestrielle — Agence de Lyon</title>';
  const newTitle = `<title>Revue QSE Trimestrielle — Agence de ${agencyName} — T${quarter} ${year}</title>`;
  const oldEyebrow = 'Pizzorno Environnement · Agence de Lyon';
  const newEyebrow = `Pizzorno Environnement · Agence de ${agencyName}`;
  const oldSub = "Suivi des indicateurs de management 2026 — synthèse Janvier à Juin, projections de fin d'année et plans d'actions associés. Cliquez sur une fiche pour l'ouvrir en détail.";
  const newSub = `Suivi des indicateurs de management ${year} — synthèse ${QUARTER_LABELS[quarter]}, projections de fin d'année et plans d'actions associés. Cliquez sur une fiche pour l'ouvrir en détail.`;
  const oldMeta = 'Période analysée : <b>&nbsp;S1 2026</b>';
  const newMeta = `Période analysée : <b>&nbsp;${QUARTER_SEM[quarter]} ${year}</b>`;

  html = html.replace(oldTitle, newTitle);
  html = html.replace(oldEyebrow, newEyebrow);
  html = html.replace(oldSub, newSub);
  html = html.replace(oldMeta, newMeta);
  // Remplace le bloc de données embarqué (axes + indicateurs) par les données fraîches de l'outil.
  html = html.replace(/\{"axes":.*?"indicateurs": \[.*?\]\}/s, dataJson);

  // Le fichier original enregistre ses modifications dans le navigateur sous une clé de
  // stockage FIXE ("dashboard_state_Lyon"), identique pour toutes les générations. Sans ce
  // correctif, ouvrir plusieurs revues (agences/trimestres différents) dans le même navigateur
  // les fait se marcher dessus : la plus récemment enregistrée écrase les données des autres au
  // prochain chargement. On rend donc cette clé unique à cette génération précise, et on
  // neutralise le repli sur l'ancienne clé partagée entre agences.
  const uniqueKey = "dashboard_state_" + agencyName.replace(/[^a-zA-Z0-9]/g, "") + "_T" + quarter + "_" + year;
  html = html.replace("const STORAGE_KEY = 'dashboard_state_Lyon';", "const STORAGE_KEY = '" + uniqueKey + "';");
  html = html.replace("const LEGACY_STORAGE_KEY = 'dashboard_state';", "const LEGACY_STORAGE_KEY = '" + uniqueKey + "__unused';");

  return html;
}

function IndicateursDashboard({ indicateurs, axes, setAxeTab, agency }) {
  const total = indicateurs.length;
  const withStatut = indicateurs.map((i) => ({ ...i, _statut: statutIndicateur(i) }));
  const nonRenseignes = withStatut.filter((i) => i._statut === "Non renseigné").length;
  const atteints = withStatut.filter((i) => i._statut === "Atteint").length;
  const enEcart = withStatut.filter((i) => i._statut === "En écart").length;
  const renseignes = total - nonRenseignes;
  const tauxAtteinte = renseignes ? Math.round((atteints / renseignes) * 100) : 0;

  const parStatut = ["Atteint", "Proche", "En écart", "Non renseigné"]
    .map((s) => ({ name: s, value: withStatut.filter((i) => i._statut === s).length, color: INDIC_STATUT_COLOR[s] }))
    .filter((x) => x.value > 0);

  const parAxe = axes.map((a) => {
    const list = withStatut.filter((i) => i.axe === a.id);
    const renseignesAxe = list.filter((i) => i._statut !== "Non renseigné");
    const atteintsAxe = list.filter((i) => i._statut === "Atteint");
    const pct = renseignesAxe.length ? Math.round((atteintsAxe.length / renseignesAxe.length) * 100) : 0;
    return { name: a.label.split(" ")[0], value: pct, color: a.color, axeId: a.id };
  });

  const enEcartList = withStatut.filter((i) => i._statut === "En écart");

  const kpis = [
    { label: "Indicateurs suivis", value: total, icon: "list", color: NAVY },
    { label: "Taux d'atteinte", value: tauxAtteinte + "%", icon: "check", color: "#4F7942" },
    { label: "En écart", value: enEcart, icon: "alert", color: "#B23A2E" },
    { label: "Non renseignés", value: nonRenseignes, icon: "calendar", color: "#8A93A3" },
  ];

  const now = new Date();
  const [showRevuePicker, setShowRevuePicker] = useState(false);
  const [revueYear, setRevueYear] = useState(now.getFullYear());
  const [revueQuarter, setRevueQuarter] = useState(Math.floor(now.getMonth() / 3) + 1);

  const genererRevue = () => {
    const html = buildRevueQSEFull(agency, revueYear, revueQuarter, axes, indicateurs);
    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `Revue_QSE_T${revueQuarter}_${revueYear}_${agency}.html`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setShowRevuePicker(false);
  };

  return (
    <div>
      {!LOCKED_AGENCY && (
        <div style={{ marginBottom: 18 }}>
          <div style={{ display: "flex", justifyContent: "flex-end" }}>
            <button onClick={() => setShowRevuePicker((s) => !s)} style={btnSecondary}>
              <Icon name="download" size={14} /> Générer la revue QSE...

          {showRevuePicker && (
            <div style={{ ...softCard, padding: 18, marginTop: 10 }}>

              <div style={{ display: "flex", gap: 20, flexWrap: "wrap", alignItems: "flex-end", marginBottom: 16 }}>
                <div>
                  <div style={{ fontSize: 11, color: TEXT_MUTE, marginBottom: 5 }}>Trimestre</div>
                  <div style={{ display: "flex", gap: 6 }}>
                    {[1, 2, 3, 4].map((q) => (
                      <button key={q} onClick={() => setRevueQuarter(q)} style={{
                        padding: "8px 14px", borderRadius: 8, cursor: "pointer", fontSize: 13, fontWeight: 600,

                        background: revueQuarter === q ? NAVY : "#fff", color: revueQuarter === q ? "#fff" : TEXT,
                      }}>T{q}</button>
                    ))}
                  </div>
                </div>
                <div>
                  <div style={{ fontSize: 11, color: TEXT_MUTE, marginBottom: 5 }}>Année</div>
                  <input type="number" value={revueYear} onChange={(e) => setRevueYear(Number(e.target.value))} style={{ ...inputStyle, width: 90 }} />
                </div>
                <div style={{ fontSize: 11.5, color: TEXT_MUTE }}>
                  Période prise en compte : <b>{QUARTER_LABELS[revueQuarter]} {revueYear}</b>
                </div>
              </div>
              <button onClick={genererRevue} style={btnPrimary}><Icon name="download" size={14} color="#fff" /> Télécharger le fichier HTML</button>
            </div>
          )}
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 14, marginBottom: 22 }}>
        {kpis.map((k) => (

            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>

          <MiniBarChart data={parAxe} />

          {parStatut.length ? <MiniDonut data={parStatut} /> : <EmptyState icon="list" title="Aucune donnée" />}
        </div>

      <div style={{ background: CARD, border: "none", boxShadow: CARD_SHADOW, borderRadius: 12, padding: "18px 20px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
          <Icon name="alert" size={15} color="#B23A2E" />
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 14.5, color: TEXT }}>Indicateurs en écart ({enEcartList.length})</div>
        </div>
        {enEcartList.length === 0 && <EmptyState icon="check" title="Aucun indicateur en écart" subtitle="Tous les indicateurs renseignés sont proches ou au-dessus de leur cible." />}

function AxeIndicateurs({ indicateurs, axe, axes, onCreate, onUpdate, onDelete, onAddComment, focusRequest, cardView }) {
  const [q, setQ] = useState("");
  const [showNew, setShowNew] = useState(false);
  const [openId, setOpenId] = useState(null);
  const list = indicateurs.filter((i) => i.axe === axe.id);
  // Les indicateurs esclaves sont affichés imbriqués dans leur maître ; on ne montre ici
  // que les indicateurs de premier niveau (sans maître, ou dont le maître n'est pas dans cet axe).
  // Lors d'une recherche, on bascule en liste plate pour ne rien manquer.
  const topLevel = list.filter((i) => !i.parentId || !list.find((m) => m.id === i.parentId));
  const filtered = q
    ? list.filter((i) => i.indicateur.toLowerCase().includes(q.toLowerCase()))
    : topLevel;
  const openInd = openId ? indicateurs.find((i) => i.id === openId) : null;

  return (
    <div>
      <div style={{ display: "flex", gap: 10, marginBottom: 16, flexWrap: "wrap" }}>
        <div style={{ position: "relative", flex: 1, minWidth: 200 }}>
          <div style={{ position: "absolute", left: 10, top: 10 }}><Icon name="search" size={14} color={TEXT_MUTE} /></div>
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Rechercher un indicateur..." style={{ ...inputStyle, width: "100%", paddingLeft: 30 }} />
        </div>
        <button onClick={() => setShowNew((s) => !s)} style={btnPrimary}><Icon name="plusCircle" size={14} color="#fff" /> Nouvel indicateur</button>
      </div>
      {showNew && <NouvelIndicateurForm axeId={axe.id} onCreate={(data) => { onCreate(data); setShowNew(false); }} onCancel={() => setShowNew(false)} />}
      {filtered.length === 0 && <EmptyState icon="list" title={list.length === 0 ? `Aucun indicateur pour ${axe.label}` : "Aucun indicateur ne correspond"} subtitle={list.length === 0 ? "Ajoutez-en un avec le bouton ci-dessus." : "Essayez une autre recherche."} />}
      {cardView ? (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: 22 }}>
          {filtered.map((i) => <IndicateurCardFace key={i.id} ind={i} axes={axes} onClick={() => setOpenId(i.id)} />)}
        </div>
      ) : (
        filtered.map((i) => <IndicateurCard key={i.id} ind={i} onUpdate={onUpdate} onDelete={onDelete} axes={axes} allIndicateurs={indicateurs} focusRequest={focusRequest} />)
      )}
      {cardView && openInd && (
        <IndicateurDetailModal ind={openInd} axes={axes} allIndicateurs={indicateurs} onUpdate={onUpdate} onDelete={onDelete} onAddComment={onAddComment} onSelectId={setOpenId} onClose={() => setOpenId(null)} />
      )}
    </div>
  );
}

function ToutesIndicateurs({ indicateurs, axes, setAxeTab }) {
  const [q, setQ] = useState("");
  const [fAxe, setFAxe] = useState("");
  const [fStatut, setFStatut] = useState("");

        </select>
      </div>
      <div style={{ fontSize: 12.5, color: TEXT_MUTE, marginBottom: 10 }}>{filtered.length} indicateur(s)</div>
      {filtered.length === 0 && <EmptyState icon="list" title="Aucun indicateur ne correspond" subtitle="Essayez d'élargir les filtres." />}
      {filtered.map((i) => (

        </div>
      ))}
    </div>
  );
}

function GestionAxes({ axes, indicateurs, onUpdateAxes, showToast }) {
  const [nom, setNom] = useState("");
  const [couleur, setCouleur] = useState(AXE_PALETTE[axes.length % AXE_PALETTE.length]);

  const addAxe = () => {
    if (!nom.trim()) return;
    const id = sanitizeName(nom).toLowerCase() + "-" + Date.now().toString(36).slice(-4);
    if (axes.find((a) => a.label.toLowerCase() === nom.trim().toLowerCase())) { showToast("Cet axe existe déjà"); return; }
    onUpdateAxes([...axes, { id, label: nom.trim(), color: couleur }]);
    setNom(""); setCouleur(AXE_PALETTE[(axes.length + 1) % AXE_PALETTE.length]);
  };
  const editAxe = (idx, patch) => onUpdateAxes(axes.map((a, i) => (i === idx ? { ...a, ...patch } : a)));
  const removeAxe = (idx) => {
    const axe = axes[idx];
    const nbLies = indicateurs.filter((i) => i.axe === axe.id).length;
    if (nbLies > 0) { showToast(`Impossible : ${nbLies} indicateur(s) utilisent cet axe. Réaffectez-les d'abord.`); return; }
    if (!window.confirm(`Supprimer l'axe « ${axe.label} » ?`)) return;
    onUpdateAxes(axes.filter((_, i) => i !== idx));
  };

  return (
    <div style={{ maxWidth: 640 }}>
      <div style={{ background: CARD, border: "none", boxShadow: CARD_SHADOW, borderRadius: 12, padding: 24 }}>
        <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 15, color: TEXT, marginBottom: 14 }}>Axes de suivi</div>
        {axes.map((a, i) => (
          <div key={a.id} style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8, flexWrap: "wrap" }}>
            <input type="color" value={a.color} onChange={(e) => editAxe(i, { color: e.target.value })} style={{ width: 34, height: 34, padding: 0, border: `1px solid ${LINE}`, borderRadius: 6, cursor: "pointer" }} />
            <input value={a.label} onChange={(e) => editAxe(i, { label: e.target.value })} style={{ ...inputStyle, flex: 1, minWidth: 180 }} />
            <span style={{ fontSize: 11, color: TEXT_MUTE, fontFamily: "'IBM Plex Mono', monospace" }}>{indicateurs.filter((ind) => ind.axe === a.id).length} indicateur(s)</span>
            <button onClick={() => removeAxe(i)} style={{ ...btnSecondary, padding: "8px 10px", color: "#B23A2E" }}><Icon name="trash" size={14} /></button>
          </div>
        ))}
        {axes.length === 0 && <div style={{ fontSize: 13, color: TEXT_MUTE, fontStyle: "italic", marginBottom: 10 }}>Aucun axe défini.</div>}
        <div style={{ display: "flex", gap: 8, marginTop: 14, flexWrap: "wrap", alignItems: "center" }}>
          <input type="color" value={couleur} onChange={(e) => setCouleur(e.target.value)} style={{ width: 34, height: 34, padding: 0, border: `1px solid ${LINE}`, borderRadius: 6, cursor: "pointer" }} />
          <input placeholder="Nom du nouvel axe" value={nom} onChange={(e) => setNom(e.target.value)} style={{ ...inputStyle, flex: 1, minWidth: 180 }} />
          <button onClick={addAxe} style={btnPrimary}><Icon name="plus" size={14} color="#fff" /> Ajouter</button>
        </div>
      </div>
    </div>
  );
}

          const data = JSON.parse(text);
          if (data.actions) persistActions(data.actions);
          if (data.pilotes) persistPilotes(data.pilotes);
          if (data.origines) persistOrigines(data.origines);
        if (data.indicateurs && data.indicateurs.length) persistIndicateurs(data.indicateurs);

        setDirtyMap((m) => ({ ...m, [agencyRef.current]: false }));
        showToast("Nouveau fichier de sauvegarde créé : " + handle.name);

            <div style={{ background: "#171E27", borderRadius: 12, padding: 4, marginBottom: 8 }}>
              <div onClick={() => setExpandedConnector((c) => (c === "file" ? null : "file"))} className="connector-row" style={{ display: "flex", alignItems: "center", gap: 9, padding: "8px 8px", borderRadius: 9, cursor: "pointer" }}>
                <div style={{ width: 28, height: 28, borderRadius: 8, background: "#232C38", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                  <Icon name="download" size={13} color="#B7BFC9" />
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 11.5, color: "#D7DCE2", fontWeight: 600 }}>Sauvegarde</div>
                  <div style={{ fontSize: 10, color: "#5C6675", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{fileHandle ? fileName : "Non liée"}</div>
                </div>
                <span style={{ width: 7, height: 7, borderRadius: 99, flexShrink: 0, background: !fileHandle ? "#5C6675" : filePermGranted ? "#4F7942" : "#D98C2B" }} />
                <Icon name={expandedConnector === "file" ? "chevronDown" : "chevronRight"} size={13} color="#5C6675" />
              </div>
              {expandedConnector === "file" && (
                <div style={{ padding: "2px 8px 8px" }}>
                  {fileHandle ? (
                    !filePermGranted ? (
                      <button onClick={authorizeFile} disabled={fsaBusy} style={{ ...compactBtn, background: "#4A3200", color: "#FFD98A", width: "100%", justifyContent: "center" }}>
                        <Icon name="check" size={12} /> {fsaBusy ? "En attente..." : "Autoriser l'accès"}
                      </button>
                    ) : (
                      <div style={{ display: "flex", gap: 6 }}>
                        <button onClick={saveToFile} disabled={fileBusy || fsaBusy} title="Enregistrer" style={iconBtn}><Icon name="download" size={14} /></button>
                        <button onClick={loadFromFile} disabled={fileBusy || fsaBusy} title="Charger depuis le fichier" style={iconBtn}><Icon name="upload" size={14} /></button>
                        <button onClick={forgetFile} title="Changer de fichier" style={iconBtn}><Icon name="x" size={14} /></button>
                      </div>
                    )
                  ) : (
                    <div style={{ display: "flex", gap: 6 }}>
                      <button onClick={chooseExistingFile} disabled={fsaBusy} title="Sélectionner un fichier de sauvegarde existant" style={{ ...compactBtn, flex: 1, justifyContent: "center" }}>
                        <Icon name="upload" size={12} /> Ouvrir
                      </button>
                      <button onClick={createNewFile} disabled={fsaBusy} title="Créer un nouveau fichier dans un dossier" style={{ ...compactBtn, flex: 1, justifyContent: "center" }}>
                        <Icon name="folder" size={12} /> Créer
                      </button>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}

          {FSA_SUPPORTED && (
            <div style={{ background: "#171E27", borderRadius: 12, padding: 4, marginBottom: 10 }}>
              <div onClick={() => setExpandedConnector((c) => (c === "dir" ? null : "dir"))} className="connector-row" style={{ display: "flex", alignItems: "center", gap: 9, padding: "8px 8px", borderRadius: 9, cursor: "pointer" }}>
                <div style={{ width: 28, height: 28, borderRadius: 8, background: "#232C38", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                  <Icon name="clip" size={13} color="#B7BFC9" />
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 11.5, color: "#D7DCE2", fontWeight: 600 }}>Pièces jointes</div>
                  <div style={{ fontSize: 10, color: "#5C6675", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{dirHandle ? dirName : "Non lié"}</div>
                </div>
                <span style={{ width: 7, height: 7, borderRadius: 99, flexShrink: 0, background: !dirHandle ? "#5C6675" : dirPermGranted ? "#4F7942" : "#D98C2B" }} />
                <Icon name={expandedConnector === "dir" ? "chevronDown" : "chevronRight"} size={13} color="#5C6675" />
              </div>
              {expandedConnector === "dir" && (
                <div style={{ padding: "2px 8px 8px" }}>
                  {dirHandle ? (
                    !dirPermGranted ? (
                      <button onClick={authorizeDir} disabled={fsaBusy} style={{ ...compactBtn, background: "#4A3200", color: "#FFD98A", width: "100%", justifyContent: "center" }}>
                        <Icon name="check" size={12} /> {fsaBusy ? "En attente..." : "Autoriser l'accès"}
                      </button>
                    ) : (
                      <button onClick={forgetAttachmentsFolder} title="Changer de dossier" style={{ ...compactBtn, width: "100%", justifyContent: "center" }}>
                        <Icon name="x" size={12} /> Changer
                      </button>
                    )
                  ) : (
                    <button onClick={chooseAttachmentsFolder} disabled={fsaBusy} style={{ ...compactBtn, width: "100%", justifyContent: "center" }}>
                      <Icon name="folder" size={12} /> {fsaBusy ? "En attente..." : "Lier un dossier"}
                    </button>
                  )}
                </div>
              )}
            </div>
          )}

          {isMaitre && (
            <div style={{ background: "#171E27", borderRadius: 12, padding: 4, marginBottom: 10 }}>
              <div onClick={() => setExpandedConnector((c) => (c === "github" ? null : "github"))} className="connector-row" style={{ display: "flex", alignItems: "center", gap: 9, padding: "8px 8px", borderRadius: 9, cursor: "pointer" }}>
                <div style={{ width: 28, height: 28, borderRadius: 8, background: "#232C38", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                  <Icon name="link" size={13} color="#B7BFC9" />
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 11.5, color: "#D7DCE2", fontWeight: 600 }}>En ligne (GitHub)</div>
                  <div style={{ fontSize: 10, color: "#5C6675", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{githubConfig && githubConfig.appKey ? "Relais configuré" : "Non configuré"}</div>
                </div>
                <span style={{ width: 7, height: 7, borderRadius: 99, flexShrink: 0, background: githubConfig && githubConfig.appKey ? "#4F7942" : "#5C6675" }} />
                <Icon name={expandedConnector === "github" ? "chevronDown" : "chevronRight"} size={13} color="#5C6675" />
              </div>
              {expandedConnector === "github" && (
                <div style={{ padding: "2px 8px 8px" }}>
                  {githubConfig && githubConfig.appKey ? (
                    <div style={{ display: "flex", gap: 6 }}>
                      <button onClick={saveOnline} disabled={githubBusy} title="Enregistrer en ligne" style={iconBtn}><Icon name="download" size={14} /></button>
                      <button onClick={loadOnline} disabled={githubBusy} title="Charger depuis la sauvegarde en ligne" style={iconBtn}><Icon name="upload" size={14} /></button>
                      <button onClick={() => setTab("github")} title="Modifier la configuration" style={iconBtn}><Icon name="settings" size={14} /></button>
                    </div>
                  ) : (
                    <button onClick={() => setTab("github")} style={{ ...compactBtn, width: "100%", justifyContent: "center" }}>
                      <Icon name="settings" size={12} /> Configurer
                    </button>
                  )}
                  {githubBusy && <div style={{ fontSize: 10, color: "#8892A0", marginTop: 6 }}>En cours...</div>}
                </div>
              )}
            </div>
          )}

          <div style={{ fontSize: 10, color: "#5C6675", display: "flex", alignItems: "center", gap: 5, padding: "0 4px 12px" }}>
            <Icon name="users" size={10} color="#5C6675" /> {pilotes.length} pilote(s) enregistré(s)
          </div>
        </div>
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: "26px 32px" }}>
        <div style={{ background: "#E4E7EC", borderRadius: 16, padding: "24px 28px", marginBottom: 24, textAlign: "center" }}>
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 800, fontSize: 25, color: "#12181F", letterSpacing: 0.2 }}>
            {navItems.find((n) => n.id === tab)?.label || activeDomaine || activeAxe?.label}
          </div>
          <div style={{ fontSize: 13, color: TEXT_MUTE, marginTop: 6 }}>
            {appMode === "plan" && tab === "dashboard" && "Vue d'ensemble de l'activité de l'agence"}
            {appMode === "plan" && tab === "nouvelle" && "Créer une nouvelle action et l'assigner à un pilote"}
            {appMode === "plan" && activeDomaine && `Actions sur le domaine ${activeDomaine}`}
            {appMode === "plan" && tab === "cloturees" && "Historique des actions terminées ou annulées"}
            {appMode === "plan" && tab === "toutes" && "Ensemble des actions du plan, tous domaines confondus"}
            {appMode === "plan" && tab === "gestion" && "Gérer la liste des pilotes et des origines"}
            {appMode === "plan" && tab === "parametres" && "Configurer l'envoi automatique des notifications par email"}
            {appMode === "plan" && tab === "github" && "Sauvegarder et recharger vos données depuis n'importe où, via un dépôt GitHub privé"}
            {appMode === "indicateurs" && tab === "dashboard" && "Vue d'ensemble des indicateurs QSE de l'agence"}
            {appMode === "indicateurs" && activeAxe && activeAxe.label}
            {appMode === "indicateurs" && tab === "toutes-indicateurs" && "Ensemble des indicateurs, tous axes confondus"}
            {appMode === "indicateurs" && tab === "gestion-axes" && "Créer, modifier ou supprimer les axes de suivi"}
          </div>
        </div>

        {appMode === "plan" && tab === "dashboard" && <Dashboard actions={visibleActions} pilotes={pilotes} agency={agency} setTab={setTab} emailConfig={emailConfig} showToast={showToast} onOpenAction={openActionInContext} />}
        {appMode === "plan" && tab === "nouvelle" && <NouvelleAction pilotes={pilotes} agency={agency} onCreate={createAction} onAddPilote={addPilote} origines={origines} onAddOrigine={addOrigine} emailConfig={emailConfig} showToast={showToast} setTab={setTab} />}
        {appMode === "plan" && activeDomaine && (
          <DomaineActions
            actions={visibleActions}
            domaine={activeDomaine}
            actionCardProps={{ onUpdate: updateAction, onComment: addComment, onClose: closeAction, onReopen: reopenAction, onDelete: deleteAction, emailConfig, showToast, setTab, origines, pilotes, dirLinked: !!dirHandle, onAddLocalFile: addLocalFile, onOpenLocalFile: openLocalFile, focusRequest }}
          />
        )}
        {appMode === "plan" && tab === "cloturees" && (
          <CloturesActions
            actions={visibleActions}
            actionCardProps={{ onUpdate: updateAction, onComment: addComment, onClose: closeAction, onReopen: reopenAction, onDelete: deleteAction, emailConfig, showToast, setTab, origines, pilotes, dirLinked: !!dirHandle, onAddLocalFile: addLocalFile, onOpenLocalFile: openLocalFile, focusRequest }}
          />
        )}
        {appMode === "plan" && tab === "toutes" && <ToutesActions actions={visibleActions} setTab={setTab} onOpenAction={openActionInContext} onExportMatrice={exportToMatricePAA} importBusy={importBusy} importPreview={importPreview} onImportFile={handleImportFile} onConfirmImport={confirmImport} onCancelImport={cancelImport} />}
        {appMode === "plan" && tab === "gestion" && isMaitre && <GestionListes pilotes={pilotes} onUpdatePilotes={persistPilotes} origines={origines} onUpdateOrigines={persistOrigines} showToast={showToast} />}
        {appMode === "plan" && tab === "parametres" && isMaitre && <ParametresEmail emailConfig={emailConfig} onSave={saveEmailConfig} showToast={showToast} unlocked={settingsUnlocked} onUnlock={() => setSettingsUnlocked(true)} />}
        {appMode === "plan" && tab === "github" && isMaitre && <ParametresGitHub githubConfig={githubConfig} onSave={saveGithubConfig} showToast={showToast} unlocked={settingsUnlocked} onUnlock={() => setSettingsUnlocked(true)} />}
        {appMode === "plan" && tab === "comptes" && isMaitre && <GestionComptes roles={roles} pilotes={pilotes} onUpdateRoles={persistRoles} showToast={showToast} />}

        {appMode === "indicateurs" && tab === "dashboard" && <IndicateursDashboard indicateurs={indicateurs} axes={axes} setAxeTab={openAxeTab} agency={agency} />}
        {appMode === "indicateurs" && activeAxe && (
          <AxeIndicateurs indicateurs={indicateurs} axe={activeAxe} axes={axes} onCreate={createIndicateur} onUpdate={updateIndicateur} onDelete={deleteIndicateur} onAddComment={addIndicateurComment} focusRequest={focusRequest} cardView={!LOCKED_AGENCY} />
        )}
        {appMode === "indicateurs" && tab === "toutes-indicateurs" && <ToutesIndicateurs indicateurs={indicateurs} axes={axes} setAxeTab={openAxeTab} />}
        {appMode === "indicateurs" && tab === "gestion-axes" && <GestionAxes axes={axes} indicateurs={indicateurs} onUpdateAxes={persistAxes} showToast={showToast} />}
      </div>

      {toast && (
        <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", background: INK, color: "#fff", padding: "10px 18px", borderRadius: 8, fontSize: 13, fontFamily: "'Inter', sans-serif", boxShadow: "0 8px 24px rgba(0,0,0,0.25)" }}>
          {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PlanActionApp />);
</script>
<script>
  // Transpile the app source explicitly with the classic JSX runtime (React.createElement),
  // so it does not depend on Babel Standalone's default preset configuration.
  (function () {
    var source = document.getElementById("app-source").textContent;
    var compiled = Babel.transform(source, {
      presets: [["react", { runtime: "classic" }]]
    }).code;
    var script = document.createElement("script");
    script.textContent = compiled;
    document.body.appendChild(script);
  })();
</script>
</body>
</html>
