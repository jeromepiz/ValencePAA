/*  Gestion des comptes (mots de passe + affectation des pilotes)       */
/* ------------------------------------------------------------------ */
function GestionComptes({ roles, pilotes, onUpdateRoles, showToast }) {
  const [masterPwd, setMasterPwd] = useState(roles.masterPassword || "");
  const [exploitationPwd, setExploitationPwd] = useState(roles.exploitationPassword || "");
  const [preventionPwd, setPreventionPwd] = useState(roles.preventionPassword || "");

  const savePasswords = () => {
    onUpdateRoles({ ...roles, masterPassword: masterPwd, exploitationPassword: exploitationPwd, preventionPassword: preventionPwd });
    showToast("Mots de passe mis à jour");
  };
  const toggleInGroup = (group, nom) => {
    const key = group === "exploitation" ? "exploitationPilotes" : "preventionPilotes";
    const current = roles[key] || [];
    const next = current.includes(nom) ? current.filter((n) => n !== nom) : [...current, nom];
    onUpdateRoles({ ...roles, [key]: next });
  };
  const isPiloteAllowed = (nom) => !roles.allowedPilotes || roles.allowedPilotes.length === 0 || roles.allowedPilotes.includes(nom);
  const toggleAllowedPilote = (nom) => {
    const currentlyAll = !roles.allowedPilotes || roles.allowedPilotes.length === 0;
    const baseList = currentlyAll ? pilotes.map((p) => p.nom) : roles.allowedPilotes;
    const next = baseList.includes(nom) ? baseList.filter((n) => n !== nom) : [...baseList, nom];
    onUpdateRoles({ ...roles, allowedPilotes: next });
  };

  return (
    <div style={{ maxWidth: 700, display: "flex", flexDirection: "column", gap: 20 }}>
      <div style={{ background: CARD, border: "none", boxShadow: CARD_SHADOW, borderRadius: 12, padding: 24 }}>
        <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 15, color: TEXT, marginBottom: 14 }}>Mots de passe des comptes</div>
        <label style={labelStyle}>Administrateur</label>
        <input type="text" value={masterPwd} onChange={(e) => setMasterPwd(e.target.value)} style={{ ...inputStyle, width: "100%", marginBottom: 12 }} />
        <label style={labelStyle}>Compte exploitation</label>
        <input type="text" value={exploitationPwd} onChange={(e) => setExploitationPwd(e.target.value)} style={{ ...inputStyle, width: "100%", marginBottom: 12 }} />
        <label style={labelStyle}>Compte prévention</label>
        <input type="text" value={preventionPwd} onChange={(e) => setPreventionPwd(e.target.value)} style={{ ...inputStyle, width: "100%", marginBottom: 16 }} />
        <button onClick={savePasswords} style={btnPrimary}><Icon name="check" size={14} color="#fff" /> Enregistrer les mots de passe</button>
        <div style={{ fontSize: 11.5, color: TEXT_MUTE, marginTop: 10 }}>
          Comme pour les paramètres email, ces mots de passe sont visibles dans le code source du fichier : c'est un frein contre les erreurs de manipulation, pas une vraie protection contre une personne malveillante.
        </div>
      </div>

      <div style={{ background: CARD, border: "none", boxShadow: CARD_SHADOW, borderRadius: 12, padding: 24 }}>
        <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 15, color: TEXT, marginBottom: 6 }}>Pilotes rattachés à Exploitation</div>
        <div style={{ fontSize: 11.5, color: TEXT_MUTE, marginBottom: 12 }}>Ce compte ne verra que les actions des pilotes cochés ci-dessous.</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {pilotes.map((p) => {
            const checked = (roles.exploitationPilotes || []).includes(p.nom);
            return (
              <label key={p.nom} style={{ display: "flex", alignItems: "center", gap: 6, cursor: "pointer", background: checked ? "#EAF0FB" : "#fff", border: `1px solid ${checked ? NAVY + "55" : LINE}`, borderRadius: 7, padding: "6px 10px", fontSize: 12.5 }}>
                <input type="checkbox" checked={checked} onChange={() => toggleInGroup("exploitation", p.nom)} /> {p.nom}
              </label>
            );
          })}
          {pilotes.length === 0 && <div style={{ fontSize: 13, color: TEXT_MUTE, fontStyle: "italic" }}>Aucun pilote enregistré.</div>}
        </div>
      </div>

      <div style={{ background: CARD, border: "none", boxShadow: CARD_SHADOW, borderRadius: 12, padding: 24 }}>
        <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 15, color: TEXT, marginBottom: 6 }}>Pilotes rattachés à Prévention</div>
        <div style={{ fontSize: 11.5, color: TEXT_MUTE, marginBottom: 12 }}>Ce compte ne verra que les actions des pilotes cochés ci-dessous.</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {pilotes.map((p) => {
            const checked = (roles.preventionPilotes || []).includes(p.nom);
            return (
              <label key={p.nom} style={{ display: "flex", alignItems: "center", gap: 6, cursor: "pointer", background: checked ? "#EAF0FB" : "#fff", border: `1px solid ${checked ? NAVY + "55" : LINE}`, borderRadius: 7, padding: "6px 10px", fontSize: 12.5 }}>
                <input type="checkbox" checked={checked} onChange={() => toggleInGroup("prevention", p.nom)} /> {p.nom}
              </label>
            );
          })}
          {pilotes.length === 0 && <div style={{ fontSize: 13, color: TEXT_MUTE, fontStyle: "italic" }}>Aucun pilote enregistré.</div>}
        </div>
      </div>

      <div style={{ background: CARD, border: "none", boxShadow: CARD_SHADOW, borderRadius: 12, padding: 24 }}>
        <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 15, color: TEXT, marginBottom: 6 }}>Comptes pilotes autorisés</div>
        <div style={{ fontSize: 11.5, color: TEXT_MUTE, marginBottom: 12 }}>
          Décochez un pilote pour lui retirer l'accès à l'écran de connexion « Pilote » (il n'apparaîtra plus dans la liste proposée). Tous les pilotes sont autorisés par défaut.
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {pilotes.map((p) => {
            const checked = isPiloteAllowed(p.nom);
            return (
              <label key={p.nom} style={{ display: "flex", alignItems: "center", gap: 6, cursor: "pointer", background: checked ? "#F1F7EE" : "#FBEFEF", border: `1px solid ${checked ? "#4F794255" : "#E8C6C2"}`, borderRadius: 7, padding: "6px 10px", fontSize: 12.5, color: checked ? TEXT : "#B23A2E" }}>
                <input type="checkbox" checked={checked} onChange={() => toggleAllowedPilote(p.nom)} /> {p.nom}
              </label>
            );
          })}
          {pilotes.length === 0 && <div style={{ fontSize: 13, color: TEXT_MUTE, fontStyle: "italic" }}>Aucun pilote enregistré.</div>}
        </div>
      </div>
    </div>
  );
}

function GestionListes({ pilotes, onUpdatePilotes, origines, onUpdateOrigines, showToast }) {
  const [nomP, setNomP] = useState("");
  const [emailP, setEmailP] = useState("");
  const [nouvOrigine, setNouvOrigine] = useState("");

  const addPilote = () => {
    if (!nomP.trim() || !emailP.trim()) return;
    if (pilotes.find((p) => p.nom.toLowerCase() === nomP.trim().toLowerCase())) { showToast("Ce pilote existe déjà"); return; }
    onUpdatePilotes([...pilotes, { nom: nomP.trim(), email: emailP.trim() }]);
    setNomP(""); setEmailP("");
  };
  const editPilote = (idx, patch) => {
    onUpdatePilotes(pilotes.map((p, i) => (i === idx ? { ...p, ...patch } : p)));
  };
  const removePilote = (idx) => {
    if (!window.confirm("Supprimer ce pilote ? Les actions déjà créées conserveront son nom.")) return;
    onUpdatePilotes(pilotes.filter((_, i) => i !== idx));
  };

  const addOrigine = () => {
    if (!nouvOrigine.trim()) return;
    if (origines.includes(nouvOrigine.trim())) { showToast("Cette origine existe déjà"); return; }
    onUpdateOrigines([...origines, nouvOrigine.trim()]);
    setNouvOrigine("");
  };
  const removeOrigine = (idx) => {
    if (!window.confirm("Supprimer cette origine ?")) return;
    onUpdateOrigines(origines.filter((_, i) => i !== idx));
  };

  return (
    <div style={{ maxWidth: 700, display: "flex", flexDirection: "column", gap: 20 }}>
      <div style={{ background: CARD, border: "none", boxShadow: CARD_SHADOW, borderRadius: 12, padding: 24 }}>
        <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 15, color: TEXT, marginBottom: 14 }}>Pilotes</div>
        {pilotes.map((p, i) => (
          <div key={i} style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8, flexWrap: "wrap" }}>
            <input value={p.nom} onChange={(e) => editPilote(i, { nom: e.target.value })} style={{ ...inputStyle, flex: 1, minWidth: 140 }} />
            <input value={p.email} onChange={(e) => editPilote(i, { email: e.target.value })} style={{ ...inputStyle, flex: 1, minWidth: 180 }} />
            <button onClick={() => removePilote(i)} style={{ ...btnSecondary, padding: "8px 10px", color: "#B23A2E" }}><Icon name="trash" size={14} /></button>
          </div>
        ))}
        {pilotes.length === 0 && <div style={{ fontSize: 13, color: TEXT_MUTE, fontStyle: "italic", marginBottom: 10 }}>Aucun pilote enregistré.</div>}
        <div style={{ display: "flex", gap: 8, marginTop: 12, flexWrap: "wrap" }}>
          <input placeholder="Nom du nouveau pilote" value={nomP} onChange={(e) => setNomP(e.target.value)} style={{ ...inputStyle, flex: 1, minWidth: 140 }} />
          <input placeholder="Adresse mail" value={emailP} onChange={(e) => setEmailP(e.target.value)} style={{ ...inputStyle, flex: 1, minWidth: 180 }} />
          <button onClick={addPilote} style={btnPrimary}><Icon name="plus" size={14} color="#fff" /> Ajouter</button>
        </div>
      </div>

      <div style={{ background: CARD, border: "none", boxShadow: CARD_SHADOW, borderRadius: 12, padding: 24 }}>
        <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 15, color: TEXT, marginBottom: 14 }}>Origines</div>
        {origines.map((o, i) => (
          <div key={i} style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8 }}>
            <div style={{ flex: 1, fontSize: 13.5, color: TEXT, padding: "8px 10px", background: PAPER, borderRadius: 7 }}>{o}</div>
            <button onClick={() => removeOrigine(i)} style={{ ...btnSecondary, padding: "8px 10px", color: "#B23A2E" }}><Icon name="trash" size={14} /></button>
          </div>
        ))}
        {origines.length === 0 && <div style={{ fontSize: 13, color: TEXT_MUTE, fontStyle: "italic", marginBottom: 10 }}>Aucune origine enregistrée.</div>}
        <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
          <input placeholder="Nouvelle origine" value={nouvOrigine} onChange={(e) => setNouvOrigine(e.target.value)} style={{ ...inputStyle, flex: 1 }} />
          <button onClick={addOrigine} style={btnPrimary}><Icon name="plus" size={14} color="#fff" /> Ajouter</button>
        </div>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  Indicateurs QSE — constantes et calculs                             */
/* ------------------------------------------------------------------ */
const SEED_AXES = [
  { id: "client", label: "Qualité & Satisfaction Client", color: "#2C6E9E", icon: "client", title: "Améliorer nos services et nos prestations par l’innovation et l’exigence, toujours dans un souci de proximité vis à vis de nos clients et de réactivité à leur sollicitation" },
  { id: "conformite", label: "Conformité Réglementaire", color: "#5B6470", icon: "conformite", title: "Veiller à la conformité de nos pratiques par rapport aux exigences légales, réglementaires et normatives applicables" },
  { id: "securite", label: "Sécurité & Prévention", color: "#C1272D", icon: "securite", title: "Assurer la sécurité de nos salariés et développer une réelle culture de la prévention des risques partagée par tous" },
  { id: "performance", label: "Performance & Organisation", color: "#1F7A6C", icon: "performance", title: "Améliorer nos méthodes de travail et nos organisations par le professionnalisme de tous dans la finalité d'optimiser nos couts et de faire progresser nos performances" },
  { id: "environnement", label: "Environnement", color: "#2E7D46", icon: "environnement", title: "Préserver l’environnement, réduire notre empreinte écologique et améliorer notre performance environnementale" },
];
const AXE_PALETTE = ["#2C6E9E", "#5B6470", "#C1272D", "#1F7A6C", "#2E7D46", "#8B5CF6", "#B8860B", "#946B4E"];
const axeColor = (id, axes) => { const list = axes && axes.length ? axes : SEED_AXES; return (list.find((a) => a.id === id) || list[0] || { color: "#6B7280" }).color; };
const axeLabel = (id, axes) => { const list = axes && axes.length ? axes : SEED_AXES; return (list.find((a) => a.id === id) || {}).label || id; };
const MOIS = ["Jan", "Fév", "Mar", "Avr", "Mai", "Jun", "Jul", "Aoû", "Sep", "Oct", "Nov", "Déc"];
const AGG_OPTIONS = [
  { value: "mensuel", label: "Dernier mois renseigné" },
  { value: "moyenne", label: "Moyenne mensuelle" },
  { value: "cumul", label: "Cumul annuel" },
  { value: "trimestriel", label: "Dernier trimestre renseigné" },
  { value: "annuel", label: "Valeur annuelle" },
];
const INDIC_STATUT_COLOR = { "Atteint": "#4F7942", "Proche": "#B8860B", "En écart": "#B23A2E", "Non renseigné": "#8A93A3" };

function computeResultat(ind) {
  const vals = (ind.monthly || []).filter((v) => v !== null && v !== undefined && v !== "");
  if (vals.length === 0) return null;
  if (ind.agg === "cumul") return vals.reduce((s, v) => s + v, 0);
  if (ind.agg === "moyenne") return vals.reduce((s, v) => s + v, 0) / vals.length;
  return vals[vals.length - 1];
}
function computeEcart(ind, resultat) {
  if (resultat === null || !ind.cible) return null;
  const dir = ind.direction || 1;
  return dir === 1 ? (resultat - ind.cible) / Math.abs(ind.cible) : (ind.cible - resultat) / Math.abs(ind.cible);
}
function statutIndicateur(ind) {
  const resultat = computeResultat(ind);
  const ecart = computeEcart(ind, resultat);
  if (resultat === null || ecart === null) return "Non renseigné";
  if (ecart >= 0) return "Atteint";
  if (ecart >= -0.1) return "Proche";
  return "En écart";
}
function fmtValeur(v, unite) {
  if (v === null || v === undefined || isNaN(v)) return "—";
  if (unite === "%") return (Math.round(v * 1000) / 10).toLocaleString("fr-FR") + " %";
  const rounded = Math.round(v * 100) / 100;
  return rounded.toLocaleString("fr-FR") + (unite && unite !== "Nombre" ? " " + unite : "");
}
function toEditVal(v, unite) {
  if (v === null || v === undefined) return "";
  return unite === "%" ? Math.round(v * 1000) / 10 : v;
}
function fromEditVal(str, unite) {
  if (str === "" || str === null || str === undefined) return null;
  const n = Number(str);
  if (isNaN(n)) return null;
  return unite === "%" ? n / 100 : n;
}

function fmtAxisValue(v, unite) {
  if (v === null || v === undefined || isNaN(v)) return "—";
  if (unite === "%") return Math.round(v * 1000) / 10 + " %";
  if (Math.abs(v) >= 10000) return Math.round(v / 1000) + " k";
  return (Math.round(v * 100) / 100).toLocaleString("fr-FR");
}

function ChartSvg({ monthly, color, cible, unite, width, height, big, type }) {
  const padX = big ? 44 : 10;
  const padTop = big ? 26 : 15;
  const padBottom = big ? 34 : 18;
  const pts = monthly.map((v, i) => ({ v, i })).filter((p) => p.v !== null && p.v !== undefined);
  if (pts.length === 0) {
    return <div style={{ fontSize: 12.5, color: TEXT_MUTE, fontStyle: "italic", padding: "20px 0" }}>Aucune valeur mensuelle renseignée.</div>;
  }
  const allVals = pts.map((p) => p.v);
  let axisMin = Math.min(0, ...allVals);
  let axisMax = Math.max(...allVals);
  if (cible !== null && cible !== undefined && !isNaN(cible)) {
    axisMax = Math.max(axisMax, cible);
    axisMin = Math.min(axisMin, cible);
  }
  if (axisMax === axisMin) axisMax = axisMin + 1;
  axisMax += (axisMax - axisMin) * 0.12;

  const plotH = height - padTop - padBottom;
  const plotW = width - padX * 2;
  const stepX = plotW / 11;
  const yFor = (v) => padTop + plotH - ((v - axisMin) / (axisMax - axisMin)) * plotH;
  const coords = pts.map((p) => ({ x: padX + p.i * stepX, y: yFor(p.v), v: p.v, i: p.i }));
  const path = coords.map((c, idx) => (idx === 0 ? "M" : "L") + c.x.toFixed(1) + " " + c.y.toFixed(1)).join(" ");
  const gridLines = Array.from({ length: 5 }, (_, i) => axisMin + (axisMax - axisMin) * (i / 4));
  const hasCible = cible !== null && cible !== undefined && !isNaN(cible);
  const isBar = type === "bar";
  const barW = Math.min(stepX * 0.55, big ? 34 : 12);

  return (
    <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="xMidYMid meet">
      {gridLines.map((gv, i) => (
        <g key={i}>
          <line x1={padX} y1={yFor(gv)} x2={width - padX} y2={yFor(gv)} stroke={LINE} strokeWidth="1" strokeDasharray={Math.abs(gv) < 1e-9 ? "0" : "2,3"} />
          {big && <text x={padX - 8} y={yFor(gv) + 3} textAnchor="end" fontSize="9.5" fontFamily="'IBM Plex Mono', monospace" fill={TEXT_MUTE}>{fmtAxisValue(gv, unite)}</text>}
        </g>
      ))}
      {hasCible && (
        <g>
          <line x1={padX} y1={yFor(cible)} x2={width - padX} y2={yFor(cible)} stroke="#D98C2B" strokeWidth="1.5" strokeDasharray="5,3" />
          <text x={width - padX} y={yFor(cible) - 5} textAnchor="end" fontSize={big ? 10.5 : 8.5} fontFamily="'Inter', sans-serif" fill="#D98C2B" fontWeight="600">
            Cible {fmtAxisValue(cible, unite)}
          </text>
        </g>
      )}
      {isBar ? (
        coords.map((c, idx) => (
          <g key={idx}>
            <rect x={c.x - barW / 2} y={Math.min(c.y, yFor(0))} width={barW} height={Math.abs(yFor(0) - c.y)} rx="3" fill={color} />
            {big && <title>{MOIS[c.i]} : {fmtAxisValue(c.v, unite)}</title>}
          </g>
        ))
      ) : (
        <React.Fragment>
          <path d={path} fill="none" stroke={color} strokeWidth={big ? 2.5 : 2} />
          {coords.map((c, idx) => (
            <g key={idx}>
              <circle cx={c.x} cy={c.y} r={big ? 4 : 2.8} fill={color} />
              {big && <title>{MOIS[c.i]} : {fmtAxisValue(c.v, unite)}</title>}
            </g>
          ))}
        </React.Fragment>
      )}
      {MOIS.map((m, i) => (
        <text key={i} x={padX + i * stepX} y={height - (big ? 10 : 3)} textAnchor="middle" fontSize={big ? 10.5 : 8.5} fontFamily="'Inter', sans-serif" fill={TEXT_MUTE}>
          {big ? m : m[0]}
        </text>
      ))}
    </svg>
  );
}

function MiniLineChart({ monthly, color, cible, unite }) {

        {hasData && <div style={{ fontSize: 10.5, color: TEXT_MUTE, textAlign: "center", marginTop: 2 }}>Cliquer pour agrandir</div>}

          <div onClick={(e) => e.stopPropagation()} style={{ background: "#fff", borderRadius: 14, padding: "22px 26px", maxWidth: 720, width: "100%", boxShadow: "0 20px 50px rgba(0,0,0,0.28)" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>

}

function IndicateurCard({ ind, onUpdate, onDelete, axes, allIndicateurs, focusRequest }) {
  const [open, setOpen] = useState(false);
  const cardRef = React.useRef(null);
  const resultat = computeResultat(ind);
  const statut = statutIndicateur(ind);
  const color = axeColor(ind.axe, axes);
  const master = ind.parentId ? allIndicateurs.find((i) => i.id === ind.parentId) : null;
  const enfants = allIndicateurs.filter((i) => i.parentId === ind.id);

  useEffect(() => {
    if (focusRequest && focusRequest.id === ind.id) {
      setOpen(true);
      requestAnimationFrame(() => { if (cardRef.current) cardRef.current.scrollIntoView({ behavior: "smooth", block: "center" }); });
    }
  }, [focusRequest]);

  return (
    <div ref={cardRef} style={{ background: CARD, borderRadius: 12, border: `1px solid ${LINE}`, borderLeft: `4px solid ${color}`, marginBottom: 12, overflow: "hidden", boxShadow: CARD_SHADOW }}>
      <div onClick={() => setOpen((o) => !o)} style={{ padding: "14px 16px", cursor: "pointer", display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", background: INDIC_STATUT_COLOR[statut] + "0D" }}>
        <Icon name={open ? "chevronDown" : "chevronRight"} size={16} color={TEXT_MUTE} />
        <div style={{ flex: 1, minWidth: 200 }}>
          <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 14, color: TEXT }}>{ind.indicateur}</div>
          <div style={{ fontSize: 12, color: TEXT_MUTE, marginTop: 2 }}>
            {ind.processus}
            {master && <span style={{ marginLeft: 8, color: NAVY }}><Icon name="link" size={10} /> lié à : {master.indicateur}</span>}
            {enfants.length > 0 && <span style={{ marginLeft: 8, color: NAVY }}><Icon name="link" size={10} /> {enfants.length} indicateur(s) lié(s)</span>}
          </div>
        </div>
        <div style={{ fontSize: 12.5, color: TEXT, fontFamily: "'IBM Plex Mono', monospace", whiteSpace: "nowrap" }}>
          {fmtValeur(resultat, ind.unite)} <span style={{ color: TEXT_MUTE }}>/ cible {fmtValeur(ind.cible, ind.unite)}</span>
        </div>
        <Badge color={INDIC_STATUT_COLOR[statut]}>{statut}</Badge>
      </div>

      {open && (
        <div style={{ padding: "0 16px 18px 44px", borderTop: `1px solid ${LINE}` }}>
          <div style={{ display: "flex", gap: 24, flexWrap: "wrap", margin: "14px 0" }}>
            <div style={{ flex: "1 1 240px", minWidth: 220 }}>
              <div style={labelStyle}>Objectif</div>
              <EditableField value={ind.objectif} onCommit={(v) => onUpdate(ind.id, { objectif: v })} placeholder="Objectif visé..." multiline />
            </div>
            <div style={{ flex: "1 1 200px", minWidth: 200 }}>
              <div style={labelStyle}>Processus</div>
              <EditableField value={ind.processus} onCommit={(v) => onUpdate(ind.id, { processus: v })} placeholder="Processus concerné..." />
            </div>
          </div>

          <div style={{ display: "flex", gap: 20, flexWrap: "wrap", margin: "10px 0 16px" }}>
            <div>
              <div style={labelStyle}>Unité</div>
              <input value={ind.unite || ""} onChange={(e) => onUpdate(ind.id, { unite: e.target.value })} style={{ ...selectStyle, width: 90 }} />
            </div>
            <div>
              <div style={labelStyle}>Cible</div>
              <input type="number" step="any" value={toEditVal(ind.cible, ind.unite)} onChange={(e) => onUpdate(ind.id, { cible: fromEditVal(e.target.value, ind.unite) })} style={{ ...selectStyle, width: 90 }} />
            </div>
            <div>
              <div style={labelStyle}>Sens souhaité</div>
              <select value={ind.direction} onChange={(e) => onUpdate(ind.id, { direction: Number(e.target.value) })} style={selectStyle}>
                <option value={1}>Plus haut = mieux</option>
                <option value={-1}>Plus bas = mieux</option>
              </select>
            </div>
            <div>
              <div style={labelStyle}>Mode de calcul</div>
              <select value={ind.agg} onChange={(e) => onUpdate(ind.id, { agg: e.target.value })} style={selectStyle}>
                {AGG_OPTIONS.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
              </select>
            </div>
          </div>

          <div style={labelStyle}>Indicateur maître (optionnel)</div>
          <div style={{ marginBottom: 16 }}>
            <select
              value={ind.parentId || ""}
              onChange={(e) => onUpdate(ind.id, { parentId: e.target.value || null })}
              style={{ ...inputStyle, width: "100%" }}
            >
              <option value="">Aucun — indicateur indépendant</option>
              {allIndicateurs.filter((i) => i.id !== ind.id && i.parentId !== ind.id).map((i) => (
                <option key={i.id} value={i.id}>{axeLabel(i.axe, axes)} — {i.indicateur}</option>
              ))}
            </select>
            <div style={{ fontSize: 11.5, color: TEXT_MUTE, marginTop: 4 }}>

              <div key={i}>
                <div style={{ fontSize: 10, color: TEXT_MUTE, textAlign: "center", marginBottom: 3 }}>{m}</div>
                <input
                  type="number" step="any"
                  value={toEditVal(ind.monthly[i], ind.unite)}
                  onChange={(e) => {
                    const next = ind.monthly.slice();
                    next[i] = fromEditVal(e.target.value, ind.unite);
                    onUpdate(ind.id, { monthly: next });
                  }}
                  style={{ ...inputStyle, width: "100%", padding: "6px 4px", fontSize: 12, textAlign: "center" }}
                />
              </div>
            ))}
          </div>

          <div style={labelStyle}>Évolution mensuelle</div>
          <div style={{ marginBottom: 16 }}>
            <MiniLineChart monthly={ind.monthly} color={color} cible={ind.cible} unite={ind.unite} />
          </div>

          <div style={labelStyle}>Commentaire de pilotage</div>
          <div style={{ marginBottom: 16 }}>
            <EditableField value={ind.commentaire} onCommit={(v) => onUpdate(ind.id, { commentaire: v })} placeholder="Analyse, contexte, plan d'amélioration..." multiline />
          </div>

          {enfants.length > 0 && (
            <div style={{ marginBottom: 16 }}>
              <div style={{ ...labelStyle, display: "flex", alignItems: "center", gap: 6 }}>
                <Icon name="link" size={12} color={TEXT_MUTE} /> Indicateurs liés ({enfants.length})
              </div>
              <div style={{ marginTop: 8, paddingLeft: 14, borderLeft: `2px solid ${LINE}` }}>
                {enfants.map((child) => (
                  <IndicateurCard key={child.id} ind={child} onUpdate={onUpdate} onDelete={onDelete} axes={axes} allIndicateurs={allIndicateurs} focusRequest={focusRequest} />
                ))}
              </div>
            </div>
          )}

          <button
            onClick={() => { if (window.confirm("Supprimer définitivement cet indicateur ?")) onDelete(ind.id); }}
            style={{ ...btnSecondary, color: "#B23A2E", borderColor: "#E8C6C2" }}
          >
            <Icon name="trash" size={14} /> Supprimer
          </button>
        </div>
      )}
    </div>
  );
}

}

function b64DecodeUtf8(b64str) {
  const bin = atob(b64str);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
const REVUE_QSE_TEMPLATE_PARTS_BY_AGENCY = {

  Valence: "const STORAGE_KEY = 'dashboard_state';",

function getRevueQSETemplate(agencyName) {
  const parts = REVUE_QSE_TEMPLATE_PARTS_BY_AGENCY[agencyName] || REVUE_QSE_TEMPLATE_B64_PARTS_LYON;
  return b64DecodeUtf8(parts.join(""));
}

/* ------------------------------------------------------------------ */
/*  Sauvegarde en ligne (dépôt GitHub privé) — pour un accès depuis     */
/*  n'importe où, sans dépendre du réseau d'entreprise.                 */
/* ------------------------------------------------------------------ */
function utf8ToB64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin);
}
// La sauvegarde en ligne passe par un petit relais (Cloudflare Worker) qui détient le vrai
// jeton GitHub côté serveur. Le navigateur ne connaît qu'une "clé d'application" (APP_KEY) qui
// n'ouvre accès qu'à ce relais — jamais un vrai jeton GitHub, qui serait automatiquement révoqué
// s'il était exposé dans ce fichier public (voir worker_relais_github.js pour le déploiement).
async function githubGetFile(cfg) {
  const res = await fetch(cfg.workerUrl + (cfg.workerUrl.includes("?") ? "&" : "?") + "t=" + Date.now(), {
    headers: { "X-App-Key": cfg.appKey },
  });
  if (res.status === 404) return { content: null, sha: null };
  if (res.status === 401) throw new Error("Clé d'application invalide : vérifiez qu'elle correspond exactement à celle du Worker (APP_KEY).");
  if (res.status === 502) { const d = await res.json().catch(() => null); throw new Error((d && d.message) || "GitHub a refusé la requête : vérifiez le token GitHub dans les réglages du Worker (pas dans l'outil)."); }
  if (!res.ok) throw new Error("Erreur du relais (" + res.status + ")");
  const data = await res.json();
  if (!data || !data.content) return { content: null, sha: (data && data.sha) || null };
  const content = b64DecodeUtf8((data.content || "").replace(/\n/g, ""));
  return { content, sha: data.sha };
}
async function githubPutFile(cfg, contentStr, sha, message) {
  const body = { message: message || "Mise à jour depuis l'outil Plan d'action", content: utf8ToB64(contentStr) };
  if (sha) body.sha = sha;
  const res = await fetch(cfg.workerUrl, {
    method: "PUT",
    headers: { "X-App-Key": cfg.appKey, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (res.status === 401) throw new Error("Clé d'application invalide : vérifiez qu'elle correspond exactement à celle du Worker (APP_KEY).");
  if (res.status === 502) { const d = await res.json().catch(() => null); throw new Error((d && d.message) || "GitHub a refusé la requête : vérifiez le token GitHub dans les réglages du Worker (pas dans l'outil)."); }
  if (res.status === 409) throw new Error("Le fichier a été modifié entre-temps par quelqu'un d'autre : rechargez avant d'enregistrer.");
  if (!res.ok) { const t = await res.text(); throw new Error("Erreur du relais (" + res.status + ") : " + t.slice(0, 200)); }
  return await res.json();
}
async function githubTestConnection(cfg) {
  const { sha } = await githubGetFile(cfg);
  return { ok: true, existe: sha !== null };
}

const QUARTER_LABELS = { 1: "Janvier à Mars", 2: "Janvier à Juin", 3: "Janvier à Septembre", 4: "Janvier à Décembre" };
const QUARTER_SEM = { 1: "T1", 2: "S1", 3: "T3 (9 mois)", 4: "Année complète" };
function monthsThroughQuarter(q) { return Array.from({ length: q * 3 }, (_, i) => i); }
function quarterOfISO(iso) { if (!iso) return null; const m = Number(iso.slice(5, 7)); return Math.ceil(m / 3) || 1; }
const REVUE_ICONS_CONNUES = ["client", "conformite", "securite", "performance", "environnement"];

function toRevueAxeJson(axe) {
  return {
    id: axe.id, label: axe.label, color: axe.color,
    icon: REVUE_ICONS_CONNUES.includes(axe.icon) ? axe.icon : (REVUE_ICONS_CONNUES.includes(axe.id) ? axe.id : "client"),
    title: axe.title || axe.label,
  };
}
function toRevueIndicateurJson(ind, quarter) {
  const keepMonths = monthsThroughQuarter(quarter);
  const monthly = ind.monthly.map((v, i) => (keepMonths.includes(i) ? v : null));
  const truncated = { ...ind, monthly };
  const resultat = computeResultat(truncated);
  const ecart = computeEcart(truncated, resultat);
  const commentaire = (ind.commentaires || [])
    .map((c) => `[T${quarterOfISO(c.date)} ${(c.date || "").slice(0, 4)}] ${c.texte}`)
    .join(String.fromCharCode(10) + String.fromCharCode(10)) || null;
  return {
    id: ind.id, axe: ind.axe, processus: ind.processus || "", objectif: ind.objectif || "",
    indicateur: ind.indicateur, res2025: (ind.resPrecedent === undefined ? null : ind.resPrecedent),
    cible2026: (ind.cible === undefined ? null : ind.cible), unite: ind.unite || "",
    monthly: monthly, resultat: resultat, uniteResultat: ind.unite || "",
    agg: ind.agg, direction: ind.direction, ecart: ecart, rawResultatNote: commentaire,
  };
}

// Correspondance entre les 6 domaines du plan d'action et les 5 axes SQE des revues QSE
// (choisie avec l'utilisateur : Qualité→Client, Sécurité→Sécurité, Environnement→Environnement,
// Exploitation→Performance, RH→Performance, Autre→non classé).
const DOMAINE_TO_AXIS = {
  "Qualité": "client",
  "Sécurité": "securite",
  "Environnement": "environnement",
  "Exploitation": "performance",
  "RH": "performance",
  "Autre": null,
};
// Statut du plan d'action -> statutOverride attendu par la revue QSE. "auto" laisse la revue
// QSE recalculer À faire / En cours / En retard elle-même à partir de l'échéance et de l'avancement.
function toRevueActionStatutOverride(action) {
  if (action.statut === "Terminé") return "Clôturée";
  if (action.statut === "Annulé") return "Abandonnée";
  return "auto";
}
function toRevueActionJson(action) {
  return {
    axisId: DOMAINE_TO_AXIS[action.domaine] || null,
    indicatorId: null,
    numero: action.numero || "",
    dateOuverture: action.dateCreation || "",
    origine: action.origine || "",
    anomalie: action.descriptionAnomalie || "",
    actionsText: action.titre || "",
    pilote: action.pilote || "",
    echeance: action.dateEcheance || "",
    priorite: action.priorite || "Moyenne",
    avancement: action.avancement || 0,
    statutOverride: toRevueActionStatutOverride(action),
    // Empêche cette action d'apparaître dans le petit bloc "Actions décidées" de son axe :
    // elle ne doit être visible que dans la Revue des actions consolidée, en fin de document.
    fromPlanAction: true,
  };
}

function buildRevueQSEFull(agencyName, year, quarter, axes, indicateurs, actions) {
  let html = getRevueQSETemplate(agencyName);

  const dataJson = JSON.stringify({
    axes: axes.map(toRevueAxeJson),
    indicateurs: indicateurs.map((ind) => toRevueIndicateurJson(ind, quarter)),
  });
  const actionsJson = JSON.stringify((actions || []).map(toRevueActionJson));

  const oldTitle = `<title>Revue QSE Trimestrielle — Agence de ${agencyName}</title>`;
  const newTitle = `<title>Revue QSE Trimestrielle — Agence de ${agencyName} — T${quarter} ${year}</title>`;
  const oldEyebrow = `Pizzorno Environnement · Agence de ${agencyName}`;
  const newEyebrow = `Pizzorno Environnement · Agence de ${agencyName}`;
  const oldSub = "Suivi des indicateurs de management 2026 — synthèse Janvier à Juin, projections de fin d'année et plans d'actions associés. Cliquez sur une fiche pour l'ouvrir en détail.";
  const newSub = `Suivi des indicateurs de management ${year} — synthèse ${QUARTER_LABELS[quarter]}, projections de fin d'année et plans d'actions associés. Cliquez sur une fiche pour l'ouvrir en détail.`;
  const oldMeta = 'Période analysée : <b>&nbsp;S1 2026</b>';
  const newMeta = `Période analysée : <b>&nbsp;${QUARTER_SEM[quarter]} ${year}</b>`;

  html = html.replace(oldTitle, newTitle);
  html = html.replace(oldEyebrow, newEyebrow);
  html = html.replace(oldSub, newSub);
  html = html.replace(oldMeta, newMeta);
  // Remplace le bloc de données embarqué (axes + indicateurs) par les données fraîches de l'outil.
  html = html.replace(/\{"axes":.*?"indicateurs": \[.*?\]\}/s, dataJson);
  // Remplace la liste d'actions embarquée (SEED_ACTIONS) par les actions à jour du plan d'action,
  // en conservant la ligne "const DATA = ..." qui la suit immédiatement dans les 3 modèles.
  html = html.replace(/const SEED_ACTIONS = \[[\s\S]*?\];([\s\S]*?)const DATA = JSON\.parse/, "const SEED_ACTIONS = " + actionsJson + ";$1const DATA = JSON.parse");

  // Chaque modèle enregistre ses modifications dans le navigateur sous une clé de stockage FIXE
  // (identique pour toutes les générations d'une même agence). Sans ce correctif, ouvrir plusieurs
  // revues (agences/trimestres différents) dans le même navigateur les fait se marcher dessus : la
  // plus récemment enregistrée écrase les données des autres au prochain chargement. On rend donc
  // cette clé unique à cette génération précise, et on neutralise le repli sur l'ancienne clé
  // partagée entre agences (quand le modèle en a une).
  const uniqueKey = "dashboard_state_" + agencyName.replace(/[^a-zA-Z0-9]/g, "") + "_T" + quarter + "_" + year;
  const oldStorageKeyLine = REVUE_QSE_OLD_STORAGE_KEY_LINE[agencyName] || "const STORAGE_KEY = 'dashboard_state';";
  html = html.replace(oldStorageKeyLine, "const STORAGE_KEY = '" + uniqueKey + "';");
  html = html.replace("const LEGACY_STORAGE_KEY = 'dashboard_state';", "const LEGACY_STORAGE_KEY = '" + uniqueKey + "__unused';");

  return html;
}

function IndicateursDashboard({ indicateurs, axes, setAxeTab, agency, actions }) {
  const total = indicateurs.length;
  const withStatut = indicateurs.map((i) => ({ ...i, _statut: statutIndicateur(i) }));
  const nonRenseignes = withStatut.filter((i) => i._statut === "Non renseigné").length;
  const atteints = withStatut.filter((i) => i._statut === "Atteint").length;
  const enEcart = withStatut.filter((i) => i._statut === "En écart").length;
  const renseignes = total - nonRenseignes;
  const tauxAtteinte = renseignes ? Math.round((atteints / renseignes) * 100) : 0;

  const parStatut = ["Atteint", "Proche", "En écart", "Non renseigné"]
    .map((s) => ({ name: s, value: withStatut.filter((i) => i._statut === s).length, color: INDIC_STATUT_COLOR[s] }))
    .filter((x) => x.value > 0);

  const parAxe = axes.map((a) => {
    const list = withStatut.filter((i) => i.axe === a.id);
    const renseignesAxe = list.filter((i) => i._statut !== "Non renseigné");
    const atteintsAxe = list.filter((i) => i._statut === "Atteint");
    const pct = renseignesAxe.length ? Math.round((atteintsAxe.length / renseignesAxe.length) * 100) : 0;
    return { name: a.label.split(" ")[0], value: pct, color: a.color, axeId: a.id };
  });

  const enEcartList = withStatut.filter((i) => i._statut === "En écart");

  const kpis = [
    { label: "Indicateurs suivis", value: total, icon: "list", color: NAVY },
    { label: "Taux d'atteinte", value: tauxAtteinte + "%", icon: "check", color: "#4F7942" },
    { label: "En écart", value: enEcart, icon: "alert", color: "#B23A2E" },
    { label: "Non renseignés", value: nonRenseignes, icon: "calendar", color: "#8A93A3" },
  ];

  const now = new Date();
  const [showRevuePicker, setShowRevuePicker] = useState(false);
  const [revueYear, setRevueYear] = useState(now.getFullYear());
  const [revueQuarter, setRevueQuarter] = useState(Math.floor(now.getMonth() / 3) + 1);

  const genererRevue = () => {
    const html = buildRevueQSEFull(agency, revueYear, revueQuarter, axes, indicateurs, actions);
    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `Revue_QSE_T${revueQuarter}_${revueYear}_${agency}.html`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setShowRevuePicker(false);
  };

  return (
    <div>
      {!LOCKED_AGENCY && (
        <div style={{ marginBottom: 18 }}>
          <div style={{ display: "flex", justifyContent: "flex-end" }}>
            <button onClick={() => setShowRevuePicker((s) => !s)} style={btnSecondary}>
              <Icon name="download" size={14} /> Générer la revue QSE...
            </button>
          </div>
          {showRevuePicker && (
            <div style={{ ...softCard, padding: 18, marginTop: 10 }}>
              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 14, color: TEXT, marginBottom: 12 }}>Revue QSE trimestrielle à générer</div>
              <div style={{ display: "flex", gap: 20, flexWrap: "wrap", alignItems: "flex-end", marginBottom: 16 }}>
                <div>
                  <div style={{ fontSize: 11, color: TEXT_MUTE, marginBottom: 5 }}>Trimestre</div>
                  <div style={{ display: "flex", gap: 6 }}>
                    {[1, 2, 3, 4].map((q) => (
                      <button key={q} onClick={() => setRevueQuarter(q)} style={{
                        padding: "8px 14px", borderRadius: 8, cursor: "pointer", fontSize: 13, fontWeight: 600,
                        border: `1px solid ${revueQuarter === q ? NAVY : LINE}`,
                        background: revueQuarter === q ? NAVY : "#fff", color: revueQuarter === q ? "#fff" : TEXT,
                      }}>T{q}</button>
                    ))}
                  </div>
                </div>
                <div>
                  <div style={{ fontSize: 11, color: TEXT_MUTE, marginBottom: 5 }}>Année</div>
                  <input type="number" value={revueYear} onChange={(e) => setRevueYear(Number(e.target.value))} style={{ ...inputStyle, width: 90 }} />
                </div>
                <div style={{ fontSize: 11.5, color: TEXT_MUTE }}>
                  Période prise en compte : <b>{QUARTER_LABELS[revueQuarter]} {revueYear}</b>
                </div>
              </div>
              <div style={{ fontSize: 11.5, color: TEXT_MUTE, marginBottom: 14 }}>
                Génère le modèle propre à <b>{agency}</b> (indicateurs + actions du plan d'action, avec la correspondance domaine → axe SQE), prêt à ouvrir pour la réunion.
              </div>
              <button onClick={genererRevue} style={btnPrimary}><Icon name="download" size={14} color="#fff" /> Télécharger le fichier HTML</button>
            </div>
          )}
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 14, marginBottom: 22 }}>
        {kpis.map((k) => (
          <div key={k.label} style={{ background: CARD, border: "none", boxShadow: CARD_SHADOW, borderRadius: 12, padding: "18px 20px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div style={{ fontSize: 12, color: TEXT_MUTE, fontWeight: 600, textTransform: "uppercase", letterSpacing: 0.4 }}>{k.label}</div>
              <Icon name={k.icon} size={16} color={k.color} />

function AxeIndicateurs({ indicateurs, axe, axes, onCreate, onUpdate, onDelete, onAddComment, focusRequest, cardView }) {
  const [q, setQ] = useState("");
  const [showNew, setShowNew] = useState(false);
  const [openId, setOpenId] = useState(null);
  const list = indicateurs.filter((i) => i.axe === axe.id);
  // Les indicateurs esclaves sont affichés imbriqués dans leur maître ; on ne montre ici
  // que les indicateurs de premier niveau (sans maître, ou dont le maître n'est pas dans cet axe).
  // Lors d'une recherche, on bascule en liste plate pour ne rien manquer.
  const topLevel = list.filter((i) => !i.parentId || !list.find((m) => m.id === i.parentId));
  const filtered = q
    ? list.filter((i) => i.indicateur.toLowerCase().includes(q.toLowerCase()))
    : topLevel;
  const openInd = openId ? indicateurs.find((i) => i.id === openId) : null;

  return (
    <div>
      <div style={{ display: "flex", gap: 10, marginBottom: 16, flexWrap: "wrap" }}>
        <div style={{ position: "relative", flex: 1, minWidth: 200 }}>
          <div style={{ position: "absolute", left: 10, top: 10 }}><Icon name="search" size={14} color={TEXT_MUTE} /></div>
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Rechercher un indicateur..." style={{ ...inputStyle, width: "100%", paddingLeft: 30 }} />
        </div>
        <button onClick={() => setShowNew((s) => !s)} style={btnPrimary}><Icon name="plusCircle" size={14} color="#fff" /> Nouvel indicateur</button>
      </div>
      {showNew && <NouvelIndicateurForm axeId={axe.id} onCreate={(data) => { onCreate(data); setShowNew(false); }} onCancel={() => setShowNew(false)} />}
      {filtered.length === 0 && <EmptyState icon="list" title={list.length === 0 ? `Aucun indicateur pour ${axe.label}` : "Aucun indicateur ne correspond"} subtitle={list.length === 0 ? "Ajoutez-en un avec le bouton ci-dessus." : "Essayez une autre recherche."} />}
      {cardView ? (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: 22 }}>
          {filtered.map((i) => <IndicateurCardFace key={i.id} ind={i} axes={axes} onClick={() => setOpenId(i.id)} />)}
        </div>
      ) : (
        filtered.map((i) => <IndicateurCard key={i.id} ind={i} onUpdate={onUpdate} onDelete={onDelete} axes={axes} allIndicateurs={indicateurs} focusRequest={focusRequest} />)
      )}
      {cardView && openInd && (
        <IndicateurDetailModal ind={openInd} axes={axes} allIndicateurs={indicateurs} onUpdate={onUpdate} onDelete={onDelete} onAddComment={onAddComment} onSelectId={setOpenId} onClose={() => setOpenId(null)} />
      )}
    </div>
  );
}

function ToutesIndicateurs({ indicateurs, axes, setAxeTab, agency }) {
  const [q, setQ] = useState("");
  const [fAxe, setFAxe] = usePersistentFilter("pa_filter_toutesind_axe__" + agency, []);
  const [fStatut, setFStatut] = usePersistentFilter("pa_filter_toutesind_statut__" + agency, []);
  const withStatut = indicateurs.map((i) => ({ ...i, _statut: statutIndicateur(i) }));
  const filtered = withStatut.filter((i) => {
    if (fAxe.length && !fAxe.includes(i.axe)) return false;
    if (fStatut.length && !fStatut.includes(i._statut)) return false;
    if (q && !i.indicateur.toLowerCase().includes(q.toLowerCase())) return false;
    return true;
  });
  const filtersActive = fAxe.length > 0 || fStatut.length > 0;
  const resetFilters = () => { setFAxe([]); setFStatut([]); };
  return (
    <div>
      <div style={{ display: "flex", gap: 10, marginBottom: 16, flexWrap: "wrap" }}>
        <div style={{ position: "relative", flex: 1, minWidth: 200 }}>
          <div style={{ position: "absolute", left: 10, top: 10 }}><Icon name="search" size={14} color={TEXT_MUTE} /></div>
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Rechercher un indicateur..." style={{ ...inputStyle, width: "100%", paddingLeft: 30 }} />
        </div>
        <MultiSelect label="Tous les axes" value={fAxe} onChange={setFAxe} options={axes.map((a) => ({ value: a.id, label: a.label }))} />
        <MultiSelect label="Tous les statuts" value={fStatut} onChange={setFStatut} options={["Atteint", "Proche", "En écart", "Non renseigné"].map((s) => ({ value: s, label: s }))} />
        <ResetFiltersButton active={filtersActive} onReset={resetFilters} />
      </div>
      <div style={{ fontSize: 12.5, color: TEXT_MUTE, marginBottom: 10 }}>{filtered.length} indicateur(s)</div>
      {filtered.length === 0 && <EmptyState icon="list" title="Aucun indicateur ne correspond" subtitle="Essayez d'élargir les filtres." />}
      {filtered.map((i) => (
        <div key={i.id} onClick={() => setAxeTab(i.axe)} style={{ display: "flex", alignItems: "center", gap: 12, background: INDIC_STATUT_COLOR[i._statut] + "0D", border: `1px solid ${LINE}`, borderLeft: `4px solid ${axeColor(i.axe, axes)}`, borderRadius: 8, padding: "12px 16px", marginBottom: 8, cursor: "pointer", flexWrap: "wrap" }}>
          <Badge color={axeColor(i.axe, axes)} soft>{axeLabel(i.axe, axes).split(" ")[0]}</Badge>
          {i.parentId && <Icon name="link" size={12} color={NAVY} />}
          <div style={{ flex: 1, fontSize: 13.5, color: TEXT, fontWeight: 500, minWidth: 160 }}>{i.indicateur}</div>
          <div style={{ fontSize: 12, fontFamily: "'IBM Plex Mono', monospace", color: TEXT_MUTE }}>{fmtValeur(computeResultat(i), i.unite)} / {fmtValeur(i.cible, i.unite)}</div>
          <Badge color={INDIC_STATUT_COLOR[i._statut]}>{i._statut}</Badge>
        </div>
      ))}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  Gestion des axes (créer / modifier / supprimer)                     */
/* ------------------------------------------------------------------ */
function GestionAxes({ axes, indicateurs, onUpdateAxes, showToast }) {
  const [nom, setNom] = useState("");
  const [couleur, setCouleur] = useState(AXE_PALETTE[axes.length % AXE_PALETTE.length]);

  const addAxe = () => {
    if (!nom.trim()) return;
    const id = sanitizeName(nom).toLowerCase() + "-" + Date.now().toString(36).slice(-4);
    if (axes.find((a) => a.label.toLowerCase() === nom.trim().toLowerCase())) { showToast("Cet axe existe déjà"); return; }
    onUpdateAxes([...axes, { id, label: nom.trim(), color: couleur }]);
    setNom(""); setCouleur(AXE_PALETTE[(axes.length + 1) % AXE_PALETTE.length]);
  };
  const editAxe = (idx, patch) => onUpdateAxes(axes.map((a, i) => (i === idx ? { ...a, ...patch } : a)));
  const removeAxe = (idx) => {
    const axe = axes[idx];
    const nbLies = indicateurs.filter((i) => i.axe === axe.id).length;
    if (nbLies > 0) { showToast(`Impossible : ${nbLies} indicateur(s) utilisent cet axe. Réaffectez-les d'abord.`); return; }
    if (!window.confirm(`Supprimer l'axe « ${axe.label} » ?`)) return;
    onUpdateAxes(axes.filter((_, i) => i !== idx));
  };

  return (
    <div style={{ maxWidth: 640 }}>
      <div style={{ background: CARD, border: "none", boxShadow: CARD_SHADOW, borderRadius: 12, padding: 24 }}>
        <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 600, fontSize: 15, color: TEXT, marginBottom: 14 }}>Axes de suivi</div>
        {axes.map((a, i) => (
          <div key={a.id} style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8, flexWrap: "wrap" }}>
            <input type="color" value={a.color} onChange={(e) => editAxe(i, { color: e.target.value })} style={{ width: 34, height: 34, padding: 0, border: `1px solid ${LINE}`, borderRadius: 6, cursor: "pointer" }} />
            <input value={a.label} onChange={(e) => editAxe(i, { label: e.target.value })} style={{ ...inputStyle, flex: 1, minWidth: 180 }} />
            <span style={{ fontSize: 11, color: TEXT_MUTE, fontFamily: "'IBM Plex Mono', monospace" }}>{indicateurs.filter((ind) => ind.axe === a.id).length} indicateur(s)</span>
            <button onClick={() => removeAxe(i)} style={{ ...btnSecondary, padding: "8px 10px", color: "#B23A2E" }}><Icon name="trash" size={14} /></button>
          </div>
        ))}
        {axes.length === 0 && <div style={{ fontSize: 13, color: TEXT_MUTE, fontStyle: "italic", marginBottom: 10 }}>Aucun axe défini.</div>}
        <div style={{ display: "flex", gap: 8, marginTop: 14, flexWrap: "wrap", alignItems: "center" }}>
          <input type="color" value={couleur} onChange={(e) => setCouleur(e.target.value)} style={{ width: 34, height: 34, padding: 0, border: `1px solid ${LINE}`, borderRadius: 6, cursor: "pointer" }} />
          <input placeholder="Nom du nouvel axe" value={nom} onChange={(e) => setNom(e.target.value)} style={{ ...inputStyle, flex: 1, minWidth: 180 }} />
          <button onClick={addAxe} style={btnPrimary}><Icon name="plus" size={14} color="#fff" /> Ajouter</button>
        </div>
      </div>
    </div>
  );
}

    try {
      const res = await withTimeout(archiveDirHandle.requestPermission({ mode: "readwrite" }), 15000, FSA_BLOCKED_MESSAGE);
      setArchiveDirPermGranted(res === "granted");
      showToast(res === "granted" ? "Accès au dossier d'archive autorisé" : "Accès refusé");
    } catch (e) {
      showToast(e && e.message ? e.message : "Impossible de demander l'autorisation");
    } finally { setFsaBusy(false); }
  };
  const forgetArchiveFolder = async () => {
    await idbClearHandle(idbKey(IDB_KEY_ARCHIVE_DIR, agencyRef.current));
    setArchiveDirHandle(null); setArchiveDirName(null); setArchiveDirPermGranted(false);
    showToast("Dossier d'archive délié");
  };
  // Écrit une nouvelle copie datée dans le dossier d'archive lié (jamais d'écrasement du
  // fichier précédent). Ne fait rien silencieusement si le dossier n'est pas lié/autorisé —
  // c'est un "bonus" quand le réseau d'entreprise est disponible, pas un pré-requis.
  const writeArchiveCopy = async () => {
    if (!archiveDirHandle) return { done: false, reason: "non lié" };
    if (!(await hasPermission(archiveDirHandle, true))) return { done: false, reason: "accès non autorisé" };
    try {
      const now = new Date();
      const stamp = now.getFullYear() + "-" + pad2(now.getMonth() + 1) + "-" + pad2(now.getDate()) + "_" + pad2(now.getHours()) + "h" + pad2(now.getMinutes());
      const name = "sauvegarde_" + agencyRef.current + "_" + stamp + ".json";
      const handle = await archiveDirHandle.getFileHandle(name, { create: true });
      const writable = await handle.createWritable();
      await writable.write(JSON.stringify({ actions: actionsRef.current, pilotes: pilotesRef.current, origines: originesRef.current, indicateurs: indicateursRef.current, axes: axesRef.current, savedAt: now.toISOString() }, null, 2));
      await writable.close();
      return { done: true, name };
    } catch (e) {
      return { done: false, reason: e && e.message ? e.message : "erreur inconnue" };
    }
  };
  const addLocalFile = async (action, file) => {
    if (!dirHandle) { showToast("Liez d'abord un dossier de pièces jointes dans la barre latérale"); return; }
    if (!(await hasPermission(dirHandle, true))) { showToast("Cliquez d'abord sur « Autoriser l'accès » (barre latérale) avant d'importer un fichier"); return; }
    try {
      const folderName = sanitizeName(action.id) + "_" + sanitizeName(action.titre);
      const safeFileName = sanitizeFileName(file.name);
      const actionDir = await dirHandle.getDirectoryHandle(folderName, { create: true });
      const targetHandle = await actionDir.getFileHandle(safeFileName, { create: true });
      const writable = await targetHandle.createWritable();
      await writable.write(file);
      await writable.close();
      const pieces = [...(action.pieces || []), { type: "fichier", nom: safeFileName, dossier: folderName }];
      updateAction(action.id, { pieces });
      showToast("Fichier « " + safeFileName + " » enregistré");
    } catch (e) {
      showToast("Erreur lors de l'enregistrement du fichier : " + (e && e.message ? e.message : e));
    }
  };
  const openLocalFile = async (piece) => {
    if (!dirHandle) { showToast("Liez d'abord le dossier des pièces jointes pour ouvrir ce fichier"); return; }
    if (!(await hasPermission(dirHandle, false))) { showToast("Cliquez d'abord sur « Autoriser l'accès » (barre latérale) pour ouvrir ce fichier"); return; }
    try {
      const actionDir = await dirHandle.getDirectoryHandle(piece.dossier);
      const fh = await actionDir.getFileHandle(piece.nom);
      const file = await fh.getFile();
      const url = URL.createObjectURL(file);
      window.open(url, "_blank");
    } catch (e) {
      showToast("Fichier introuvable dans le dossier lié");
    }
  };
  const saveToFile = async () => {
    if (!fileHandle) { showToast("Liez d'abord un fichier de sauvegarde"); return; }
    if (!(await hasPermission(fileHandle, true))) { showToast("Cliquez d'abord sur « Autoriser l'accès » (barre latérale) avant d'enregistrer"); return; }
    setFileBusy(true);
    try {
      const writable = await fileHandle.createWritable();
      await writable.write(JSON.stringify({ actions: actionsRef.current, pilotes: pilotesRef.current, origines: originesRef.current, indicateurs: indicateursRef.current, axes: axesRef.current, savedAt: new Date().toISOString() }, null, 2));
      await writable.close();
      setDirtyMap((m) => ({ ...m, [agencyRef.current]: false }));
      showToast("Sauvegarde enregistrée dans " + fileHandle.name);
    } catch (e) {
      showToast("Erreur lors de la sauvegarde : " + (e && e.message ? e.message : e));
    } finally { setFileBusy(false); }
  };
  const loadFromFile = async () => {
    if (!fileHandle) { showToast("Liez d'abord un fichier de sauvegarde"); return; }
    if (!(await hasPermission(fileHandle, false))) { showToast("Cliquez d'abord sur « Autoriser l'accès » (barre latérale) avant de charger"); return; }
    setFileBusy(true);
    try {
      const file = await fileHandle.getFile();
      const text = await file.text();
      const data = JSON.parse(text);
      if (data.actions) persistActions(data.actions);
      if (data.pilotes) persistPilotes(data.pilotes);
      if (data.origines) persistOrigines(data.origines);
        if (data.indicateurs && data.indicateurs.length) persistIndicateurs(data.indicateurs);
        if (data.axes) persistAxes(data.axes);
      setDirtyMap((m) => ({ ...m, [agencyRef.current]: false }));
      showToast("Données chargées depuis " + fileHandle.name);
    } catch (e) {
      showToast("Erreur lors du chargement (fichier vide ou invalide ?)");
    } finally { setFileBusy(false); }
  };

  const githubShaRef = React.useRef(null);
  const saveOnline = async () => {
    if (!githubConfig || !githubConfig.appKey || !githubConfig.workerUrl) { showToast("Configurez d'abord la sauvegarde en ligne (Réglages)"); return; }
    setGithubBusy(true);
    try {
      const payload = JSON.stringify({ actions: actionsRef.current, pilotes: pilotesRef.current, origines: originesRef.current, indicateurs: indicateursRef.current, axes: axesRef.current, savedAt: new Date().toISOString() }, null, 2);
      const result = await githubPutFile(githubConfig, payload, githubShaRef.current, "Sauvegarde depuis l'outil — " + agencyRef.current);
      githubShaRef.current = result.content ? result.content.sha : null;
      setDirtyMap((m) => ({ ...m, [agencyRef.current]: false }));
      showToast("Sauvegarde envoyée en ligne");
    } catch (e) {
      showToast(e && e.message ? e.message : "Erreur lors de l'enregistrement en ligne");
    } finally { setGithubBusy(false); }
  };
  // Enregistrement unique et prioritaire : envoie en ligne, ET crée en plus une archive locale
  // datée si un dossier réseau est lié et accessible (silencieux si non disponible — ce n'est
  // qu'un "bonus" quand on est connecté au réseau d'entreprise, jamais un blocage).
  const saveEverywhere = async () => {
    const hasOnline = githubConfig && githubConfig.appKey && githubConfig.workerUrl;
    if (!hasOnline && !archiveDirHandle) { showToast("Configurez d'abord la sauvegarde en ligne (Réglages)"); return; }
    setGithubBusy(true);
    let onlineOk = false, onlineError = null;
    if (hasOnline) {
      try {
        const payload = JSON.stringify({ actions: actionsRef.current, pilotes: pilotesRef.current, origines: originesRef.current, indicateurs: indicateursRef.current, axes: axesRef.current, savedAt: new Date().toISOString() }, null, 2);
        const result = await githubPutFile(githubConfig, payload, githubShaRef.current, "Sauvegarde depuis l'outil — " + agencyRef.current);
        githubShaRef.current = result.content ? result.content.sha : null;
        onlineOk = true;
      } catch (e) { onlineError = e && e.message ? e.message : "erreur inconnue"; }
    }
    const archive = await writeArchiveCopy();
    setGithubBusy(false);
    setDirtyMap((m) => ({ ...m, [agencyRef.current]: false }));

    if (onlineOk && archive.done) showToast("Enregistré en ligne + archive locale créée (" + archive.name + ")");
    else if (onlineOk) showToast("Enregistré en ligne" + (archiveDirHandle ? " — archive locale non créée (" + archive.reason + ")" : ""));
    else if (archive.done) showToast("Archive locale créée (" + archive.name + ") — pas de sauvegarde en ligne : " + (onlineError || "non configurée"));
    else showToast(onlineError || "Aucune sauvegarde effectuée — vérifiez la configuration");
  };
  const loadOnline = async () => {
    if (!githubConfig || !githubConfig.appKey || !githubConfig.workerUrl) { showToast("Configurez d'abord la sauvegarde en ligne (Réglages)"); return; }
    setGithubBusy(true);
    try {
      const { content, sha } = await githubGetFile(githubConfig);
      githubShaRef.current = sha;
      if (!content) { showToast("Aucune sauvegarde en ligne pour l'instant — enregistrez une première fois"); return; }
      const data = JSON.parse(content);
      if (data.actions) persistActions(data.actions);
      if (data.pilotes) persistPilotes(data.pilotes);
      if (data.origines) persistOrigines(data.origines);
      if (data.indicateurs && data.indicateurs.length) persistIndicateurs(data.indicateurs);
      if (data.axes) persistAxes(data.axes);
      setDirtyMap((m) => ({ ...m, [agencyRef.current]: false }));
      showToast("Données chargées depuis la sauvegarde en ligne");
    } catch (e) {
      showToast(e && e.message ? e.message : "Erreur lors du chargement en ligne");

  useEffect(() => {

      loadOnline();

  }, [agency]);

  const createAction = (data) => {

    const action = {
      id: uid("A"), numero: computeNextNumero(actions.map((a) => a.numero)), domaine: data.domaine, titre: data.titre,
      origine: data.origine, descriptionAnomalie: data.descriptionAnomalie, mesureEfficacite: data.mesureEfficacite,
      pilote: data.pilote, emailPilote: data.emailPilote, statut: statutInitial, avancement, priorite: data.priorite || "Moyenne",
      dateCreation: todayISO(), dateEcheance: data.dateEcheance, dateCloture: statutInitial === "Terminé" ? todayISO() : null,
      commentaires: data.commentaireInitial ? [{ date: todayISO(), texte: data.commentaireInitial }] : [],
      pieces: [], dernModif: todayISO(),
    };
    persistActions([action, ...actions]);
    showToast("Action créée avec succès");
    return action;
  };
  const updateAction = (id, patch) => persistActions(actions.map((a) => (a.id === id ? { ...a, ...patch, dernModif: todayISO() } : a)));
  const addComment = (id, texte) => persistActions(actions.map((a) => a.id === id ? { ...a, commentaires: [...(a.commentaires || []), { date: todayISO(), texte }], dernModif: todayISO() } : a));
  const closeAction = (id) => { persistActions(actions.map((a) => a.id === id ? { ...a, statut: "Terminé", avancement: 100, dateCloture: todayISO(), dernModif: todayISO() } : a)); showToast("Action clôturée"); };
  const reopenAction = (id) => persistActions(actions.map((a) => a.id === id ? { ...a, statut: "En cours", dateCloture: null, dernModif: todayISO() } : a));
  const deleteAction = (id) => { persistActions(actions.filter((a) => a.id !== id)); showToast("Action supprimée"); };
  const addPilote = (p) => { if (pilotes.find((x) => x.nom === p.nom)) return; persistPilotes([...pilotes, p]); };
  const addOrigine = (o) => { if (origines.includes(o)) return; persistOrigines([...origines, o]); };

  const createIndicateur = (data) => {

    showToast("Indicateur créé");
  };
  const updateIndicateur = (id, patch) => persistIndicateurs(indicateurs.map((i) => (i.id === id ? { ...i, ...patch } : i)));
  const addIndicateurComment = (id, texte) => {
    persistIndicateurs(indicateurs.map((i) => (i.id === id ? { ...i, commentaires: [...(i.commentaires || []), { date: todayISO(), texte }] } : i)));
  };
  const deleteIndicateur = (id) => {
    persistIndicateurs(indicateurs.filter((i) => i.id !== id).map((i) => (i.parentId === id ? { ...i, parentId: null } : i)));
    showToast("Indicateur supprimé");
  };
  const openAxeTab = (axeId) => { setTab("axe-" + axeId); setFocusRequest(null); };

  const [importPreview, setImportPreview] = useState(null);
  const [importBusy, setImportBusy] = useState(false);
  const handleImportFile = async (file) => {
    setImportBusy(true);
    try {
      const result = await parseExcelFile(file, pilotes, origines);
      if (result.toImport.length === 0) { showToast("Aucune action détectée dans ce fichier"); return; }
      setImportPreview({ ...result, fileName: file.name });
    } catch (e) {
      showToast("Import impossible : " + e.message);
    } finally { setImportBusy(false); }
  };
  const confirmImport = () => {
    if (!importPreview) return;
    const numerosPool = actions.map((a) => a.numero);
    const cleaned = importPreview.toImport.map(({ domaineOriginal, ...a }) => {
      if (!a.numero) { a.numero = computeNextNumero(numerosPool); }
      numerosPool.push(a.numero);
      return a;
    });
    persistActions([...cleaned, ...actions]);
    if (importPreview.newPilotes.length) persistPilotes([...pilotes, ...importPreview.newPilotes]);
    if (importPreview.newOrigines.length) persistOrigines([...origines, ...importPreview.newOrigines]);
    showToast(`${cleaned.length} action(s) importée(s)`);
    setImportPreview(null);
  };
  const cancelImport = () => setImportPreview(null);

  const exportData = () => {
    const blob = new Blob([JSON.stringify({ actions, pilotes, origines, indicateurs, axes, exportedAt: new Date().toISOString() }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `plan_action_${agency.toLowerCase()}_${todayISO()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setDirtyMap((m) => ({ ...m, [agency]: false }));
    showToast("Export terminé");
  };
  const exportToMatricePAA = () => {
    const fmtDateExcel = (iso) => (iso ? fmtDate(iso) : "");
    const headers = [
      "N°", "Date", "Origine 1", "Origine 2", "Q", "S", "E", "Description de l'anomalie", "Actions",
      "Ressources", "Pilote de l'action", "Contributeurs", "Priorité", "Échéance", "Avancement",
      "Clôturée", "Date de clôture", "Mesure efficacité", "Action efficace ?", "Commentaires",
    ];
    const rows = actions.map((a) => ([
      a.numero || "",
      fmtDateExcel(a.dateCreation),
      a.origine || "",
      "",
      a.domaine === "Qualité" ? "X" : "",
      a.domaine === "Sécurité" ? "X" : "",
      a.domaine === "Environnement" ? "X" : "",
      a.descriptionAnomalie || "",
      a.titre || "",
      "",
      a.pilote || "",
      "",
      a.priorite || "",
      fmtDateExcel(a.dateEcheance),
      (a.avancement || 0) + "%",
      a.statut === "Terminé" ? "Oui" : a.statut === "Annulé" ? "Annulée" : "Non",

      a.mesureEfficacite || "",

    ws["!cols"] = [

      { wch: 34 }, { wch: 34 }, { wch: 16 }, { wch: 16 }, { wch: 16 }, { wch: 10 }, { wch: 11 },

  const importData = (e) => {

  const navItemsPlan = useMemo(() => ([
    { id: "dashboard", label: "Tableau de bord", icon: "dashboard" },
    { id: "nouvelle", label: "Nouvelle action", icon: "plusCircle" },
    { section: "Domaines" },

    { section: "Suivi" },

    ...(isMaitre ? [

        <div style={{ padding: "0 18px 18px" }}>

              display: "flex", alignItems: "center", justifyContent: "center",
            }}>
              <Icon name="check" size={17} color="#fff" />

              <div style={{ fontFamily: "'Space Grotesk', sans-serif", fontWeight: 700, fontSize: 14.5, letterSpacing: 0.1, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>

              </div>
              {LOCKED_AGENCY && <div style={{ fontSize: 11, color: "#8892A0", marginTop: 1 }}>{LOCKED_AGENCY}</div>}
            </div>
          </div>

          {ROLE_ACCESS_ENABLED && session && (

              <span style={{ fontSize: 11.5, color: "#C9E4CE", fontWeight: 600 }}>

                  }}

                  {ag}

            </div>

        </div>

        <div style={{ flex: 1, overflowY: "auto", padding: "4px 12px" }}>

            const active = tab === item.id;
            return (
